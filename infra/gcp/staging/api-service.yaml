apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: drts-api
  labels:
    app: drts-api
    env: staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Cloud SQL Auth Proxy built-in integration — socket at /cloudsql/<INSTANCE>
        run.googleapis.com/cloudsql-instances: "CLOUDSQL_INSTANCE_PLACEHOLDER"
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: SERVICE_ACCOUNT_PLACEHOLDER
      containers:
        - image: IMAGE_PLACEHOLDER
          name: drts-api
          ports:
            - name: http1
              containerPort: 3001
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: API_PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-db-url
            - name: API_KEY_SALT
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-api-key-salt
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-jwt-secret
            - name: WORKLOAD_IDENTITY_ISSUER
              value: WORKLOAD_IDENTITY_ISSUER_PLACEHOLDER
            - name: WORKLOAD_IDENTITY_AUDIENCE
              value: WORKLOAD_IDENTITY_AUDIENCE_PLACEHOLDER
            - name: WORKLOAD_IDENTITY_JWT_ALGORITHMS
              value: RS256
            - name: WORKLOAD_IDENTITY_JWT_SECRET_OR_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-workload-identity-jwt-public-key
            - name: WORKLOAD_IDENTITY_SERVICE_PRINCIPALS
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-workload-identity-service-principals
            - name: PLATFORM_ADMIN_ASSISTANT_ENABLED
              value: "false"
            - name: LLM_GATEWAY_PROVIDER
              value: mock
            - name: LLM_GATEWAY_CHAT_MODEL
              value: mock-chat-v1
            - name: LLM_GATEWAY_SUMMARIZER_MODEL
              value: mock-summary-v1
            - name: LLM_GATEWAY_DAILY_BUDGET_USD
              value: "25"
            - name: LLM_GATEWAY_REQUESTS_PER_MINUTE
              value: "30"
            - name: LLM_GATEWAY_INPUT_TOKENS_PER_MINUTE
              value: "120000"
            - name: LLM_GATEWAY_OUTPUT_TOKENS_PER_MINUTE
              value: "16000"
            - name: LLM_GATEWAY_TRANSCRIPT_RETENTION_DAYS
              value: "30"
            - name: LLM_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-llm-gateway-api-key
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
