apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: drts-voice-media-worker
  labels:
    app: drts-voice-media-worker
    env: staging
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # SD §3.4: Dedicated voice media worker deployment
        # WebSocket support: session affinity + explicit timeout up to 3600s
        run.googleapis.com/sessionAffinity: "true"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # Dedicated CPU (instance-based billing) so media audio stream and WebSockets are not throttled
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      timeoutSeconds: 3600
      serviceAccountName: SERVICE_ACCOUNT_PLACEHOLDER
      containers:
        - image: IMAGE_PLACEHOLDER
          name: drts-voice-media-worker
          ports:
            - name: http1
              containerPort: 3002
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: VOICE_MEDIA_PORT
              value: "3002"
            - name: VOICE_MEDIA_MAX_CONCURRENT_SESSIONS
              value: "100"
            - name: VOICE_MEDIA_WS_TIMEOUT_SECONDS
              value: "3600"
            - name: VOICE_MEDIA_DRAIN_TIMEOUT_SECONDS
              value: "30"
            - name: CONTROL_PLANE_API_ORIGIN
              value: CONTROL_PLANE_API_ORIGIN_PLACEHOLDER
            - name: TWM_ASR_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-twm-asr-api-key
            - name: TWM_TTS_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: drts-staging-twm-tts-api-key
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3
