name: Build Passenger App (Native, EAS)

# Manual hosted packaging. Wait for the remote native build and preserve its
# final JSON and stderr; success does not prove device installation or delivery.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
      profile:
        description: EAS profile; preview profiles are demo unless named configured
        required: true
        default: preview
        type: choice
        options:
          - preview
          - preview-simulator
          - configured-preview
          - production

permissions:
  contents: read

concurrency:
  group: build-passenger-native-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_PROFILE: ${{ inputs.profile }}
      PASSENGER_APP_EAS_PROJECT_ID: ${{ vars.PASSENGER_APP_EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/passenger-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Pass project linkage to the hosted builder
        shell: bash
        run: |
          set -euo pipefail
          jq --arg profile "$BUILD_PROFILE" \
            --arg project_id "$PASSENGER_APP_EAS_PROJECT_ID" '
              .build[$profile].env = ((.build[$profile].env // {}) +
                {"PASSENGER_APP_EAS_PROJECT_ID": $project_id})
            ' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json

      - name: Resolve selected native build configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.4.0 config \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            2>&1 | tee "$RUNNER_TEMP/passenger-eas-config.log"

      - name: Complete hosted native build
        shell: bash
        run: |
          set -euo pipefail
          build_exit=0
          npx --yes eas-cli@21.4.0 build \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --wait \
            --json \
            > "$RUNNER_TEMP/passenger-eas-build.json" \
            2> "$RUNNER_TEMP/passenger-eas-build.stderr.log" || build_exit=$?
          printf '%s\n' "$build_exit" > "$RUNNER_TEMP/passenger-eas-build.exit-code.txt"
          if (( build_exit != 0 )); then
            exit "$build_exit"
          fi
          if ! jq --exit-status '
            type == "array" and length == 1 and
            all(.[];
              .status == "FINISHED" and
              (.id | type == "string" and length > 0) and
              ([.artifacts.buildUrl, .artifacts.applicationArchiveUrl] |
                any(.[]; type == "string" and length > 0))
            )
          ' "$RUNNER_TEMP/passenger-eas-build.json" > /dev/null; then
            echo "::error::EAS did not return one finished build with an artifact URL."
            exit 1
          fi

      - name: Preserve configuration and final build receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: passenger-eas-build-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/passenger-eas-config.log
            ${{ runner.temp }}/passenger-eas-build.json
            ${{ runner.temp }}/passenger-eas-build.stderr.log
            ${{ runner.temp }}/passenger-eas-build.exit-code.txt
          if-no-files-found: ignore
