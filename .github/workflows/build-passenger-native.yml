name: Build Passenger App (Native, EAS)

# Manual hosted packaging. Wait for the remote native build and preserve a
# redacted receipt; success does not prove device installation or delivery.
#
# Logs and artifacts of this repository are public, and anyone who knows a build
# page or artifact URL can download the app. Neither EAS output nor its JSON may
# be published as is: the receipt holds no build id and no URL.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
      profile:
        description: EAS profile; preview profiles are demo unless named configured
        required: true
        default: preview
        type: choice
        options:
          - preview
          - preview-simulator
          - configured-preview
          - production

permissions:
  contents: read

concurrency:
  group: build-passenger-native-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_PLATFORM: ${{ inputs.platform }}
      BUILD_PROFILE: ${{ inputs.profile }}
      PASSENGER_APP_EAS_PROJECT_ID: ${{ vars.PASSENGER_APP_EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: apps/passenger-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Pass project linkage to the hosted builder
        shell: bash
        run: |
          set -euo pipefail
          jq --arg profile "$BUILD_PROFILE" \
            --arg project_id "$PASSENGER_APP_EAS_PROJECT_ID" '
              .build[$profile].env = ((.build[$profile].env // {}) +
                {"PASSENGER_APP_EAS_PROJECT_ID": $project_id})
            ' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json

      - name: Resolve selected native build configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@21.4.0 config \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive 2>&1 |
            sed -E \
              -e 's#(https?://|expo\.dev/)[^[:space:]"\\]+#[URL]#gI' \
              -e 's/AIza[0-9A-Za-z_-]{20,}/[REDACTED_MAP_KEY]/g' |
            tee "$RUNNER_TEMP/passenger-eas-config.log"

      - name: Complete hosted native build without publishing the build page
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/passenger-eas-build.json"
          log="$RUNNER_TEMP/passenger-eas-build.log"
          receipt="$RUNNER_TEMP/passenger-eas-build-receipt.json"
          redact() {
            sed -E \
              -e 's#(https?://|expo\.dev/)[^[:space:]"\\]+#[URL]#gI' \
              -e 's/[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/[ID]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{16}/[DEVICE]/g' \
              -e 's/AIza[0-9A-Za-z_-]{20,}/[REDACTED_MAP_KEY]/g'
          }
          build_exit=0
          npx --yes eas-cli@21.4.0 build \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --wait \
            --json > "$result" 2> "$log" || build_exit=$?
          if ! jq --exit-status 'type == "array" and length == 1' "$result" > /dev/null 2>&1; then
            echo "::error::EAS returned no build (exit $build_exit)."
            # The log also lists the Apple team and devices; print only errors.
            { grep -iE 'error|fail|cannot|not supported|not set up|limit|quota|denied|unauthorized' "$log" || true; } |
              redact | sed -E 's/[0-9a-fA-F]{40}/[DEVICE]/g' | tail -n 15
            exit 1
          fi
          jq --argjson exit_code "$build_exit" '.[0] | {
            exitCode: $exit_code,
            platform, status, buildProfile, distribution, channel,
            isForIosSimulator, sdkVersion,
            runtimeVersion: (.runtimeVersion.version? // .runtimeVersion // null),
            appVersion, appBuildVersion, gitCommitHash,
            createdAt, completedAt,
            error: (.error | if . == null then null else {errorCode, message} end)
          }' "$result" | redact > "$receipt"
          jq --raw-output 'to_entries[] | "\(.key)=\(.value)"' "$receipt"
          if (( build_exit != 0 )); then
            exit "$build_exit"
          fi
          [[ "$(jq --raw-output '.[0].status' "$result")" == "FINISHED" ]]
          artifact_url="$(jq --raw-output '.[0].artifacts | .applicationArchiveUrl // .buildUrl // empty' "$result")"
          if [[ -z "$artifact_url" ]]; then
            echo "::error::The finished build has no artifact."
            exit 1
          fi
          # Without a public artifact, the download may be a sign-in page.
          magic=""
          if curl --fail --silent --location --retry 3 --max-time 600 \
            --output "$RUNNER_TEMP/passenger-artifact" "$artifact_url"; then
            magic="$(head -c 2 "$RUNNER_TEMP/passenger-artifact" | od -An -tx1 | tr -d ' \n')"
          fi
          case "$magic" in
            504b|1f8b)
              jq \
                --argjson bytes "$(stat --format=%s "$RUNNER_TEMP/passenger-artifact")" \
                --arg sha256 "$(sha256sum "$RUNNER_TEMP/passenger-artifact" | cut -d' ' -f1)" \
                '. + {artifact: {bytes: $bytes, sha256: $sha256}}' \
                "$receipt" > "$receipt.tmp"
              mv "$receipt.tmp" "$receipt"
              jq --raw-output '"artifact_bytes=\(.artifact.bytes)\nartifact_sha256=\(.artifact.sha256)"' "$receipt"
              ;;
            *)
              echo "::warning::The build finished; its file needs an Expo sign-in to download, so it was not hashed."
              ;;
          esac

      - name: Preserve the redacted configuration and build receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: passenger-eas-build-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/passenger-eas-config.log
            ${{ runner.temp }}/passenger-eas-build-receipt.json
          if-no-files-found: ignore
