name: Build Driver App (iOS, EAS)

# Manual-only cloud build (iOS or Android) or read-only existing build lookup for
# apps/driver-app. It never runs on push or pull requests because builds consume
# paid EAS capacity and signing resources.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (build queues a native build; lookup-existing performs read-only EAS build:view and signed artifact verification; apple-signing-check reads the Apple identifier, capabilities and profiles)
        required: true
        default: build
        type: choice
        options:
          - build
          - lookup-existing
          - apple-signing-check
      platform:
        description: Native target platform for build mode
        required: false
        default: ios
        type: choice
        options:
          - ios
          - android
      profile:
        description: EAS build profile
        required: true
        default: development-simulator
        type: choice
        options:
          - development-simulator
          - development
          - preview
          - production
      api_url:
        description: Optional API origin override. An empty value uses the release environment for the selected profile.
        required: false
        default: ""
        type: string
      submit:
        description: Auto-submit the completed production build to TestFlight
        required: true
        default: false
        type: boolean
      refresh_apple_signing:
        description: iOS development or preview only. Turn Associated Domains on for the app identifier and regenerate the internal profile before the build
        required: false
        default: false
        type: boolean
      android_build_id:
        description: Controlled Driver Android EAS build UUID for lookup-existing mode
        required: false
        default: cb4b7f81-90bd-481e-970a-fbb1009582c0
        type: string
      ios_build_id:
        description: Controlled Driver iOS EAS build UUID for lookup-existing mode
        required: false
        default: 3f4d1b8b-9811-4d03-ab31-e7554de30bff
        type: string
      expected_source_sha:
        description: Expected 40-char git commit SHA for the existing builds in lookup-existing mode
        required: false
        default: 0e722795dec202e960e504a8fa67526fc567ed0f
        type: string

permissions:
  contents: read

concurrency:
  group: build-driver-ios-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.platform || 'ios' }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WORKFLOW_MODE: ${{ inputs.mode || 'build' }}
      BUILD_API_URL: ${{ inputs.api_url }}
      BUILD_PLATFORM: ${{ inputs.platform || 'ios' }}
      BUILD_PROFILE: ${{ inputs.profile }}
      PROD_RUNTIME_API_ORIGIN: ${{ vars.PROD_RUNTIME_API_ORIGIN }}
      DEV_CONTROL_PLANE_API_ORIGIN: ${{ vars.DEV_CONTROL_PLANE_API_ORIGIN }}
      DRIVER_APP_EAS_PROJECT_ID: ${{ vars.DRIVER_APP_EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUBMIT_TO_TESTFLIGHT: ${{ inputs.submit }}
      REFRESH_APPLE_SIGNING: ${{ inputs.refresh_apple_signing || false }}
      LOOKUP_ANDROID_BUILD_ID: ${{ inputs.android_build_id || 'cb4b7f81-90bd-481e-970a-fbb1009582c0' }}
      LOOKUP_IOS_BUILD_ID: ${{ inputs.ios_build_id || '3f4d1b8b-9811-4d03-ab31-e7554de30bff' }}
      LOOKUP_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || '0e722795dec202e960e504a8fa67526fc567ed0f' }}
    defaults:
      run:
        working-directory: apps/driver-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard credentials, project linkage, and inputs
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "::error::EXPO_TOKEN is not configured in GitHub Actions secrets."
            missing=1
          fi
          if [[ -z "${DRIVER_APP_EAS_PROJECT_ID:-}" ]]; then
            echo "::error::DRIVER_APP_EAS_PROJECT_ID is not configured in GitHub Actions variables."
            missing=1
          fi
          if (( missing != 0 )); then
            exit 1
          fi

          if [[ "${REFRESH_APPLE_SIGNING:-false}" == "true" ]]; then
            case "${WORKFLOW_MODE:-build}/${BUILD_PLATFORM:-ios}/$BUILD_PROFILE" in
              build/ios/development|build/ios/preview) ;;
              *)
                echo "::error::refresh_apple_signing is allowed only for an iOS development or preview build."
                exit 1
                ;;
            esac
          fi

          case "${WORKFLOW_MODE:-build}" in
            build)
              case "$BUILD_PROFILE" in
                development-simulator|development|preview|production) ;;
                *)
                  echo "::error::Unsupported EAS build profile: $BUILD_PROFILE"
                  exit 1
                  ;;
              esac

              if [[ -z "${BUILD_API_URL:-}" ]]; then
                if [[ "$BUILD_PROFILE" == "production" ]]; then
                  BUILD_API_URL="${PROD_RUNTIME_API_ORIGIN:-https://api.smarttransport.tw}"
                else
                  BUILD_API_URL="${DEV_CONTROL_PLANE_API_ORIGIN:-https://drts-dev-api-r6ykdme3wa-uc.a.run.app}"
                fi
              fi
              BUILD_API_URL="${BUILD_API_URL%/}"
              if [[ ! "$BUILD_API_URL" =~ ^https://[^[:space:]]+$ ]]; then
                echo "::error::api_url must be a direct HTTPS API origin."
                exit 1
              fi

              echo "BUILD_API_URL=$BUILD_API_URL" >> "$GITHUB_ENV"

              if [[ "$SUBMIT_TO_TESTFLIGHT" == "true" && "$BUILD_PROFILE" != "production" ]]; then
                echo "::error::TestFlight auto-submit is allowed only with the production profile."
                exit 1
              fi
              case "${BUILD_PLATFORM:-ios}" in
                ios) ;;
                android)
                  if [[ "$BUILD_PROFILE" == "development-simulator" ]]; then
                    echo "::error::The development-simulator profile builds iOS only."
                    exit 1
                  fi
                  if [[ "$SUBMIT_TO_TESTFLIGHT" == "true" ]]; then
                    echo "::error::TestFlight auto-submit is allowed only for iOS."
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::Unsupported native platform: $BUILD_PLATFORM"
                  exit 1
                  ;;
              esac
              ;;
            lookup-existing)
              if [[ "$SUBMIT_TO_TESTFLIGHT" == "true" ]]; then
                echo "::error::TestFlight submission is forbidden in lookup-existing mode."
                exit 1
              fi
              ;;
            apple-signing-check)
              if [[ "$SUBMIT_TO_TESTFLIGHT" == "true" ]]; then
                echo "::error::TestFlight submission is forbidden in apple-signing-check mode."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported workflow mode: ${WORKFLOW_MODE:-}"
              exit 1
              ;;
          esac

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Guard read-only existing build lookup inputs
        if: ${{ inputs.mode == 'lookup-existing' }}
        working-directory: .
        run: node operations/verification/native-existing-builds/lookup.cjs guard

      - name: Read back existing Driver EAS builds and inspect signed artifacts
        if: ${{ inputs.mode == 'lookup-existing' }}
        working-directory: .
        run: node operations/verification/native-existing-builds/lookup.cjs lookup

      - name: Upload redacted existing Driver build receipt
        if: ${{ always() && inputs.mode == 'lookup-existing' }}
        uses: actions/upload-artifact@v4
        with:
          name: driver-eas-existing-builds-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-existing-builds/driver-existing-builds-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Check Apple signing without changing it
        if: ${{ inputs.mode == 'apple-signing-check' }}
        working-directory: .
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node operations/native-signing/apple-signing.cjs check

      - name: Require the native map keys before consuming EAS capacity
        if: ${{ (inputs.mode || 'build') == 'build' }}
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_IOS_KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
        run: |
          set -euo pipefail
          for name in GOOGLE_MAPS_ANDROID_KEY GOOGLE_MAPS_IOS_KEY; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Install workspace dependencies
        if: ${{ (inputs.mode || 'build') == 'build' }}
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Verify API target before consuming EAS capacity
        if: ${{ (inputs.mode || 'build') == 'build' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            --max-time 20 \
            "${BUILD_API_URL%/}/health" >/dev/null

      - name: Prepare ephemeral EAS configuration
        if: ${{ (inputs.mode || 'build') == 'build' }}
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_IOS_KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
        run: |
          set -euo pipefail

          jq --arg project_id "$DRIVER_APP_EAS_PROJECT_ID" \
            --arg api_url "$BUILD_API_URL" \
            '.expo.extra.eas.projectId = $project_id | .expo.extra.apiBaseUrl = $api_url' \
            app.json > app.json.tmp
          mv app.json.tmp app.json

          jq --arg profile "$BUILD_PROFILE" \
            --arg api_url "${BUILD_API_URL%/}" '
              if (.build | has($profile) | not) then
                error("unknown build profile: " + $profile)
              else
                .build[$profile].env =
                  ((.build[$profile].env // {}) +
                    {"EXPO_PUBLIC_API_URL": $api_url} +
                    ({
                      "GOOGLE_MAPS_ANDROID_KEY": (env.GOOGLE_MAPS_ANDROID_KEY // ""),
                      "GOOGLE_MAPS_IOS_KEY": (env.GOOGLE_MAPS_IOS_KEY // "")
                    } | map_values(gsub("[[:space:]]"; "")) |
                      with_entries(select(.value != ""))))
                | if $profile == "production" then
                    .cli.appVersionSource = "remote"
                    | .build.production.autoIncrement = true
                  else
                    .
                  end
              end
            ' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json

          jq empty app.json
          jq empty eas.json

      # Map keys are baked into the app, but they must not reach the public log.
      - name: Validate resolved native build configuration
        if: ${{ (inputs.mode || 'build') == 'build' }}
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_IOS_KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
        run: |
          set -euo pipefail
          jq --exit-status --arg profile "$BUILD_PROFILE" '
            .build[$profile].env |
            [.GOOGLE_MAPS_ANDROID_KEY, .GOOGLE_MAPS_IOS_KEY] |
            all(.[]; type == "string" and length > 0)
          ' eas.json > /dev/null
          npx --yes eas-cli@21.4.0 config \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive 2>&1 |
            sed -E 's/AIza[0-9A-Za-z_-]{20,}/[REDACTED_MAP_KEY]/g'

      - name: Bundle the app before consuming EAS capacity
        if: ${{ (inputs.mode || 'build') == 'build' }}
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_IOS_KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
          DRTS_REQUIRE_LIVE_MAP: "true"
        run: |
          set -euo pipefail
          EXPO_PUBLIC_API_URL="$BUILD_API_URL" \
            pnpm exec expo export \
            --platform "$BUILD_PLATFORM" \
            --output-dir "$RUNNER_TEMP/driver-native-bundle" 2>&1 |
            sed -E 's/AIza[0-9A-Za-z_-]{20,}/[REDACTED_MAP_KEY]/g'

      # A capability change invalidates the app's existing profiles, so what EAS
      # needs to regenerate the internal one is checked first, and the change is
      # the last step before the build. EAS uses only these device classes.
      - name: Require a test device in EAS before Apple is changed
        if: ${{ (inputs.mode || 'build') == 'build' && inputs.refresh_apple_signing }}
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ ! "${APPLE_TEAM_ID:-}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID is not configured in GitHub Actions variables."
            exit 1
          fi
          devices="$(
            npx --yes eas-cli@21.4.0 device:list \
              --apple-team-id "$APPLE_TEAM_ID" --json --non-interactive 2> /dev/null |
              sed -n '/^\[/,$p' |
              jq --exit-status '[.[] | select(.deviceClass == "IPHONE" or .deviceClass == "IPAD")] | length'
          )" || { echo "::error::EAS did not list the devices."; exit 1; }
          echo "eas_devices=$devices"
          if (( devices == 0 )); then
            echo "::error::No iPhone or iPad is registered in EAS. Run eas device:create first."
            exit 1
          fi

      - name: Turn Associated Domains on before the profile is regenerated
        if: ${{ (inputs.mode || 'build') == 'build' && inputs.refresh_apple_signing }}
        working-directory: .
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_KEY_FILE: ${{ runner.temp }}/apple-key.p8
        run: node operations/native-signing/apple-signing.cjs ensure

      # Anyone who knows the page of an internal build can download it, and the
      # app holds the map key. Nothing EAS prints may reach the public log: only
      # the fields below do, with no build id or URL.
      - name: Build on EAS without publishing the build page
        if: ${{ (inputs.mode || 'build') == 'build' && inputs.submit == false }}
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_IOS_KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
          ASC_KEY_ID: ${{ inputs.refresh_apple_signing && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID: ${{ inputs.refresh_apple_signing && secrets.ASC_ISSUER_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.refresh_apple_signing && vars.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/driver-eas-build.json"
          log="$RUNNER_TEMP/driver-eas-build.log"
          redact() {
            sed -E \
              -e 's#(https?://|expo\.dev/)[^[:space:]"\\]+#[URL]#gI' \
              -e 's/[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/[ID]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{16}/[DEVICE]/g' \
              -e 's/AIza[0-9A-Za-z_-]{20,}/[REDACTED_MAP_KEY]/g'
          }
          redact_error() {
            redact | sed -E \
              -e 's/[0-9a-fA-F]{16,}/[DEVICE]/g' \
              -e 's/(iPhone|Apple|iOS) (Distribution|Development|Developer): [^"]*/[CERTIFICATE]/gI'
          }
          build_exit=0
          signing=()
          if [[ "${REFRESH_APPLE_SIGNING:-false}" == "true" ]]; then
            export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/apple-key.p8"
            export EXPO_ASC_KEY_ID="${ASC_KEY_ID//[[:space:]]/}"
            export EXPO_ASC_ISSUER_ID="${ASC_ISSUER_ID//[[:space:]]/}"
            export EXPO_APPLE_TEAM_ID="$APPLE_TEAM_ID" EXPO_APPLE_TEAM_TYPE=COMPANY_OR_ORGANIZATION
            # The CLI's own sync also turns off what the entitlements do not list.
            export EXPO_NO_CAPABILITY_SYNC=1
            trap 'rm -f "$EXPO_ASC_API_KEY_PATH"' EXIT
            signing=(--refresh-ad-hoc-provisioning-profile)
          fi
          npx --yes eas-cli@21.4.0 build \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            "${signing[@]}" \
            --non-interactive \
            --wait \
            --json > "$result" 2> "$log" || build_exit=$?
          if [[ "${REFRESH_APPLE_SIGNING:-false}" == "true" ]]; then
            { grep -oE '(Created new|Updated existing|Used existing) profile|Failed to provision [0-9]+ of the selected devices|No devices are registered' "$log" || true; } | sort -u
          fi
          if ! jq --exit-status 'type == "array" and length == 1' "$result" > /dev/null 2>&1; then
            echo "::error::EAS returned no build (exit $build_exit)."
            # The log also lists the Apple team and devices; print only errors.
            { grep -viE 'apple team|udid|provisioned devices|^[[:space:]]*- ' "$log" |
              grep -iE 'error|fail|cannot|could not|not supported|not set up|not configured|does not exist|required|missing|invalid|permission|denied|unauthorized|quota|\blimit\b' || true; } |
              redact_error | tail -n 15
            exit 1
          fi
          jq --raw-output '.[0] | [
            "platform=\(.platform)", "status=\(.status)",
            "profile=\(.buildProfile)", "distribution=\(.distribution)",
            "version=\(.appVersion) (\(.appBuildVersion))",
            "commit=\(.gitCommitHash)"
          ] | .[]' "$result" | redact
          jq --raw-output '.[0].error |
            "error=\(.errorCode // "none"): \(.message // "none")"' "$result" | redact_error
          if (( build_exit != 0 )); then
            exit "$build_exit"
          fi
          [[ "$(jq --raw-output '.[0].status' "$result")" == "FINISHED" ]]
          artifact_url="$(jq --raw-output '.[0].artifacts | .applicationArchiveUrl // .buildUrl // empty' "$result")"
          [[ -n "$artifact_url" ]]
          # With unauthenticated access off, the download may be a sign-in page.
          magic=""
          if curl --fail --silent --location --retry 3 --max-time 600 \
            --output "$RUNNER_TEMP/driver-artifact" "$artifact_url"; then
            magic="$(head -c 2 "$RUNNER_TEMP/driver-artifact" | od -An -tx1 | tr -d ' \n')"
          fi
          case "$magic" in
            504b|1f8b)
              echo "artifact_bytes=$(stat --format=%s "$RUNNER_TEMP/driver-artifact")"
              echo "artifact_sha256=$(sha256sum "$RUNNER_TEMP/driver-artifact" | cut -d' ' -f1)"
              ;;
            *)
              echo "::warning::The build finished; its file needs an Expo sign-in to download, so it was not hashed."
              ;;
          esac

      - name: Queue EAS iOS build and TestFlight submission
        if: ${{ (inputs.mode || 'build') == 'build' && inputs.submit }}
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
          GOOGLE_MAPS_IOS_KEY: ${{ secrets.GOOGLE_MAPS_IOS_KEY }}
        run: >-
          npx --yes eas-cli@21.4.0 build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --non-interactive
          --no-wait
