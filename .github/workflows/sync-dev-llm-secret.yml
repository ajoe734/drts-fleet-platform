name: Sync Dev LLM Secret

on:
  push:
    branches:
      - codex/secret-sync-llm-dev-20260609
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SOURCE_PROJECT_ID: ${{ vars.STAGING_GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
  SOURCE_SECRET_PREFIX: ${{ vars.STAGING_SECRET_PREFIX || 'drts-staging' }}
  TARGET_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
  TARGET_SECRET_PREFIX: ${{ vars.DEV_SECRET_PREFIX || 'drts-dev' }}
  TARGET_WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER || secrets.WIF_PROVIDER }}
  TARGET_WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}

jobs:
  sync-secret:
    name: Copy staging LLM secret into dev
    runs-on: ubuntu-latest

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${SOURCE_PROJECT_ID:-}" ]] || missing+=("vars.STAGING_GCP_PROJECT_ID or vars.GCP_PROJECT_ID")
          [[ -n "${SOURCE_SECRET_PREFIX:-}" ]] || missing+=("vars.STAGING_SECRET_PREFIX or default drts-staging")
          [[ -n "${TARGET_PROJECT_ID:-}" ]] || missing+=("vars.DEV_GCP_PROJECT_ID")
          [[ -n "${TARGET_SECRET_PREFIX:-}" ]] || missing+=("vars.DEV_SECRET_PREFIX or default drts-dev")
          [[ -n "${TARGET_WIF_PROVIDER:-}" ]] || missing+=("secrets.DEV_WIF_PROVIDER or secrets.WIF_PROVIDER")
          [[ -n "${TARGET_WIF_SERVICE_ACCOUNT:-}" ]] || missing+=("secrets.DEV_WIF_SERVICE_ACCOUNT or secrets.WIF_SERVICE_ACCOUNT")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub configuration: ${missing[*]}"
            exit 1
          fi

      - name: Authenticate to dev GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TARGET_WIF_PROVIDER }}
          service_account: ${{ env.TARGET_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.TARGET_PROJECT_ID }}

      - name: Read staging LLM secret
        run: |
          set -euo pipefail

          secret_name="${SOURCE_SECRET_PREFIX}-llm-gateway-api-key"
          tmp_file="$(mktemp)"
          chmod 600 "$tmp_file"
          trap 'rm -f "$tmp_file"' EXIT

          gcloud secrets versions access latest \
            --project "$SOURCE_PROJECT_ID" \
            --secret "$secret_name" > "$tmp_file"

          mv "$tmp_file" "$RUNNER_TEMP/llm-gateway-api-key"
          chmod 600 "$RUNNER_TEMP/llm-gateway-api-key"

      - name: Write dev LLM secret
        run: |
          set -euo pipefail

          secret_name="${TARGET_SECRET_PREFIX}-llm-gateway-api-key"
          secret_file="$RUNNER_TEMP/llm-gateway-api-key"

          if [[ ! -s "$secret_file" ]]; then
            echo "::error::Temporary secret payload is missing."
            exit 1
          fi

          if gcloud secrets describe "$secret_name" --project "$TARGET_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets versions add "$secret_name" \
              --project "$TARGET_PROJECT_ID" \
              --data-file="$secret_file" >/dev/null
            echo "Added a new secret version to ${secret_name}."
          else
            gcloud secrets create "$secret_name" \
              --project "$TARGET_PROJECT_ID" \
              --replication-policy="automatic" \
              --data-file="$secret_file" >/dev/null
            echo "Created ${secret_name}."
          fi

      - name: Clean up temporary payload
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/llm-gateway-api-key"
