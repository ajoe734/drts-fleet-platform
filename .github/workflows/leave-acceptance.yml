name: Leave Acceptance Runner (SR-LEAVE-BE-001-ACCEPTANCE-RUNNER)

# Dedicated, manually-dispatched acceptance runner for SR-LEAVE-BE-001 leave
# persistence, concurrency races, and shift suppression invariants.
# It checks out an immutable candidate SHA, validates the checked-out HEAD,
# records the separate harness/workflow SHA, applies the harness overlay without
# mutating product runtime sources, runs against a dedicated PostGIS migrated
# database, executes two-instance races (approve vs withdraw, overlapping creation),
# verifies atomic rollback and fail-closed persistence, restarts the PostgreSQL
# container to prove durable reload, extracts raw SQL evidence, and enforces a
# zero-skip gate.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable candidate commit SHA to verify (full 40-char SHA)"
        required: true
        default: "01107f3879c4c41fbb7cd684ee0b9229e7512c5e"
      candidate_ref:
        description: "Optional git ref/branch containing the candidate SHA (default: origin/gemini2/sr-leave-be-001)"
        required: false
        default: "origin/gemini2/sr-leave-be-001"
  push:
    branches:
      - "gemini/sr-leave-be-001-acceptance-runner"
      - "claude2/sr-leave-be-001-acceptance-runner"

permissions:
  contents: read

concurrency:
  group: leave-acceptance-${{ github.event.inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      DRTS_LEAVE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      # Routed through job env to prevent script injection
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || '01107f3879c4c41fbb7cd684ee0b9229e7512c5e' }}
      CANDIDATE_REF: ${{ github.event.inputs.candidate_ref || 'origin/gemini2/sr-leave-be-001' }}
    steps:
      - name: Validate candidate_sha input
        run: |
          sha="$CANDIDATE_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA, got: $sha"
            exit 1
          fi

      - name: Checkout harness workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record harness SHA and preserve harness overlay
        run: |
          HARNESS_SHA="$(git rev-parse HEAD)"
          echo "HARNESS_SHA=$HARNESS_SHA" >> "$GITHUB_ENV"
          echo "Recorded harness SHA: $HARNESS_SHA"
          mkdir -p /tmp/leave-harness-overlay
          cp -r tests/integration/system-remediation/sr-leave-be-001 /tmp/leave-harness-overlay/
          git hash-object /tmp/leave-harness-overlay/sr-leave-be-001/leave-persistence-race.integration.test.ts

      - name: Checkout candidate runtime
        run: |
          echo "Fetching candidate ref $CANDIDATE_REF and SHA $CANDIDATE_SHA"
          git fetch origin "$CANDIDATE_REF" || git fetch origin "$CANDIDATE_SHA" || true
          git checkout "$CANDIDATE_SHA"
          resolved="$(git rev-parse HEAD)"
          echo "Resolved HEAD: $resolved"
          echo "Expected candidate: $CANDIDATE_SHA"
          if [ "$resolved" != "$CANDIDATE_SHA" ]; then
            echo "::error::Checked-out HEAD ($resolved) does not match requested candidate ($CANDIDATE_SHA)"
            exit 1
          fi

      - name: Apply harness overlay and assert candidate runtime immutability
        run: |
          mkdir -p tests/integration/system-remediation/sr-leave-be-001
          cp -r /tmp/leave-harness-overlay/sr-leave-be-001/* tests/integration/system-remediation/sr-leave-be-001/

          # Assert candidate runtime sources and migrations remain strictly immutable
          modified_prod="$(git diff --name-only apps/api/src/modules/driver-leave infra/migrations || true)"
          if [ -n "$modified_prod" ]; then
            echo "::error::Candidate production code or migrations modified by harness overlay: $modified_prod"
            exit 1
          fi
          echo "Candidate runtime immutability verified."

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Build contracts and control-plane-auth
        run: |
          pnpm --filter @drts/contracts build
          pnpm --filter @drts/control-plane-auth build

      - name: Apply database migrations to dedicated acceptance PostgreSQL
        run: pnpm db:migrate

      - name: Prepare evidence directory
        run: mkdir -p .artifacts/leave-acceptance

      - name: Run leave persistence & race acceptance test suite (Phase 1)
        run: |
          set -o pipefail
          pnpm exec vitest run \
            tests/integration/system-remediation/sr-leave-be-001/leave-persistence-race.integration.test.ts \
            --no-file-parallelism --maxConcurrency=1 \
            --reporter=default --reporter=json \
            --outputFile.json=.artifacts/leave-acceptance/phase1-report.json \
            2>&1 | tee .artifacts/leave-acceptance/phase1-execution-log.txt

      - name: Restart dedicated PostgreSQL container for durable reload verification
        run: |
          echo "Restarting PostgreSQL container to prove durable reload and zero stale memory..."
          PG_CONTAINER=$(docker ps -q --filter "ancestor=postgis/postgis:16-3.4" | head -n 1)
          if [ -n "$PG_CONTAINER" ]; then
            echo "Restarting container $PG_CONTAINER"
            docker restart "$PG_CONTAINER"
          else
            echo "Restarting first available postgres container"
            docker restart $(docker ps -q | head -n 1) || true
          fi

          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready after restart."
              break
            fi
            sleep 1
          done

      - name: Run durable reload verification (Phase 2)
        run: |
          set -o pipefail
          LEAVE_ACCEPTANCE_PHASE=post-restart pnpm exec vitest run \
            tests/integration/system-remediation/sr-leave-be-001/leave-persistence-race.integration.test.ts \
            -t "Durable Reload" \
            --no-file-parallelism --maxConcurrency=1 \
            --reporter=default --reporter=json \
            --outputFile.json=.artifacts/leave-acceptance/phase2-report.json \
            2>&1 | tee .artifacts/leave-acceptance/phase2-execution-log.txt

      - name: Extract raw SQL row evidence from PostgreSQL
        if: always()
        run: |
          echo "Extracting raw SQL evidence from PostgreSQL..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT leave_id, driver_id, leave_type, status, start_time, end_time, reviewed_by_principal_id, reviewed_at, impacted_shift_ids, created_at, updated_at
          FROM ops.phase1_driver_leave_requests
          ORDER BY created_at DESC
          LIMIT 20;
          " > .artifacts/leave-acceptance/raw-sql-leaves.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT shift_id, driver_id, scheduled_start, scheduled_end, clock_in_at, record
          FROM ops.phase1_driver_shifts
          WHERE record->>'leaveReassigned' = 'true'
          ORDER BY updated_at DESC
          LIMIT 20;
          " > .artifacts/leave-acceptance/raw-sql-shifts.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT source_incident_id, driver_id, active, reason_code, expires_at, lifted_at, record
          FROM ops.phase1_driver_matching_suppressions
          ORDER BY updated_at DESC
          LIMIT 20;
          " > .artifacts/leave-acceptance/raw-sql-suppressions.txt || true

      - name: Gate on zero skips and all acceptance tests passed
        if: always()
        run: |
          python3 - <<'PY_GATE'
          import json
          from pathlib import Path

          p1 = Path(".artifacts/leave-acceptance/phase1-report.json")
          if not p1.exists():
              raise SystemExit("Acceptance gate: Phase 1 test report was not produced.")
          r1 = json.loads(p1.read_text())
          total = r1.get("numTotalTests", 0)
          passed = r1.get("numPassedTests", 0)
          pending = r1.get("numPendingTests", 0)
          failed = r1.get("numFailedTests", 0)

          print(f"Leave acceptance results: total={total}, passed={passed}, pending={pending}, failed={failed}")

          if total == 0:
              raise SystemExit("Acceptance gate: Zero tests were executed.")
          if pending > 0:
              raise SystemExit(f"Acceptance gate: {pending} tests were skipped (zero skips required).")
          if failed > 0 or not r1.get("success"):
              raise SystemExit(f"Acceptance gate: {failed} tests failed in Phase 1.")
          if passed != total:
              raise SystemExit(f"Acceptance gate: passed ({passed}) != total ({total}).")

          print(f"Leave acceptance runner: all {passed} tests passed, zero skipped.")
          PY_GATE

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leave-acceptance-${{ github.event.inputs.candidate_sha || github.sha }}
          path: |
            .artifacts/leave-acceptance/phase1-execution-log.txt
            .artifacts/leave-acceptance/phase1-report.json
            .artifacts/leave-acceptance/phase2-execution-log.txt
            .artifacts/leave-acceptance/phase2-report.json
            .artifacts/leave-acceptance/raw-sql-leaves.txt
            .artifacts/leave-acceptance/raw-sql-shifts.txt
            .artifacts/leave-acceptance/raw-sql-suppressions.txt
          if-no-files-found: warn
