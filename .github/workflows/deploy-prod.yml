name: Deploy — Prod

# Operator-only protected production release. Partner Booking remains PAUSED;
# retired passenger-web/concierge/assisted-entry surfaces are excluded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable prod/v<YYYY.MM.DD>.<N> from hourly-promote"
        required: true
        type: string
      skip_migration:
        description: "Skip only when migrations already applied / approved application rollback"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
permissions:
  contents: read
  id-token: write
  deployments: write
concurrency:
  group: deploy-prod
  cancel-in-progress: false
env:
  PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID }}
  REGION: ${{ vars.PROD_GCP_REGION }}
  SECRET_PREFIX: ${{ vars.PROD_SECRET_PREFIX || 'drts-prod' }}
  DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.PROD_WIF_SERVICE_ACCOUNT }}
  WIF_PROVIDER_VALUE: ${{ secrets.PROD_WIF_PROVIDER }}
  IAP_CLIENT_ID_ENV: ${{ vars.PROD_IAP_CLIENT_ID }}
  RELEASE_TAG: ${{ inputs.tag }}
  MAP_PROVIDER_BACKEND: ${{ vars.PROD_MAP_PROVIDER_BACKEND }}
  NEXT_PUBLIC_MAP_TILE_URL_TEMPLATE: ${{ vars.PROD_MAP_TILE_URL_TEMPLATE }}
  MAP_PROVIDER_ALLOWED_ORIGINS: ${{ vars.PROD_MAP_PROVIDER_ALLOWED_ORIGINS }}
  MAP_PROVIDER_MONTHLY_BUDGET_USD: ${{ vars.PROD_MAP_PROVIDER_MONTHLY_BUDGET_USD }}
  MAP_PROVIDER_BUDGET_ALERT_PCT: ${{ vars.PROD_MAP_PROVIDER_BUDGET_ALERT_PCT }}

jobs:
  resolve-tag:
    name: Resolve protected immutable production source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - id: source
        name: Resolve the production tag once
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^prod/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Expected a prod/v<YYYY.MM.DD>.<N> tag from hourly-promote."
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"

  validate-config:
    name: Validate complete production configuration before mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    needs: resolve-tag
    env:
      SOURCE_SHA: ${{ needs.resolve-tag.outputs.source_sha }}
      PROD_VARIABLES_JSON: ${{ toJSON(vars) }}
    outputs:
      source_sha: ${{ needs.resolve-tag.outputs.source_sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      registry: ${{ steps.plan.outputs.registry }}
      registry_host: ${{ steps.plan.outputs.registry_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate non-secret configuration without cloud calls
        run: |
          node -e 'const {buildPlan}=require("./operations/verification/production-release-rail/rail.cjs"); try {buildPlan(JSON.parse(process.env.PROD_VARIABLES_JSON),process.env.SOURCE_SHA,process.env.RELEASE_TAG,process.env.DEPLOYER_SERVICE_ACCOUNT); if (!process.env.WIF_PROVIDER_VALUE) throw Error("Missing secrets.PROD_WIF_PROVIDER");} catch(e) {console.error(e.message);process.exit(1)}'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER_VALUE }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: "${{ env.PROJECT_ID }}" }
      - name: Validate map provider runtime config
        run: |
          MAP_PROVIDER_DEPLOYMENT_TIER=production \
          MAP_PROVIDER_SECRET_SOURCE=secret_manager \
          MAP_PROVIDER_PROJECT_ID="$PROJECT_ID" \
          MAP_PROVIDER_SECRET_PREFIX="$SECRET_PREFIX" \
          ./operations/verification/check-map-provider-config.sh
      - name: Resolve API secret mounts
        id: registry
        run: |
          set -euo pipefail
          workload_google_registry_secret="${SECRET_PREFIX}-workload-identity-google-service-principals"
          if ! gcloud secrets describe "$workload_google_registry_secret" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "::error::Required secret ${workload_google_registry_secret} is absent; production Google workload assertions have no internal-key fallback."
            exit 1
          fi
          # Checked by preflight and resolved to a numeric enabled version before
          # the plan is emitted. No deploy uses the mutable latest reference.
          secret_args="WORKLOAD_IDENTITY_GOOGLE_SERVICE_PRINCIPALS=${workload_google_registry_secret}:latest"
          echo "GOOGLE_REGISTRY_REFERENCE=$secret_args" >> "$GITHUB_ENV"
      - name: Validate public-entry policies and strict startup; freeze secret versions
        id: plan
        run: node operations/verification/production-release-rail/preflight.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-plan-${{ env.SOURCE_SHA }}
          path: production-plan.json
          if-no-files-found: error
          retention-days: 30

  build-push:
    name: Build immutable production image (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    needs: validate-config
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.validate-config.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ needs.validate-config.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-config.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: production-plan-${{ env.SOURCE_SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER_VALUE }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: "${{ env.PROJECT_ID }}" }
      - name: Configure Artifact Registry
        env:
          REGISTRY_HOST: ${{ needs.validate-config.outputs.registry_host }}
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Resolve frozen build inputs
        id: inputs
        run: |
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("production-plan.json")); if(p.sha!==process.env.SOURCE_SHA) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT,`tile=${p.tile}\n`);'
      - name: Build and push exact source
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.validate-config.outputs.registry }}/${{ matrix.id }}:${{ env.SOURCE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: |
            DRTS_CANDIDATE_SHA=${{ env.SOURCE_SHA }}
            NEXT_PUBLIC_MAP_TILE_URL_TEMPLATE=${{ steps.inputs.outputs.tile }}
          cache-from: type=gha,scope=prod-${{ matrix.id }}
          cache-to: type=gha,scope=prod-${{ matrix.id }},mode=min
      - name: Record immutable image digest
        env:
          IMAGE_ID: ${{ matrix.id }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node -e 'const fs=require("node:fs");if(!/^sha256:[a-f0-9]{64}$/.test(process.env.IMAGE_DIGEST))process.exit(1); fs.writeFileSync("image.json",JSON.stringify({id:process.env.IMAGE_ID,sha:process.env.SOURCE_SHA,digest:process.env.IMAGE_DIGEST}));'
      - uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ matrix.id }}-${{ env.SOURCE_SHA }}
          path: image.json
          if-no-files-found: error
          retention-days: 30

  migrate:
    name: Migrate once from the immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    needs: [validate-config, build-push]
    if: ${{ inputs.skip_migration != 'true' }}
    env:
      SOURCE_SHA: ${{ needs.validate-config.outputs.source_sha }}
      SKIP_MIGRATION: ${{ inputs.skip_migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-config.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: production-plan-${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          pattern: production-image-*-${{ env.SOURCE_SHA }}
          path: production-images
          merge-multiple: false
      - name: Flatten digest metadata with distinct image names
        run: |
          for directory in production-images/production-image-*; do
            mv "$directory/image.json" "$directory.json"
            rmdir "$directory"
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER_VALUE }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: "${{ env.PROJECT_ID }}" }
      - name: Migrate once from the immutable image
        run: node operations/verification/production-release-rail/run.cjs migrate

  deploy:
    name: Deploy all ten production services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    needs: [validate-config, build-push, migrate]
    if: ${{ always() && needs.validate-config.result == 'success' && needs.build-push.result == 'success' && (needs.migrate.result == 'success' || (needs.migrate.result == 'skipped' && inputs.skip_migration == 'true')) }}
    env:
      SOURCE_SHA: ${{ needs.validate-config.outputs.source_sha }}
      SKIP_MIGRATION: ${{ inputs.skip_migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-config.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: production-plan-${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          pattern: production-image-*-${{ env.SOURCE_SHA }}
          path: production-images
          merge-multiple: false
      - name: Flatten digest metadata with distinct image names
        run: |
          for directory in production-images/production-image-*; do
            mv "$directory/image.json" "$directory.json"
            rmdir "$directory"
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER_VALUE }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: "${{ env.PROJECT_ID }}" }
      - name: Deploy — api and all active web surfaces
        run: node operations/verification/production-release-rail/run.cjs deploy

  health-check:
    name: Verify exact revisions, public customer entry and protected contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    needs: [validate-config, deploy]
    if: ${{ always() && needs.validate-config.result == 'success' && needs.deploy.result == 'success' }}
    env:
      SOURCE_SHA: ${{ needs.validate-config.outputs.source_sha }}
      SKIP_MIGRATION: ${{ inputs.skip_migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-config.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          name: production-plan-${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          pattern: production-image-*-${{ env.SOURCE_SHA }}
          path: production-images
          merge-multiple: false
      - name: Flatten digest metadata with distinct image names
        run: |
          for directory in production-images/production-image-*; do
            mv "$directory/image.json" "$directory.json"
            rmdir "$directory"
          done
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER_VALUE }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { project_id: "${{ env.PROJECT_ID }}" }
      - name: Verify exact revisions, anonymous entry and authenticated contracts
        run: node operations/verification/production-release-rail/run.cjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence-${{ env.SOURCE_SHA }}
          path: |
            production-plan.json
            production-images/*.json
            production-evidence.json
          if-no-files-found: error
          retention-days: 90
