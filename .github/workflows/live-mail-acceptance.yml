name: Live Mail Acceptance (SR-LIVE-MAIL-001)

# Dedicated, manually-dispatchable acceptance runner for the live
# tenant-invitation mail send path against an already-deployed candidate:
#   POST tenant/users (real invitation issuance, enqueues a real mail
#   delivery through NotificationDeliveryService) -> poll
#   GET tenant/mail-deliveries/:deliveryId (SR-MAIL-DELIVERY-READBACK-20261001)
#   until the deployed candidate reports a real provider acknowledgement.
#
# This workflow never deploys anything: it only verifies a candidate that a
# separate deploy workflow already published. It independently verifies (a)
# the checked-out git SHA matches the requested candidate_sha and (b) the
# deployed target itself reports that same candidate SHA via its
# x-drts-candidate-sha response header, so a stale/rolled-back deployment
# cannot silently pass. All inputs are explicit, fail-closed allowlists;
# there is no historical staging default fallback, and the authorized
# recipient is validated to reject fixture/demo/example placeholders. This
# job never runs on this project's VM (no product dev/preview/HTTP/browser
# server permitted there); it runs entirely on a GitHub-hosted runner.
#
# Session minting is real, not a static secret: a short-lived tenant_admin
# session is minted at run time via the existing CI tenant-actor WIF grant
# (`POST auth/token` with a freshly-minted Google ID token for the deployer
# service account, `WORKLOAD_IDENTITY_CI_TENANT_ACTOR_ENABLED=true` on dev),
# the same mechanism deploy-dev.yml's own operational acceptance already
# uses -- see session-bootstrap.ts. A `tenant:users:create` step-up proof is
# obtained once and reused for every privileged call this run makes.
#
# The authorized recipient is never a repository variable: session-bootstrap.ts
# derives it at run time (Gmail plus-addressing, e.g. `+invite`) from the real
# `drts-dev-smtp-username` secret, which recipient-allowlist version 2 already
# covers. The non-allowlisted negative-path recipient is a fixed RFC 2606
# reserved address and needs no provisioning either.
#
# As of 2026-10-02 DRTS_LIVE_MAIL_TEST_AUTHORIZED, DRTS_LIVE_MAIL_TEST_TENANT_ID
# and DRTS_LIVE_MAIL_TENANT_ACTOR_ID are not yet provisioned as repository
# variables; the runner's own input validation fails closed with a clear
# reason rather than skipping when they are absent. See
# docs/04-uat/system-remediation-20260906/SR-LIVE-MAIL-001.md for what is and
# is not live yet, including a known scheduler-trigger defect
# (SR-MAIL-SCHEDULER-TOKEN-REUSE-20261002) that does not block this
# workflow's synchronous send/readback path.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable candidate commit SHA to verify (full 40-char SHA); leave blank to use the dispatch ref's HEAD"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live-mail-acceptance-${{ github.event.inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  mail-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}
      WORKFLOW_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}
      DRTS_CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}
      DRTS_LIVE_MAIL_EVIDENCE_PATH: ${{ github.workspace }}/.artifacts/live-mail-acceptance/evidence-mail.json
      DRTS_LIVE_MAIL_ALLOWED_TARGETS: ${{ vars.DRTS_LIVE_MAIL_ALLOWED_TARGETS }}
      DRTS_LIVE_MAIL_API_ORIGIN: ${{ vars.DRTS_LIVE_MAIL_API_ORIGIN }}
      DRTS_LIVE_MAIL_TEST_AUTHORIZED: ${{ vars.DRTS_LIVE_MAIL_TEST_AUTHORIZED }}
      DRTS_LIVE_MAIL_TEST_TENANT_ID: ${{ vars.DRTS_LIVE_MAIL_TEST_TENANT_ID }}
      DRTS_LIVE_MAIL_TENANT_ACTOR_ID: ${{ vars.DRTS_LIVE_MAIL_TENANT_ACTOR_ID }}
      DRTS_LIVE_MAIL_STEP_UP_ACTION_ID: ${{ vars.DRTS_LIVE_MAIL_STEP_UP_ACTION_ID }}
      DRTS_LIVE_MAIL_INVITATION_ROLE_CODE: ${{ vars.DRTS_LIVE_MAIL_INVITATION_ROLE_CODE }}
      DRTS_LIVE_MAIL_POLL_TIMEOUT_MS: ${{ vars.DRTS_LIVE_MAIL_POLL_TIMEOUT_MS }}
      DRTS_LIVE_MAIL_POLL_INTERVAL_MS: ${{ vars.DRTS_LIVE_MAIL_POLL_INTERVAL_MS }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
    steps:
      - name: Validate candidate_sha input
        run: |
          sha="$CANDIDATE_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA, got: $sha"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout resolved the exact immutable candidate
        run: |
          resolved="$(git rev-parse HEAD)"
          if [ "$resolved" != "$CANDIDATE_SHA" ]; then
            echo "::error::Checked-out HEAD ($resolved) does not match the requested candidate ($CANDIDATE_SHA)."
            exit 1
          fi

      - name: Prepare evidence directory
        run: mkdir -p .artifacts/live-mail-acceptance

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a .artifacts/live-mail-acceptance/execution-log.txt

      - name: Authenticate to shared dev using existing WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}

      - name: Mint and verify a live tenant_admin session (CI tenant-actor WIF grant)
        id: session
        run: |
          set -o pipefail
          ./apps/api/node_modules/.bin/tsx tests/e2e/system-remediation/sr-live-mail-001/session-bootstrap.ts \
            2>&1 | tee -a .artifacts/live-mail-acceptance/execution-log.txt

      - name: Run live mail acceptance profile
        id: runner
        run: |
          set -o pipefail
          ./apps/api/node_modules/.bin/tsx tests/e2e/system-remediation/sr-live-mail-001/mail-acceptance-runner.ts \
            2>&1 | tee -a .artifacts/live-mail-acceptance/execution-log.txt

      - name: Record run status
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
        run: |
          python3 - <<'PY_STATUS'
          import json
          import os
          from pathlib import Path

          evidence_path = Path(".artifacts/live-mail-acceptance/evidence-mail.json")
          status_path = Path(".artifacts/live-mail-acceptance/run-status.json")
          status_path.parent.mkdir(parents=True, exist_ok=True)

          install_outcome = os.environ.get("INSTALL_OUTCOME", "unknown")
          runner_outcome = os.environ.get("RUNNER_OUTCOME", "unknown")

          if install_outcome != "success":
              status = "not_run"
          elif runner_outcome == "success" and evidence_path.exists():
              status = "passed"
          else:
              status = "failed"

          status_path.write_text(json.dumps({
              "candidate_sha": os.environ.get("CANDIDATE_SHA", ""),
              "workflow_sha": os.environ.get("WORKFLOW_SHA", ""),
              "status": status,
              "install_outcome": install_outcome,
              "runner_outcome": runner_outcome,
              "evidence_present": evidence_path.exists(),
          }, indent=2) + "\n")
          print(f"Run status recorded: {status}")
          PY_STATUS

      - name: Gate on a recorded passed status
        if: always()
        run: |
          python3 - <<'PY_GATE'
          import json
          from pathlib import Path

          status_path = Path(".artifacts/live-mail-acceptance/run-status.json")
          if not status_path.exists():
              raise SystemExit("Mail acceptance gate: no run-status.json was produced.")
          status = json.loads(status_path.read_text())
          if status.get("status") != "passed":
              raise SystemExit(f"Mail acceptance incomplete or failed: {status}")
          print("Mail acceptance: passed.")
          PY_GATE

      - name: Upload execution log, redacted evidence, and run status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mail-acceptance-${{ github.event.inputs.candidate_sha || github.sha }}
          path: |
            .artifacts/live-mail-acceptance/execution-log.txt
            .artifacts/live-mail-acceptance/evidence-mail.json
            .artifacts/live-mail-acceptance/run-status.json
          if-no-files-found: warn
