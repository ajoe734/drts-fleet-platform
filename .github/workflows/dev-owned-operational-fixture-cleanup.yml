name: Dev Owned Operational Fixture Cleanup

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/dev-owned-operational-fixture-cleanup.yml'
      - 'operations/verification/cleanup-owned-operational-fixtures.py'
      - 'tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_cleanup.py'
      - 'docs/04-uat/dev-owned-operational-fixture-cleanup-20261009.md'
  push:
    branches:
      - dev
      - 'gemini2/**'
      - 'codex/**'
    paths:
      - '.github/workflows/dev-owned-operational-fixture-cleanup.yml'
      - 'operations/verification/cleanup-owned-operational-fixtures.py'
      - 'tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_cleanup.py'
      - 'docs/04-uat/dev-owned-operational-fixture-cleanup-20261009.md'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode ('dry-run' inspects without mutations; 'apply' executes generation-matched GCS deletions)"
        required: true
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'apply'
      source_ref:
        description: 'Immutable product commit SHA (must match source SHA 4a166f3ed2a7000061acc737ee475ae3c47dca56)'
        required: true
        default: '4a166f3ed2a7000061acc737ee475ae3c47dca56'
        type: string
      product_run_id:
        description: 'Authoritative product run ID'
        required: true
        default: '37906298090'
        type: string
      workflow_def_sha:
        description: 'Authoritative deploy workflow definition SHA'
        required: true
        default: '9a1b6466a8b15d7d328e9ceba33ba5dc92f7fa9c'
        type: string
      artifact_id:
        description: 'Authoritative operational browser evidence artifact ID'
        required: true
        default: '11606165993'
        type: string

permissions:
  contents: read

concurrency:
  group: dev-owned-operational-fixture-cleanup
  cancel-in-progress: false

env:
  DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
  DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
  EXPECTED_PROJECT_ID: 'drts-dev-devcc-20260825'
  EXPECTED_REGION: 'us-central1'
  EXPECTED_PRODUCT_RUN_ID: '37906298090'
  EXPECTED_SOURCE_SHA: '4a166f3ed2a7000061acc737ee475ae3c47dca56'
  EXPECTED_WORKFLOW_DEF_SHA: '9a1b6466a8b15d7d328e9ceba33ba5dc92f7fa9c'
  EXPECTED_ARTIFACT_ID: '11606165993'
  EXPECTED_WIF_PROVIDER: 'projects/24645990627/locations/global/workloadIdentityPools/github-actions/providers/github'
  EXPECTED_WIF_SERVICE_ACCOUNT: 'github-actions-deployer@drts-dev-devcc-20260825.iam.gserviceaccount.com'

jobs:
  unit-tests:
    name: Unit tests & safety guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tool definition
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile python sources
        run: |
          python3 -m py_compile \
            operations/verification/cleanup-owned-operational-fixtures.py \
            tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_cleanup.py

      - name: Execute relocated unit test suite
        run: |
          python3 -m unittest tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_cleanup.py -v

  cleanup-fixtures:
    name: Owned fixture cleanup (GCS generation-bound / guarded DB)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout tool definition
        uses: actions/checkout@v4

      - name: Enforce immutable product source & run identity guards
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_PRODUCT_RUN_ID: ${{ inputs.product_run_id }}
          INPUT_WORKFLOW_DEF_SHA: ${{ inputs.workflow_def_sha }}
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          SRC_REF="${INPUT_SOURCE_REF:-}"
          PRUN_ID="${INPUT_PRODUCT_RUN_ID:-}"
          WDEF_SHA="${INPUT_WORKFLOW_DEF_SHA:-}"
          ART_ID="${INPUT_ARTIFACT_ID:-}"
          if [ "$SRC_REF" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::source_ref '$SRC_REF' does not match required product source $EXPECTED_SOURCE_SHA" >&2
            exit 1
          fi
          if [ "$PRUN_ID" != "$EXPECTED_PRODUCT_RUN_ID" ]; then
            echo "::error::product_run_id '$PRUN_ID' does not match required $EXPECTED_PRODUCT_RUN_ID" >&2
            exit 1
          fi
          if [ "$WDEF_SHA" != "$EXPECTED_WORKFLOW_DEF_SHA" ]; then
            echo "::error::workflow_def_sha '$WDEF_SHA' does not match required $EXPECTED_WORKFLOW_DEF_SHA" >&2
            exit 1
          fi
          if [ "$ART_ID" != "$EXPECTED_ARTIFACT_ID" ]; then
            echo "::error::artifact_id '$ART_ID' does not match required $EXPECTED_ARTIFACT_ID" >&2
            exit 1
          fi
          echo "Product source and run provenance guards verified successfully."

      - name: Enforce DEV WIF lane pre-auth guards (no generic fallback)
        env:
          WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          WIF_PROV="${WIF_PROVIDER:-${{ secrets.DEV_WIF_PROVIDER }}}"
          WIF_SA="${WIF_SERVICE_ACCOUNT:-${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}}"
          if [ -z "$WIF_PROV" ]; then
            echo "::error::DEV_WIF_PROVIDER secret is required and must not be empty. Generic WIF fallback is prohibited." >&2
            exit 1
          fi
          if [ -z "$WIF_SA" ]; then
            echo "::error::DEV_WIF_SERVICE_ACCOUNT secret is required and must not be empty. Generic WIF fallback is prohibited." >&2
            exit 1
          fi
          if [ "$WIF_PROV" != "$EXPECTED_WIF_PROVIDER" ]; then
            echo "::error::DEV_WIF_PROVIDER ('$WIF_PROV') does not match authorized DEV provider '$EXPECTED_WIF_PROVIDER'" >&2
            exit 1
          fi
          if [ "$WIF_SA" != "$EXPECTED_WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::DEV_WIF_SERVICE_ACCOUNT ('$WIF_SA') does not match authorized DEV deployer '$EXPECTED_WIF_SERVICE_ACCOUNT'" >&2
            exit 1
          fi
          if [ "${DEV_GCP_PROJECT_ID:-}" != "$EXPECTED_PROJECT_ID" ]; then
            echo "::error::DEV_GCP_PROJECT_ID ('${DEV_GCP_PROJECT_ID:-}') does not match expected dev project '$EXPECTED_PROJECT_ID'" >&2
            exit 1
          fi
          if [ "${DEV_GCP_REGION:-}" != "$EXPECTED_REGION" ]; then
            echo "::error::DEV_GCP_REGION ('${DEV_GCP_REGION:-}') does not match expected dev region '$EXPECTED_REGION'" >&2
            exit 1
          fi
          echo "DEV WIF pre-auth identity and project constraints verified."

      - name: Enforce mandatory Operator lane and CI/merge proofs (Disable hosted auth)
        run: |
          echo "::error::Hosted authenticated read lane is explicitly disabled. Fenced Operator-only runtime, no-overlap guards, private connectivity, and immutable CI/merge proofs are not yet implemented. Supplying source-only safe planning." >&2
          exit 1

      - name: Authenticate to GCP via DEV WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.EXPECTED_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.EXPECTED_PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and validate authoritative GitHub run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PRODUCT_RUN_ID: ${{ inputs.product_run_id }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          mkdir -p authoritative-artifact/payload
          gh api "repos/${{ github.repository }}/actions/runs/${INPUT_PRODUCT_RUN_ID}/artifacts" > authoritative-artifact/artifacts.json
          gh run download "$INPUT_PRODUCT_RUN_ID" \
            --name "operational-browser-evidence-${INPUT_SOURCE_REF}" \
            --dir authoritative-artifact/payload

      - name: Execute fixture cleanup planner & executor
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_PRODUCT_RUN_ID: ${{ inputs.product_run_id }}
        run: |
          set -euo pipefail
          mkdir -p test-results/cleanup
          python3 operations/verification/cleanup-owned-operational-fixtures.py \
            --mode "$INPUT_MODE" \
            --artifact-dir "authoritative-artifact" \
            --source-sha "$INPUT_SOURCE_REF" \
            --run-id "$INPUT_PRODUCT_RUN_ID" \
            --output "test-results/cleanup/cleanup-receipts.json"

      - name: Upload cleanup receipts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-operational-fixture-cleanup-receipts
          path: test-results/cleanup/cleanup-receipts.json
          retention-days: 90
