name: Dev Owned Operational Fixture Cleanup

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/dev-owned-operational-fixture-cleanup.yml'
      - 'operations/verification/cleanup-owned-operational-fixtures.py'
      - 'operations/verification/test_cleanup_owned_operational_fixtures.py'
      - 'docs/04-uat/dev-owned-operational-fixture-cleanup-20261009.md'
  push:
    branches:
      - dev
      - 'gemini2/**'
      - 'codex/**'
    paths:
      - '.github/workflows/dev-owned-operational-fixture-cleanup.yml'
      - 'operations/verification/cleanup-owned-operational-fixtures.py'
      - 'operations/verification/test_cleanup_owned_operational_fixtures.py'
      - 'docs/04-uat/dev-owned-operational-fixture-cleanup-20261009.md'
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode ('dry-run' inspects without mutations; 'apply' executes generation-matched GCS deletions)"
        required: true
        default: 'dry-run'
        type: choice
        options:
          - 'dry-run'
          - 'apply'
      source_ref:
        description: 'Immutable Git commit SHA (must match source SHA 4a166f3ed2a7000061acc737ee475ae3c47dca56)'
        required: true
        default: '4a166f3ed2a7000061acc737ee475ae3c47dca56'
        type: string
      product_run_id:
        description: 'Authoritative product run ID'
        required: true
        default: '37906298090'
        type: string

permissions:
  contents: read

env:
  DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID || 'drts-dev-devcc-20260825' }}
  DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION || 'us-central1' }}
  DEV_WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER || secrets.WIF_PROVIDER }}
  DEV_WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}
  EXPECTED_PRODUCT_RUN_ID: '37906298090'
  EXPECTED_SOURCE_SHA: '4a166f3ed2a7000061acc737ee475ae3c47dca56'

jobs:
  unit-tests:
    name: Unit tests & safety guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile python sources
        run: |
          python3 -m py_compile \
            operations/verification/cleanup-owned-operational-fixtures.py \
            operations/verification/test_cleanup_owned_operational_fixtures.py

      - name: Execute unit test suite
        run: |
          python3 -m unittest operations/verification/test_cleanup_owned_operational_fixtures.py -v

  cleanup-fixtures:
    name: Owned fixture cleanup (GCS generation-bound / guarded DB)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Enforce immutable source & run identity guard
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.source_ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_ref must be a 40-character commit SHA" >&2
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "${{ inputs.source_ref }}" ]; then
            echo "::error::Checked out HEAD ($HEAD_SHA) does not match required SHA (${{ inputs.source_ref }})" >&2
            exit 1
          fi
          if [ "${{ inputs.product_run_id }}" != "$EXPECTED_PRODUCT_RUN_ID" ]; then
            echo "::error::Product run ID must equal $EXPECTED_PRODUCT_RUN_ID" >&2
            exit 1
          fi
          echo "Source guard verified: $HEAD_SHA against run ${{ inputs.product_run_id }}"

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.DEV_GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.DEV_GCP_PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute fixture cleanup planner & executor
        run: |
          set -euo pipefail
          mkdir -p test-results/cleanup
          python3 operations/verification/cleanup-owned-operational-fixtures.py \
            --mode "${{ inputs.mode }}" \
            --inventory ".local/fleet-storage-diagnosis-20261008/referral-reviewed-composition-dev-deployment-20261009/exact-owned-fixture-inventory.json" \
            --source-sha "${{ inputs.source_ref }}" \
            --run-id "${{ inputs.product_run_id }}" \
            --output "test-results/cleanup/cleanup-receipts.json"

      - name: Upload cleanup receipts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-operational-fixture-cleanup-receipts
          path: test-results/cleanup/cleanup-receipts.json
          retention-days: 90
