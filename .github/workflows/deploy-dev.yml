      - name: Deploy — partner-booking-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/partner-booking-web:${{ needs.build-push.outputs.image_tag }}"

          gcloud run deploy "${{ needs.prepare.outputs.partner_booking_service }}" \
