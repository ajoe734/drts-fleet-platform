            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.enterprise_dispatch_exposure_flag }} \
            --min-instances 0 \
            --max-instances 2 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — channel-partner-portal-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:${{ needs.build-push.outputs.image_tag }}"

          gcloud run deploy "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3013 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.channel_partner_portal_exposure_flag }} \
            --min-instances 0 \
            --max-instances 2 \
            --project "${{ needs.prepare.outputs.project_id }}"

  health-check:
    name: Dev health check
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    environment: dev
    outputs:
      api: ${{ steps.urls.outputs.api }}
      platform_admin: ${{ steps.urls.outputs.platform_admin }}
      ops_console: ${{ steps.urls.outputs.ops_console }}
      fleet_partner_portal: ${{ steps.urls.outputs.fleet_partner_portal }}
      tenant_console: ${{ steps.urls.outputs.tenant_console }}
      bank_console: ${{ steps.urls.outputs.bank_console }}
      partner_booking: ${{ steps.urls.outputs.partner_booking }}
      enterprise_dispatch: ${{ steps.urls.outputs.enterprise_dispatch }}
      channel_partner_portal: ${{ steps.urls.outputs.channel_partner_portal }}
      referral_embed: ${{ steps.urls.outputs.referral_embed }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Wait for services to be Ready
        run: |
          set -euo pipefail

          for svc in \
            "${{ needs.prepare.outputs.api_service }}" \
            "${{ needs.prepare.outputs.platform_admin_service }}" \
            "${{ needs.prepare.outputs.ops_console_service }}" \
            "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            "${{ needs.prepare.outputs.tenant_console_service }}" \
            "${{ needs.prepare.outputs.bank_console_service }}" \
            "${{ needs.prepare.outputs.referral_embed_service }}" \
            "${{ needs.prepare.outputs.partner_booking_service }}" \
            "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            "${{ needs.prepare.outputs.channel_partner_portal_service }}"; do
            echo "Waiting for ${svc} ..."
            service_ready=false
            for i in $(seq 1 24); do
              ready="$(gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='value(status.conditions[0].status)' 2>/dev/null || true)"
              echo "  attempt ${i}: Ready=${ready}"
              if [[ "$ready" == "True" ]]; then
                service_ready=true
                break
              fi
              sleep 10
            done
            if [[ "$service_ready" != "true" ]]; then
              echo "::error::${svc} did not reach Ready=True in time."
              gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='yaml(status)' || true
              exit 1
            fi
          done

      - name: Resolve service URLs
        id: urls
        run: |
          api_url="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          platform_admin_url="$(gcloud run services describe "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          ops_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          fleet_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          tenant_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.tenant_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          bank_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.bank_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          referral_embed_url="$(gcloud run services describe "${{ needs.prepare.outputs.referral_embed_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          partner_booking_url="$(gcloud run services describe "${{ needs.prepare.outputs.partner_booking_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          enterprise_dispatch_url="$(gcloud run services describe "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          channel_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"

          echo "api=${api_url}" >> "$GITHUB_OUTPUT"
          echo "platform_admin=${platform_admin_url}" >> "$GITHUB_OUTPUT"
          echo "ops_console=${ops_console_url}" >> "$GITHUB_OUTPUT"
          echo "fleet_partner_portal=${fleet_partner_portal_url}" >> "$GITHUB_OUTPUT"
          echo "tenant_console=${tenant_console_url}" >> "$GITHUB_OUTPUT"
          echo "bank_console=${bank_console_url}" >> "$GITHUB_OUTPUT"
          echo "referral_embed=${referral_embed_url}" >> "$GITHUB_OUTPUT"
          echo "partner_booking=${partner_booking_url}" >> "$GITHUB_OUTPUT"
          echo "enterprise_dispatch=${enterprise_dispatch_url}" >> "$GITHUB_OUTPUT"
          echo "channel_partner_portal=${channel_partner_portal_url}" >> "$GITHUB_OUTPUT"

      - name: Verify dev endpoints
        run: |
          curl --fail --silent --show-error "${{ steps.urls.outputs.api }}/health" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.platform_admin }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.ops_console }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.fleet_partner_portal }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.tenant_console }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.bank_console }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.referral_embed }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.partner_booking }}/ctbc" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.partner_booking }}/ctbc/program" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.enterprise_dispatch }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.enterprise_dispatch }}/bookings/new" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.enterprise_dispatch }}/embed/unsupported-host" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.channel_partner_portal }}" >/dev/null

      - name: Print dev URLs
        run: |
          echo "=== Dev deployment complete ==="
          echo "  api: ${{ steps.urls.outputs.api }}"
          echo "  platform-admin: ${{ steps.urls.outputs.platform_admin }}"
          echo "  ops-console: ${{ steps.urls.outputs.ops_console }}"
          echo "  fleet-partner-portal: ${{ steps.urls.outputs.fleet_partner_portal }}"
          echo "  tenant-console: ${{ steps.urls.outputs.tenant_console }}"
          echo "  bank-console: ${{ steps.urls.outputs.bank_console }}"
          echo "  referral-embed-web: ${{ steps.urls.outputs.referral_embed }}"
          echo "  partner-booking: ${{ steps.urls.outputs.partner_booking }}"
          echo "  enterprise-dispatch: ${{ steps.urls.outputs.enterprise_dispatch }}"
          echo "  channel-partner-portal: ${{ steps.urls.outputs.channel_partner_portal }}"

  ui-smoke:
    name: Dev UI smoke (playwright vs deployed)
    runs-on: ubuntu-latest
    needs: [prepare, health-check]
    if: ${{ always() && needs.health-check.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Post-deploy UI smoke: drives the deployed dev front-ends with a real browser
      # across all business-line surfaces. URLs come from the health-check job's
      # resolved Cloud Run service URLs.
      - name: Run UI smoke against deployed dev
        env:
          DRTS_DEV_API_BASE_URL: ${{ needs.health-check.outputs.api }}
          DRTS_DEV_PLATFORM_ADMIN_BASE_URL: ${{ needs.health-check.outputs.platform_admin }}
          DRTS_DEV_OPS_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.ops_console }}
          DRTS_DEV_FLEET_PARTNER_PORTAL_BASE_URL: ${{ needs.health-check.outputs.fleet_partner_portal }}
          DRTS_DEV_TENANT_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.tenant_console }}
          DRTS_DEV_BANK_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.bank_console }}
          DRTS_DEV_PARTNER_BOOKING_BASE_URL: ${{ needs.health-check.outputs.partner_booking }}
          DRTS_DEV_ENTERPRISE_DISPATCH_BASE_URL: ${{ needs.health-check.outputs.enterprise_dispatch }}
          ENTERPRISE_DISPATCH_BASE_URL: ${{ needs.health-check.outputs.enterprise_dispatch }}
          DRTS_DEV_CHANNEL_PARTNER_PORTAL_BASE_URL: ${{ needs.health-check.outputs.channel_partner_portal }}
          DRTS_DEV_REFERRAL_EMBED_BASE_URL: ${{ needs.health-check.outputs.referral_embed }}
        run: |
          set -euo pipefail
          pnpm exec playwright test --retries=1 --config playwright.dev-runtime-matrix.config.ts
          pnpm exec playwright test --retries=1 --config playwright.bank-console-depth.config.ts
          pnpm exec playwright test --retries=1 --config playwright.bank-console-auth.config.ts
          pnpm exec playwright test --retries=1 --config playwright.ops-console-parity.config.ts
          pnpm exec playwright test --retries=1 --config playwright.ops-assistant.config.ts
          pnpm exec playwright test --retries=1 --config playwright.fleet-partner-portal.config.ts
          pnpm exec playwright test --retries=1 --config playwright.partner-booking-surfaces.config.ts
          pnpm exec playwright test --retries=1 --config playwright.enterprise-dispatch.config.ts
          pnpm exec playwright test --retries=1 --config playwright.channel-partner-portal.config.ts
          pnpm exec playwright test --retries=1 --config playwright.referral-embed.config.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-ui-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
