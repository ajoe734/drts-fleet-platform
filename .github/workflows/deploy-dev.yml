            ${{ needs.prepare.outputs.registry }}/referral-embed-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=referral-embed-web
          cache-to: type=gha,scope=referral-embed-web,mode=min

      - name: Build & push — enterprise-dispatch-web
        if: steps.existing.outputs.enterprise-dispatch-web != 'true'
