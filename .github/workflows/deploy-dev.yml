            ${{ needs.prepare.outputs.registry }}/enterprise-dispatch-web:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/enterprise-dispatch-web:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/enterprise-dispatch-web:cache,mode=max

      - name: Build & push — channel-partner-portal-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/channel-partner-portal-web/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:${{ steps.tag.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:cache,mode=max

  migrate:
    name: DB migration
    runs-on: ubuntu-latest
    needs: [prepare, build-push]
    if: ${{ inputs.skip_migration != 'true' }}
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Validate runtime identity split
        run: |
          set -euo pipefail

          deployer_sa="${DEV_WIF_SERVICE_ACCOUNT:-${WIF_SERVICE_ACCOUNT:-}}"
          if [[ "${{ needs.prepare.outputs.runtime_service_account }}" == "$deployer_sa" ]]; then
            echo "::error::Cloud Run runtime identity resolves to the GitHub deployer identity. Configure a separate runtime service account."
            exit 1
          fi

      - name: Create / update migration job definition
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/migrate:${{ needs.build-push.outputs.image_tag }}"
          DB_SECRET="${{ needs.prepare.outputs.secret_prefix }}-db-url"

          gcloud run jobs update "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "DATABASE_URL=${DB_SECRET}:latest" \
            --max-retries 0 \
            --project "${{ needs.prepare.outputs.project_id }}" \
          || gcloud run jobs create "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "DATABASE_URL=${DB_SECRET}:latest" \
            --max-retries 0 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Execute migration job and wait for completion
        run: |
          gcloud run jobs execute "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --wait \
            --project "${{ needs.prepare.outputs.project_id }}"

  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    needs: [prepare, build-push, migrate]
    if: ${{ always() && needs.build-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    environment: dev

    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Resolve API secret mounts
        id: api_secrets
        run: |
          set -euo pipefail

          secret_prefix="${{ needs.prepare.outputs.secret_prefix }}"
          project_id="${{ needs.prepare.outputs.project_id }}"
          secret_args="DATABASE_URL=${secret_prefix}-db-url:latest,API_KEY_SALT=${secret_prefix}-api-key-salt:latest,JWT_SECRET=${secret_prefix}-jwt-secret:latest"
          web_secret_args="JWT_SECRET=${secret_prefix}-jwt-secret:latest"
          referral_embed_secret_args="$web_secret_args"
          ops_secret_args="$web_secret_args"
          map_provider_mode="mock"
          assistant_runtime="${DEV_PLATFORM_ADMIN_ASSISTANT_RUNTIME:-openclaw}"
          llm_provider="mock"
          llm_chat_model="mock-chat-v1"
          llm_summarizer_model="mock-summary-v1"
          llm_base_url=""
          openclaw_auth_provider=""
          openclaw_home=""

          controlled_download_secret="${secret_prefix}-controlled-download-signing-secret"
          if ! gcloud secrets describe "$controlled_download_secret" --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Required secret ${controlled_download_secret} not found in project ${project_id}."
            exit 1
          fi
          secret_args="${secret_args},CONTROLLED_DOWNLOAD_SIGNING_SECRET=${controlled_download_secret}:latest"

          # Dev reuses the already-managed JWT secret for internal handoff.
          # Production environments can map these slots to distinct secrets.
          internal_key_secret="${secret_prefix}-jwt-secret"
          secret_args="${secret_args},DRTS_INTERNAL_KEY=${internal_key_secret}:latest"
          web_secret_args="${web_secret_args},DRTS_INTERNAL_KEY=${internal_key_secret}:latest"
          referral_embed_secret_args="${referral_embed_secret_args},DRTS_INTERNAL_KEY=${internal_key_secret}:latest"

          referral_handoff_secret="${secret_prefix}-referral-embed-handoff-key"
          if ! gcloud secrets describe "$referral_handoff_secret" --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Required secret ${referral_handoff_secret} not found in project ${project_id}."
            exit 1
          fi
          secret_args="${secret_args},DRTS_REFERRAL_EMBED_HANDOFF_KEY=${referral_handoff_secret}:latest"
          referral_embed_secret_args="${referral_embed_secret_args},DRTS_REFERRAL_EMBED_HANDOFF_KEY=${referral_handoff_secret}:latest"

          referral_partner_ingress_secret="${secret_prefix}-referral-embed-partner-ingress-key"
          if ! gcloud secrets describe "$referral_partner_ingress_secret" --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Required secret ${referral_partner_ingress_secret} not found in project ${project_id}."
            exit 1
          fi
          secret_args="${secret_args},PARTNER_INGRESS_KEY_YUHE_RESIDENCE=${referral_partner_ingress_secret}:latest"

          # Dev embeds use server-to-server handoff. Map the managed secret to
          # issuer-scoped credential slots without exposing it to the
          # browser or accepting API keys from query parameters.
          secret_args="${secret_args},PARTNER_INGRESS_KEY_CTBC=${internal_key_secret}:latest"
          secret_args="${secret_args},PARTNER_INGRESS_KEY_CATHAY=${internal_key_secret}:latest"
          secret_args="${secret_args},PARTNER_INGRESS_KEY_TAISHIN=${internal_key_secret}:latest"
          secret_args="${secret_args},PARTNER_INGRESS_KEY_DBS=${internal_key_secret}:latest"

          geocoding_secret="${secret_prefix}-google-maps-geocoding-api-key"
          routes_secret="${secret_prefix}-google-maps-routes-api-key"
          browser_secret="${secret_prefix}-google-maps-browser-key"
          map_secret_count=0
          for map_secret in "$geocoding_secret" "$routes_secret" "$browser_secret"; do
            if gcloud secrets describe "$map_secret" --project "$project_id" >/dev/null 2>&1; then
              map_secret_count=$((map_secret_count + 1))
            fi
          done
          if [[ "$map_secret_count" -eq 3 ]]; then
            secret_args="${secret_args},GOOGLE_MAPS_GEOCODING_API_KEY=${geocoding_secret}:latest,GOOGLE_MAPS_ROUTES_API_KEY=${routes_secret}:latest"
            ops_secret_args="${ops_secret_args},GOOGLE_MAPS_BROWSER_KEY=${browser_secret}:latest"
            map_provider_mode="external"
          elif [[ "$map_secret_count" -ne 0 ]]; then
            echo "::error::Google Maps configuration is partial. Geocoding, Routes, and Browser secrets must be provisioned together."
            exit 1
          fi

          llm_secret="${secret_prefix}-llm-gateway-api-key"
          if gcloud secrets describe "$llm_secret" --project "$project_id" >/dev/null 2>&1; then
            secret_args="${secret_args},LLM_GATEWAY_API_KEY=${llm_secret}:latest"
            if [[ "$assistant_runtime" == "openclaw" ]]; then
              llm_provider="openclaw"
              llm_chat_model="${DEV_OPENCLAW_AGENT_MODEL:-openai/gpt-5.5}"
              llm_summarizer_model="${DEV_OPENCLAW_SUMMARIZER_MODEL:-openai/gpt-5.4-mini}"
              openclaw_auth_provider="${DEV_OPENCLAW_AUTH_PROVIDER:-}"
              openclaw_home="${DEV_OPENCLAW_HOME:-/tmp/platform-admin-assistant-openclaw}"
            else
              llm_provider="${DEV_LLM_GATEWAY_PROVIDER:-openai}"
              llm_chat_model="${DEV_LLM_GATEWAY_CHAT_MODEL:-gpt-4.1-mini}"
              llm_summarizer_model="${DEV_LLM_GATEWAY_SUMMARIZER_MODEL:-gpt-4.1-mini}"
              llm_base_url="${DEV_LLM_GATEWAY_BASE_URL:-}"
            fi
          fi

          echo "api=${secret_args}" >> "$GITHUB_OUTPUT"
          echo "web=${web_secret_args}" >> "$GITHUB_OUTPUT"
          echo "referral_embed=${referral_embed_secret_args}" >> "$GITHUB_OUTPUT"
          echo "ops=${ops_secret_args}" >> "$GITHUB_OUTPUT"
          echo "map_provider_mode=${map_provider_mode}" >> "$GITHUB_OUTPUT"
          echo "llm_provider=${llm_provider}" >> "$GITHUB_OUTPUT"
          echo "llm_chat_model=${llm_chat_model}" >> "$GITHUB_OUTPUT"
          echo "llm_summarizer_model=${llm_summarizer_model}" >> "$GITHUB_OUTPUT"
          echo "llm_base_url=${llm_base_url}" >> "$GITHUB_OUTPUT"
          echo "openclaw_auth_provider=${openclaw_auth_provider}" >> "$GITHUB_OUTPUT"
          echo "openclaw_home=${openclaw_home}" >> "$GITHUB_OUTPUT"

      - name: Verify live Google Maps provider
        if: ${{ steps.api_secrets.outputs.map_provider_mode == 'external' }}
        run: |
          set -euo pipefail

          project_id="${{ needs.prepare.outputs.project_id }}"
          secret_prefix="${{ needs.prepare.outputs.secret_prefix }}"
          export GOOGLE_MAPS_GEOCODING_API_KEY="$(gcloud secrets versions access latest --secret="${secret_prefix}-google-maps-geocoding-api-key" --project="$project_id")"
          export GOOGLE_MAPS_ROUTES_API_KEY="$(gcloud secrets versions access latest --secret="${secret_prefix}-google-maps-routes-api-key" --project="$project_id")"
          export GOOGLE_MAPS_BROWSER_KEY="$(gcloud secrets versions access latest --secret="${secret_prefix}-google-maps-browser-key" --project="$project_id")"
          export MAP_PROVIDER_SMOKE_ORIGIN="${DEV_MAP_PROVIDER_ALLOWED_ORIGINS}"
          echo "::add-mask::${GOOGLE_MAPS_GEOCODING_API_KEY}"
          echo "::add-mask::${GOOGLE_MAPS_ROUTES_API_KEY}"
          echo "::add-mask::${GOOGLE_MAPS_BROWSER_KEY}"
          node scripts/verify-google-map-provider-live.mjs

      - name: Build API env vars
        id: api_env
        run: |
          set -euo pipefail

          env_vars="NODE_ENV=production,DRTS_ENV=development,AUTH_MODE=explicit,API_PORT=3001,DRTS_INTERNAL_KEY_ENFORCED=false,PLATFORM_ADMIN_ASSISTANT_ENABLED=true,LLM_GATEWAY_PROVIDER=${{ steps.api_secrets.outputs.llm_provider }},LLM_GATEWAY_CHAT_MODEL=${{ steps.api_secrets.outputs.llm_chat_model }},LLM_GATEWAY_SUMMARIZER_MODEL=${{ steps.api_secrets.outputs.llm_summarizer_model }},MAP_PROVIDER_MODE=${{ steps.api_secrets.outputs.map_provider_mode }},MAP_PROVIDER_BACKEND=${{ steps.api_secrets.outputs.map_provider_mode == 'external' && 'google' || 'mock' }},MAP_PROVIDER_NAME=${{ steps.api_secrets.outputs.map_provider_mode == 'external' && 'google' || 'mock' }}"
          if [[ -n "${DEV_MAP_PROVIDER_ALLOWED_ORIGINS:-}" ]]; then
            env_vars="${env_vars},MAP_PROVIDER_ALLOWED_ORIGINS=${DEV_MAP_PROVIDER_ALLOWED_ORIGINS}"
          fi
          if [[ -n "${{ steps.api_secrets.outputs.llm_base_url }}" ]]; then
            env_vars="${env_vars},LLM_GATEWAY_BASE_URL=${{ steps.api_secrets.outputs.llm_base_url }}"
          fi
          if [[ "${{ steps.api_secrets.outputs.llm_provider }}" == "openclaw" ]]; then
            env_vars="${env_vars},OPENCLAW_AGENT_MODEL=${{ steps.api_secrets.outputs.llm_chat_model }}"
            if [[ -n "${{ steps.api_secrets.outputs.openclaw_auth_provider }}" ]]; then
              env_vars="${env_vars},OPENCLAW_AUTH_PROVIDER=${{ steps.api_secrets.outputs.openclaw_auth_provider }}"
            fi
            if [[ -n "${{ steps.api_secrets.outputs.openclaw_home }}" ]]; then
              env_vars="${env_vars},OPENCLAW_HOME=${{ steps.api_secrets.outputs.openclaw_home }}"
            fi
          fi

          echo "vars=${env_vars}" >> "$GITHUB_OUTPUT"

      - name: Deploy — api
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/api:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3001 \
            --ingress all \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.api }}" \
            --set-env-vars "${{ steps.api_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.api_exposure_flag }} \
            --min-instances 0 \
            --max-instances 3 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Resolve API URL
        id: api_url
        run: |
          URL="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Build shared web env vars
        id: web_env
        run: |
          set -euo pipefail

          api_origin="${{ needs.prepare.outputs.api_origin }}"
          if [[ -z "$api_origin" ]]; then
            api_origin="${{ steps.api_url.outputs.url }}"
          fi

          env_vars="NODE_ENV=production,DRTS_API_URL=${api_origin},NEXT_PUBLIC_API_URL=/control-plane-proxy,DRTS_ENTERPRISE_DISPATCH_TENANT_ID=10000000-0000-0000-0000-000000000201,DRTS_TENANT_CONSOLE_TENANT_ID=10000000-0000-0000-0000-000000000201,MAP_PROVIDER_MODE=${{ steps.api_secrets.outputs.map_provider_mode }},MAP_PROVIDER_NAME=${{ steps.api_secrets.outputs.map_provider_mode == 'external' && 'google' || 'mock' }}"
          if [[ -n "${DEV_MAP_PROVIDER_ALLOWED_ORIGINS:-}" ]]; then
            env_vars="${env_vars},MAP_PROVIDER_ALLOWED_ORIGINS=${DEV_MAP_PROVIDER_ALLOWED_ORIGINS}"
          fi

          if [[ -n "${DEV_IAP_CLIENT_ID:-}" ]]; then
            env_vars="${env_vars},DRTS_API_AUTH_AUDIENCE=${DEV_IAP_CLIENT_ID}"
          fi

          echo "vars=${env_vars}" >> "$GITHUB_OUTPUT"

      - name: Deploy — platform-admin-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/platform-admin-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3002 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.web }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},NEXT_PUBLIC_PLATFORM_ADMIN_ASSISTANT_ENABLED=true" \
            ${{ needs.prepare.outputs.platform_admin_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — ops-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/ops-console-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3003 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.ops }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.ops_console_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — fleet-partner-portal-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3007 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.fleet_partner_portal_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — tenant-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/tenant-console-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.tenant_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3004 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest,DRTS_PARTNER_SESSION_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.tenant_console_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — bank-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/bank-console-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.bank_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3008 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.bank_console_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — referral-embed-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/referral-embed-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.referral_embed_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3014 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.referral_embed }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},REFERRAL_EMBED_ALLOWED_HOSTS=app.yuhe-living.com.tw app-stg.yuhe-living.com.tw,REFERRAL_EMBED_DEMO=true,REFERRAL_EMBED_DEFAULT_ENTRY_SLUG=${{ needs.prepare.outputs.referral_embed_entry_slug }}" \
            --allow-unauthenticated \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — enterprise-dispatch-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/enterprise-dispatch-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3010 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.enterprise_dispatch_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — channel-partner-portal-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:${{ needs.build-push.outputs.image_tag }}"

          scripts/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3013 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.channel_partner_portal_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

  paused-partner-booking-cleanup:
    name: Enforce Partner Booking paused state
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: ${{ always() && needs.prepare.result == 'success' }}
    environment: dev
    steps:
      - name: Checkout deployment controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Remove paused Partner Booking Cloud Run service
        run: |
          ./scripts/cleanup-paused-partner-booking-service.sh \
            "${{ needs.prepare.outputs.project_id }}" \
            "${{ needs.prepare.outputs.region }}"

  health-check:
    name: Dev health check
    runs-on: ubuntu-latest
    needs: [prepare, deploy, paused-partner-booking-cleanup]
    if: ${{ always() && needs.deploy.result == 'success' && needs.paused-partner-booking-cleanup.result == 'success' }}
    environment: dev
    outputs:
      api: ${{ steps.urls.outputs.api }}
      platform_admin: ${{ steps.urls.outputs.platform_admin }}
      ops_console: ${{ steps.urls.outputs.ops_console }}
      fleet_partner_portal: ${{ steps.urls.outputs.fleet_partner_portal }}
      tenant_console: ${{ steps.urls.outputs.tenant_console }}
      bank_console: ${{ steps.urls.outputs.bank_console }}
      enterprise_dispatch: ${{ steps.urls.outputs.enterprise_dispatch }}
      channel_partner_portal: ${{ steps.urls.outputs.channel_partner_portal }}
      referral_embed: ${{ steps.urls.outputs.referral_embed }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Wait for services to be Ready
        run: |
          set -euo pipefail

          for svc in \
            "${{ needs.prepare.outputs.api_service }}" \
            "${{ needs.prepare.outputs.platform_admin_service }}" \
            "${{ needs.prepare.outputs.ops_console_service }}" \
            "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            "${{ needs.prepare.outputs.tenant_console_service }}" \
            "${{ needs.prepare.outputs.bank_console_service }}" \
            "${{ needs.prepare.outputs.referral_embed_service }}" \
            "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            "${{ needs.prepare.outputs.channel_partner_portal_service }}"; do
            echo "Waiting for ${svc} ..."
            service_ready=false
            for i in $(seq 1 24); do
              ready="$(gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='value(status.conditions[0].status)' 2>/dev/null || true)"
              echo "  attempt ${i}: Ready=${ready}"
              if [[ "$ready" == "True" ]]; then
                service_ready=true
                break
              fi
              sleep 10
            done
            if [[ "$service_ready" != "true" ]]; then
              echo "::error::${svc} did not reach Ready=True in time."
              gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='yaml(status)' || true
              exit 1
            fi
          done

      - name: Resolve service URLs
        id: urls
        run: |
          api_url="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          platform_admin_url="$(gcloud run services describe "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          ops_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          fleet_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          tenant_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.tenant_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          bank_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.bank_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          referral_embed_url="$(gcloud run services describe "${{ needs.prepare.outputs.referral_embed_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          enterprise_dispatch_url="$(gcloud run services describe "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          channel_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"

          echo "api=${api_url}" >> "$GITHUB_OUTPUT"
          echo "platform_admin=${platform_admin_url}" >> "$GITHUB_OUTPUT"
          echo "ops_console=${ops_console_url}" >> "$GITHUB_OUTPUT"
          echo "fleet_partner_portal=${fleet_partner_portal_url}" >> "$GITHUB_OUTPUT"
          echo "tenant_console=${tenant_console_url}" >> "$GITHUB_OUTPUT"
          echo "bank_console=${bank_console_url}" >> "$GITHUB_OUTPUT"
          echo "referral_embed=${referral_embed_url}" >> "$GITHUB_OUTPUT"
          echo "enterprise_dispatch=${enterprise_dispatch_url}" >> "$GITHUB_OUTPUT"
          echo "channel_partner_portal=${channel_partner_portal_url}" >> "$GITHUB_OUTPUT"

      - name: Verify dev endpoints
        run: |
          curl --fail --silent --show-error "${{ steps.urls.outputs.api }}/health" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.platform_admin }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.ops_console }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.fleet_partner_portal }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.tenant_console }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.bank_console }}" >/dev/null
          referral_embed_path="/embed/${{ needs.prepare.outputs.referral_embed_entry_slug }}"
          referral_embed_body="$(curl --fail --silent --show-error --location \
            "${{ steps.urls.outputs.referral_embed }}${referral_embed_path}")"
          grep --fixed-strings "$referral_embed_path" <<<"$referral_embed_body" >/dev/null
          referral_embed_root_body="$(curl --fail --silent --show-error --location \
            "${{ steps.urls.outputs.referral_embed }}")"
          grep --fixed-strings "$referral_embed_path" <<<"$referral_embed_root_body" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.enterprise_dispatch }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.enterprise_dispatch }}/bookings/new" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.enterprise_dispatch }}/embed/unsupported-host" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.channel_partner_portal }}" >/dev/null

      - name: Verify referral handoff session lifecycle
        run: |
          set -euo pipefail

          api_url="${{ steps.urls.outputs.api }}"
          referral_embed_url="${{ steps.urls.outputs.referral_embed }}"
          entry_slug="${{ needs.prepare.outputs.referral_embed_entry_slug }}"
          entry_host="$(curl --fail --silent --show-error \
            "${api_url}/api/partner/entries/${entry_slug}" \
            | jq -er '.data.entry_host // .data.entryHost')"
          handoff_secret="${{ needs.prepare.outputs.secret_prefix }}-referral-embed-handoff-key"
          handoff_key="$(gcloud secrets versions access latest \
            --secret="$handoff_secret" \
            --project="${{ needs.prepare.outputs.project_id }}")"
          echo "::add-mask::${handoff_key}"

          body_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$body_file" "$headers_file"' EXIT

          issue_artifact() {
            local partner_user_ref="$1"
            local response artifact
            response="$(jq -nc \
              --arg entrySlug "$entry_slug" \
              --arg entryHost "$entry_host" \
              --arg partnerUserRef "$partner_user_ref" \
              '{entrySlug: $entrySlug, entryHost: $entryHost, partnerUserRef: $partnerUserRef}' \
              | curl --fail --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --header "x-drts-referral-handoff-key: ${handoff_key}" \
                --data @- \
                "${api_url}/api/partner/ingress/referral-embed-handoff")"
            artifact="$(jq -er '.data.artifact' <<<"$response")"
            printf '%s' "$artifact"
          }

          exchange_artifact() {
            local artifact="$1"
            local target_host="$2"
            jq -nc \
              --arg artifact "$artifact" \
              --arg entrySlug "$entry_slug" \
              --arg entryHost "$target_host" \
              '{artifact: $artifact, entrySlug: $entrySlug, entryHost: $entryHost}' \
              | curl --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --dump-header "$headers_file" \
                --output "$body_file" \
                --write-out '%{http_code}' \
                --data @- \
                "${referral_embed_url}/api/referral/session"
          }

          artifact="$(issue_artifact "deploy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          [[ "$(exchange_artifact "$artifact" "$entry_host")" == "200" ]]
          jq -e '.ok == true' "$body_file" >/dev/null
          grep -Eqi '^set-cookie: drts_referral_embed_session=' "$headers_file"

          [[ "$(exchange_artifact "$artifact" "$entry_host")" == "400" ]]
          artifact_for_wrong_host="$(issue_artifact "deploy-smoke-cross-host-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          [[ "$(exchange_artifact "$artifact_for_wrong_host" "evil.example")" == "400" ]]

      - name: Print dev URLs
        run: |
          echo "=== Dev deployment complete ==="
          echo "  api: ${{ steps.urls.outputs.api }}"
          echo "  platform-admin: ${{ steps.urls.outputs.platform_admin }}"
          echo "  ops-console: ${{ steps.urls.outputs.ops_console }}"
          echo "  fleet-partner-portal: ${{ steps.urls.outputs.fleet_partner_portal }}"
          echo "  tenant-console: ${{ steps.urls.outputs.tenant_console }}"
          echo "  bank-console: ${{ steps.urls.outputs.bank_console }}"
          echo "  referral-embed-web: ${{ steps.urls.outputs.referral_embed }}/embed/${{ needs.prepare.outputs.referral_embed_entry_slug }}"
          echo "  partner-booking: PAUSED (service removed; code preserved)"
          echo "  enterprise-dispatch: ${{ steps.urls.outputs.enterprise_dispatch }}"
          echo "  channel-partner-portal: ${{ steps.urls.outputs.channel_partner_portal }}"

  ui-smoke:
    name: Dev UI smoke (playwright vs deployed)
    runs-on: ubuntu-latest
    needs: [prepare, health-check]
    if: ${{ always() && needs.health-check.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Post-deploy UI smoke: drives the deployed dev front-ends with a real browser
      # across all business-line surfaces. URLs come from the health-check job's
      # resolved Cloud Run service URLs.
      - name: Run UI smoke against deployed dev
        env:
          DRTS_DEV_API_BASE_URL: ${{ needs.health-check.outputs.api }}
          DRTS_DEV_PLATFORM_ADMIN_BASE_URL: ${{ needs.health-check.outputs.platform_admin }}
          DRTS_DEV_OPS_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.ops_console }}
          LIVE_GOOGLE_MAP_BASE_URL: ${{ needs.health-check.outputs.ops_console }}
          DRTS_DEV_FLEET_PARTNER_PORTAL_BASE_URL: ${{ needs.health-check.outputs.fleet_partner_portal }}
          DRTS_DEV_TENANT_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.tenant_console }}
          DRTS_DEV_BANK_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.bank_console }}
          DRTS_DEV_ENTERPRISE_DISPATCH_BASE_URL: ${{ needs.health-check.outputs.enterprise_dispatch }}
          ENTERPRISE_DISPATCH_BASE_URL: ${{ needs.health-check.outputs.enterprise_dispatch }}
          DRTS_DEV_CHANNEL_PARTNER_PORTAL_BASE_URL: ${{ needs.health-check.outputs.channel_partner_portal }}
          DRTS_DEV_REFERRAL_EMBED_BASE_URL: ${{ needs.health-check.outputs.referral_embed }}
          DRTS_REFERRAL_EMBED_ENTRY_SLUG: ${{ needs.prepare.outputs.referral_embed_entry_slug }}
        run: |
          set -euo pipefail
          smoke_status=0
          run_suite() {
            local config="$1"
            local suite="${config#playwright.}"
            suite="${suite%.config.ts}"
            echo "::group::Playwright ${config}"
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/${suite}" \
              pnpm exec playwright test \
                --retries=1 \
                --config "${config}" \
                --reporter=list,html \
                --output "test-results/${suite}" || smoke_status=1
            echo "::endgroup::"
          }

          run_suite playwright.bank-console-depth.config.ts
          run_suite playwright.bank-console-auth.config.ts
          run_suite playwright.ops-console-parity.config.ts
          run_suite playwright.google-map-live.config.ts
          run_suite playwright.ops-assistant.config.ts
          run_suite playwright.fleet-partner-portal.config.ts
          run_suite playwright.enterprise-dispatch.config.ts
          run_suite playwright.channel-partner-portal.config.ts
          run_suite playwright.referral-embed.config.ts
          run_suite playwright.platform-admin-service-area.config.ts
          # Run the high-volume matrix after business-flow suites so load
          # coverage cannot starve or mask airport and operations regressions.
          run_suite playwright.dev-runtime-matrix.config.ts
          exit "${smoke_status}"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-ui-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  retired-service-cleanup:
    name: Fail-closed retired service cleanup
    runs-on: ubuntu-latest
    needs: [prepare, health-check, ui-smoke]
    if: ${{ always() && needs.health-check.result == 'success' && needs.ui-smoke.result == 'success' }}
    environment: dev
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Enforce retired service cleanup contract
        env:
          RETIRED_SERVICE_CLEANUP: ${{ inputs.retired_service_cleanup || 'none' }}
        run: |
          ./scripts/cleanup-retired-dev-service.sh \
            "${RETIRED_SERVICE_CLEANUP}" \
            "${{ needs.prepare.outputs.project_id }}" \
            "${{ needs.prepare.outputs.region }}"
