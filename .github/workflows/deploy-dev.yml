      - name: Enforce no public access — channel-partner-portal-web
        if: ${{ needs.prepare.outputs.channel_partner_portal_exposure_flag == '--no-allow-unauthenticated' }}
        run: |
          ./operations/deployment/enforce-no-public-access.sh \
            "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            "${{ needs.prepare.outputs.region }}" \
            "${{ needs.prepare.outputs.project_id }}"

  paused-partner-booking-cleanup:
    name: Enforce Partner Booking paused state
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: ${{ always() && needs.prepare.result == 'success' }}
    environment: dev
    steps:
      - name: Checkout deployment controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Remove paused Partner Booking Cloud Run service
        run: |
          ./operations/deployment/cleanup-paused-partner-booking-service.sh \
            "${{ needs.prepare.outputs.project_id }}" \
            "${{ needs.prepare.outputs.region }}"

  health-check:
    name: Dev health check
    runs-on: ubuntu-latest
    needs: [prepare, deploy, paused-partner-booking-cleanup]
    if: ${{ always() && needs.deploy.result == 'success' && needs.paused-partner-booking-cleanup.result == 'success' }}
    environment: dev
    outputs:
      api: ${{ steps.urls.outputs.api }}
      platform_admin: ${{ steps.urls.outputs.platform_admin }}
      ops_console: ${{ steps.urls.outputs.ops_console }}
      fleet_partner_portal: ${{ steps.urls.outputs.fleet_partner_portal }}
      tenant_console: ${{ steps.urls.outputs.tenant_console }}
      bank_console: ${{ steps.urls.outputs.bank_console }}
      enterprise_dispatch: ${{ steps.urls.outputs.enterprise_dispatch }}
      channel_partner_portal: ${{ steps.urls.outputs.channel_partner_portal }}
      referral_embed: ${{ steps.urls.outputs.referral_embed }}

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Wait for services to be Ready
        run: |
          set -euo pipefail

          for svc in \
            "${{ needs.prepare.outputs.api_service }}" \
            "${{ needs.prepare.outputs.platform_admin_service }}" \
            "${{ needs.prepare.outputs.ops_console_service }}" \
            "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            "${{ needs.prepare.outputs.tenant_console_service }}" \
            "${{ needs.prepare.outputs.bank_console_service }}" \
            "${{ needs.prepare.outputs.referral_embed_service }}" \
            "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            "${{ needs.prepare.outputs.channel_partner_portal_service }}"; do
            echo "Waiting for ${svc} ..."
            service_ready=false
            for i in $(seq 1 24); do
              ready="$(gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='value(status.conditions[0].status)' 2>/dev/null || true)"
              echo "  attempt ${i}: Ready=${ready}"
              if [[ "$ready" == "True" ]]; then
                service_ready=true
                break
              fi
              sleep 10
            done
            if [[ "$service_ready" != "true" ]]; then
              echo "::error::${svc} did not reach Ready=True in time."
              gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='yaml(status)' || true
              exit 1
            fi
          done

      - name: Resolve service URLs
        id: urls
        run: |
          api_url="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          platform_admin_url="$(gcloud run services describe "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          ops_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          fleet_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          tenant_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.tenant_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          bank_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.bank_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          referral_embed_url="$(gcloud run services describe "${{ needs.prepare.outputs.referral_embed_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          enterprise_dispatch_url="$(gcloud run services describe "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          channel_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"

          echo "api=${api_url}" >> "$GITHUB_OUTPUT"
          echo "platform_admin=${platform_admin_url}" >> "$GITHUB_OUTPUT"
          echo "ops_console=${ops_console_url}" >> "$GITHUB_OUTPUT"
          echo "fleet_partner_portal=${fleet_partner_portal_url}" >> "$GITHUB_OUTPUT"
          echo "tenant_console=${tenant_console_url}" >> "$GITHUB_OUTPUT"
          echo "bank_console=${bank_console_url}" >> "$GITHUB_OUTPUT"
          echo "referral_embed=${referral_embed_url}" >> "$GITHUB_OUTPUT"
          echo "enterprise_dispatch=${enterprise_dispatch_url}" >> "$GITHUB_OUTPUT"
          echo "channel_partner_portal=${channel_partner_portal_url}" >> "$GITHUB_OUTPUT"

      # gcloud auth print-identity-token, and IAM credentials API generateIdToken
      # called with an *already-impersonated* SA access token (self-impersonation),
      # both fail silently under Workload Identity Federation: the WIF principal's
      # Token Creator grant on the runtime SA covers access-token impersonation,
      # not a second-hop ID-token mint from the SA's own derived access token. The
      # google-github-actions/auth action mints the ID token from the original WIF
      # federation exchange instead, so it stays within the already-granted trust
      # chain. One step per private-service audience since the action mints for a
      # single audience at a time.
      - name: Mint identity token — tenant console
        id: id_token_tenant_console
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.tenant_console }}
          id_token_include_email: true

      - name: Mint identity token — bank console
        id: id_token_bank_console
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.bank_console }}
          id_token_include_email: true

      - name: Mint identity token — enterprise dispatch
        id: id_token_enterprise_dispatch
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.enterprise_dispatch }}
          id_token_include_email: true

      - name: Mint identity token — platform admin
        id: id_token_platform_admin
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.platform_admin }}
          id_token_include_email: true

      - name: Mint identity token — ops console
        id: id_token_ops_console
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.ops_console }}
          id_token_include_email: true

      - name: Mint identity token — fleet partner portal
        id: id_token_fleet_partner_portal
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.fleet_partner_portal }}
          id_token_include_email: true

      - name: Mint identity token — channel partner portal
        id: id_token_channel_partner_portal
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.channel_partner_portal }}
          id_token_include_email: true

      - name: Verify dev endpoints
        env:
          TENANT_CONSOLE_ID_TOKEN: ${{ steps.id_token_tenant_console.outputs.id_token }}
          BANK_CONSOLE_ID_TOKEN: ${{ steps.id_token_bank_console.outputs.id_token }}
          ENTERPRISE_DISPATCH_ID_TOKEN: ${{ steps.id_token_enterprise_dispatch.outputs.id_token }}
          PLATFORM_ADMIN_ID_TOKEN: ${{ steps.id_token_platform_admin.outputs.id_token }}
          OPS_CONSOLE_ID_TOKEN: ${{ steps.id_token_ops_console.outputs.id_token }}
          FLEET_PARTNER_PORTAL_ID_TOKEN: ${{ steps.id_token_fleet_partner_portal.outputs.id_token }}
          CHANNEL_PARTNER_PORTAL_ID_TOKEN: ${{ steps.id_token_channel_partner_portal.outputs.id_token }}
        run: |
          echo "::add-mask::${TENANT_CONSOLE_ID_TOKEN}"
          echo "::add-mask::${BANK_CONSOLE_ID_TOKEN}"
          echo "::add-mask::${ENTERPRISE_DISPATCH_ID_TOKEN}"
          echo "::add-mask::${PLATFORM_ADMIN_ID_TOKEN}"
          echo "::add-mask::${OPS_CONSOLE_ID_TOKEN}"
          echo "::add-mask::${FLEET_PARTNER_PORTAL_ID_TOKEN}"
          echo "::add-mask::${CHANNEL_PARTNER_PORTAL_ID_TOKEN}"

          for name in TENANT_CONSOLE_ID_TOKEN BANK_CONSOLE_ID_TOKEN ENTERPRISE_DISPATCH_ID_TOKEN PLATFORM_ADMIN_ID_TOKEN OPS_CONSOLE_ID_TOKEN FLEET_PARTNER_PORTAL_ID_TOKEN CHANNEL_PARTNER_PORTAL_ID_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is empty; identity token minting failed upstream." >&2
              exit 1
            fi
          done

          curl_ready() {
            curl --fail --silent --show-error --location \
              --retry 10 --retry-all-errors --retry-delay 3 --max-time 30 "$@"
          }

          curl_ready_auth() {
            local target_url="$1"
            local id_token="$2"
            shift 2
            curl --fail --silent --show-error --location-trusted \
              --retry 10 --retry-all-errors --retry-delay 3 --max-time 30 \
              --header "Authorization: Bearer ${id_token}" \
              "$target_url" "$@"
          }

          curl_ready "${{ steps.urls.outputs.api }}/health" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.platform_admin }}" "${PLATFORM_ADMIN_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.ops_console }}" "${OPS_CONSOLE_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.fleet_partner_portal }}" "${FLEET_PARTNER_PORTAL_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.tenant_console }}" "${TENANT_CONSOLE_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.bank_console }}" "${BANK_CONSOLE_ID_TOKEN}" >/dev/null
          referral_embed_path="/embed/${{ needs.prepare.outputs.referral_embed_entry_slug }}"
          referral_embed_body="$(curl_ready \
            "${{ steps.urls.outputs.referral_embed }}${referral_embed_path}")"
          grep --fixed-strings "$referral_embed_path" <<<"$referral_embed_body" >/dev/null
          referral_embed_root_body="$(curl_ready \
            "${{ steps.urls.outputs.referral_embed }}")"
          grep --fixed-strings "$referral_embed_path" <<<"$referral_embed_root_body" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.enterprise_dispatch }}" "${ENTERPRISE_DISPATCH_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.enterprise_dispatch }}/bookings/new" "${ENTERPRISE_DISPATCH_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.enterprise_dispatch }}/embed/unsupported-host" "${ENTERPRISE_DISPATCH_ID_TOKEN}" >/dev/null
          curl_ready_auth "${{ steps.urls.outputs.channel_partner_portal }}" "${CHANNEL_PARTNER_PORTAL_ID_TOKEN}" >/dev/null

      - name: Re-authenticate to GCP (restore access-token credentials)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      # SEC-INTERNAL-KEY-EXCP-001-WIF-MIGRATION-20261002: INTERNAL_KEY_EXCP_001
      # (x-drts-referral-handoff-key) is retired and removed from
      # INTERNAL_KEY_EXCEPTION_REGISTRY. The three referral embed handoff
      # routes now verify a Google-signed workload identity assertion via
      # GoogleWorkloadIdentityAdapter instead, same as the operational
      # acceptance job's POST /api/auth/token calls above. This step's direct
      # call to the issuance route authenticates as this workflow's own WIF
      # service account (`github-actions-deployer`). That identity can only
      # ever be impersonated as itself from GitHub Actions -- the deployer
      # service account's only grant on the runtime service account is
      # `roles/iam.serviceAccountUser` (act-as, for `gcloud run deploy
      # --service-account`), not `roles/iam.serviceAccountTokenCreator`, so
      # this workflow cannot mint a token as `drts-dev-runtime` instead (see
      # infra/gcp/dev/provision-dev-project.sh's IAM bindings). Reaching the
      # issuance route therefore requires ops to add
      # `"POST partner/ingress/referral-embed-handoff"` to the
      # github-actions-deployer principal's `routeScopes` in the deployed
      # `WORKLOAD_IDENTITY_GOOGLE_SERVICE_PRINCIPALS` registry secret -- see
      # docs/02-architecture/internal-key-exceptions.md §10.3/§10.5 for the
      # exact value and why this one-time registry rollout cannot be
      # replaced by a code-only change. The read-only check below detects
      # whether that rollout has already landed and only then runs the full
      # issue/consume/replay/cross-host lifecycle as a hard gate; until it
      # lands, this step still makes the real call and asserts the precise
      # fail-closed rejection, but does not fail the deploy for that one
      # documented, operator-actionable, pending condition. The consume call
      # goes through referral-embed-web's own BFF, which already
      # authenticates as `drts-dev-runtime` (routeScopes `["* *"]`, no
      # registry change needed) and needs no registry rollout of its own --
      # but it still cannot be exercised pre-rollout, because there is no
      # issued artifact to consume until the issuance route itself is
      # reachable. Pre-rollout, only the fail-closed issuance rejection runs
      # as a hard gate; the full issue/consume/replay/cross-host lifecycle
      # only becomes a hard gate once the registry rollout has landed. This
      # is the one documented, operator-actionable external prerequisite
      # this task cannot close by itself (see §10.3/§10.6) -- it is not a
      # repaired condition, and the smoke test is not being skipped: the
      # real rejection is asserted every run, before rollout, and the real
      # positive lifecycle is asserted every run, after rollout.
      - name: Check referral embed handoff WIF registry rollout state
        id: referral_handoff_rollout
        env:
          PROJECT_ID: ${{ needs.prepare.outputs.project_id }}
          SECRET_PREFIX: ${{ needs.prepare.outputs.secret_prefix }}
        run: |
          set -euo pipefail
          registry_secret="${SECRET_PREFIX}-workload-identity-google-service-principals"
          applied=false
          if gcloud secrets describe "$registry_secret" --project "$PROJECT_ID" >/dev/null 2>&1; then
            registry_json="$(gcloud secrets versions access latest \
              --secret="$registry_secret" --project "$PROJECT_ID")"
            if jq -e '
                any(.[]?; (.principalId == "dev-ci-deployer" or
                  (.serviceAccountEmail // "" | test("^github-actions-deployer@")))
                  and (.routeScopes // [] | index("POST partner/ingress/referral-embed-handoff")))
              ' >/dev/null 2>&1 <<<"$registry_json"; then
              applied=true
            fi
          fi
          echo "applied=${applied}" >> "$GITHUB_OUTPUT"
          echo "::notice::referral embed handoff WIF registry rollout applied=${applied}"

      - name: Mint identity token — referral embed handoff (API)
        id: id_token_referral_handoff
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ steps.urls.outputs.api }}
          id_token_include_email: true

      - name: Verify referral handoff session lifecycle
        env:
          REFERRAL_HANDOFF_ID_TOKEN: ${{ steps.id_token_referral_handoff.outputs.id_token }}
          ROLLOUT_APPLIED: ${{ steps.referral_handoff_rollout.outputs.applied }}
        run: |
          set -euo pipefail

          echo "::add-mask::${REFERRAL_HANDOFF_ID_TOKEN}"
          if [[ -z "${REFERRAL_HANDOFF_ID_TOKEN:-}" ]]; then
            echo "::error::REFERRAL_HANDOFF_ID_TOKEN is empty; identity token minting failed upstream." >&2
            exit 1
          fi

          api_url="${{ steps.urls.outputs.api }}"
          referral_embed_url="${{ steps.urls.outputs.referral_embed }}"
          entry_slug="${{ needs.prepare.outputs.referral_embed_entry_slug }}"
          entry_host="$(curl --fail --silent --show-error \
            "${api_url}/api/partner/entries/${entry_slug}" \
            | jq -er '.data.entry_host // .data.entryHost')"

          body_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$body_file" "$headers_file"' EXIT

          issue_artifact_status() {
            local partner_user_ref="$1"
            jq -nc \
              --arg entrySlug "$entry_slug" \
              --arg entryHost "$entry_host" \
              --arg partnerUserRef "$partner_user_ref" \
              '{entrySlug: $entrySlug, entryHost: $entryHost, partnerUserRef: $partnerUserRef}' \
              | curl --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --header "x-drts-google-id-token: ${REFERRAL_HANDOFF_ID_TOKEN}" \
                --dump-header "$headers_file" \
                --output "$body_file" \
                --write-out '%{http_code}' \
                --data @- \
                "${api_url}/api/partner/ingress/referral-embed-handoff"
          }

          issue_artifact() {
            local partner_user_ref="$1"
            local status
            status="$(issue_artifact_status "$partner_user_ref")"
            if [[ "$status" != "201" ]]; then
              echo "::error::Referral embed handoff issuance returned HTTP ${status}: $(cat "$body_file")" >&2
              exit 1
            fi
            jq -er '.data.artifact' "$body_file"
          }

          exchange_artifact() {
            local artifact="$1"
            local target_host="$2"
            jq -nc \
              --arg artifact "$artifact" \
              --arg entrySlug "$entry_slug" \
              --arg entryHost "$target_host" \
              '{artifact: $artifact, entrySlug: $entrySlug, entryHost: $entryHost}' \
              | curl --silent --show-error \
                --request POST \
                --header "Content-Type: application/json" \
                --dump-header "$headers_file" \
                --output "$body_file" \
                --write-out '%{http_code}' \
                --data @- \
                "${referral_embed_url}/api/referral/session"
          }

          if [[ "$ROLLOUT_APPLIED" != "true" ]]; then
            # Registry rollout (docs §10.3) has not landed yet: the deployer
            # principal is not yet scoped for this route. Prove the rejection
            # is the exact, expected, fail-closed one -- not a different bug
            # -- then stop without claiming the positive lifecycle passed.
            status="$(issue_artifact_status "deploy-smoke-pending-rollout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
            if [[ "$status" != "403" ]] || ! jq -e '.error.code == "WORKLOAD_ROUTE_SCOPE_DENIED"' "$body_file" >/dev/null 2>&1; then
              echo "::error::Expected the documented pending-rollout rejection (403 WORKLOAD_ROUTE_SCOPE_DENIED) but got HTTP ${status}: $(cat "$body_file")" >&2
              exit 1
            fi
            echo "::warning::referral embed handoff WIF registry rollout (docs/02-architecture/internal-key-exceptions.md §10.3) has not landed yet; fail-closed rejection confirmed, issue/consume/replay/cross-host lifecycle deferred until ops applies it."
          else
            artifact="$(issue_artifact "deploy-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
            [[ "$(exchange_artifact "$artifact" "$entry_host")" == "200" ]]
            jq -e '.ok == true' "$body_file" >/dev/null
            grep -Eqi '^set-cookie: drts_referral_embed_session=' "$headers_file"

            [[ "$(exchange_artifact "$artifact" "$entry_host")" == "400" ]]
            jq -e \
              '.ok == false and .message == "The referral handoff artifact has already been consumed."' \
              "$body_file" >/dev/null
            artifact_for_wrong_host="$(issue_artifact "deploy-smoke-cross-host-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
            [[ "$(exchange_artifact "$artifact_for_wrong_host" "evil.example")" == "400" ]]
            jq -e \
              '.ok == false and .message == "The referral handoff artifact is not valid for this entry host."' \
              "$body_file" >/dev/null
          fi

      - name: Print dev URLs
        run: |
          echo "=== Dev deployment complete ==="
          echo "  api: ${{ steps.urls.outputs.api }}"
          echo "  platform-admin: ${{ steps.urls.outputs.platform_admin }}"
          echo "  ops-console: ${{ steps.urls.outputs.ops_console }}"
          echo "  fleet-partner-portal: ${{ steps.urls.outputs.fleet_partner_portal }}"
          echo "  tenant-console: ${{ steps.urls.outputs.tenant_console }}"
          echo "  bank-console: ${{ steps.urls.outputs.bank_console }}"
          echo "  referral-embed-web: ${{ steps.urls.outputs.referral_embed }}/embed/${{ needs.prepare.outputs.referral_embed_entry_slug }}"
          echo "  partner-booking: PAUSED (service removed; code preserved)"
          echo "  enterprise-dispatch: ${{ steps.urls.outputs.enterprise_dispatch }}"
          echo "  channel-partner-portal: ${{ steps.urls.outputs.channel_partner_portal }}"

  retired-service-cleanup:
    name: Fail-closed retired service cleanup
    runs-on: ubuntu-latest
    needs: [prepare, health-check]
    if: ${{ always() && needs.health-check.result == 'success' }}
    environment: dev
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Enforce retired service cleanup contract
        env:
          RETIRED_SERVICE_CLEANUP: ${{ inputs.retired_service_cleanup || 'none' }}
        run: |
          ./operations/deployment/cleanup-retired-dev-service.sh \
            "${RETIRED_SERVICE_CLEANUP}" \
            "${{ needs.prepare.outputs.project_id }}" \
            "${{ needs.prepare.outputs.region }}"

  operational-candidate-acceptance:
    name: Candidate SHA operational acceptance
    runs-on: ubuntu-latest
    needs: [prepare, build-push, health-check, retired-service-cleanup]
    if: ${{ always() && needs.health-check.result == 'success' && needs.retired-service-cleanup.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-push.outputs.candidate_sha }}
      # CI-DEPLOY-DEV-WIF-ASSERTION-COLLISION-20261002 (F3 repair): no
      # `service_account:` here, on purpose. The Tenant Ops mint step below
      # authenticates its own gcloud call with
      # `--impersonate-service-account="$SERVICE_ACCOUNT"`, which wraps
      # *this* job's base credential in a fresh
      # google.auth.impersonated_credentials.Credentials -- gcloud's own
      # requirement for minting an identity token (see
      # googlecloudsdk/command_lib/auth/auth_util.py's
      # IsImpersonationCredential / ValidIdTokenCredential checks). If this
      # step set `service_account:` too, the base credential loaded from the
      # exported CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE would already be
      # impersonating that same service account (a
      # google.auth.identity_pool.Credentials with
      # service_account_impersonation_url set), so the later
      # `--impersonate-service-account` call would be the service account
      # trying to impersonate *itself* via the IAM Credentials API -- that
      # needs roles/iam.serviceAccountTokenCreator granted on the account by
      # itself, which is not part of this task's granted IAM and must not be
      # added (guardrail: no GCP/IAM changes). Leaving this step as a plain
      # Direct Workload Identity Federation exchange keeps the base
      # credential as the raw GitHub OIDC-federated principal, so the single
      # impersonation call in the Tenant Ops step below uses the same
      # workloadIdentityUser-style grant on that principal that every other
      # `service_account:`-bearing auth@v2 step in this workflow already
      # relies on.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          project_id: ${{ needs.prepare.outputs.project_id }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}
      # SEC-INTERNAL-KEY-WIF-MIGRATION-20260930: this real Google-signed
      # identity token (Google holds the signing key; nothing here invents
      # one) is this step's only credential for its two
      # POST /api/auth/token calls, now that INTERNAL_KEY_EXCP_002 is
      # retired. apps/api's WORKLOAD_IDENTITY_GOOGLE_SERVICE_PRINCIPALS
      # registry must grant this service account (DEV_WIF_SERVICE_ACCOUNT)
      # the two fixed tenant/ops actor tuples below, and
      # WORKLOAD_IDENTITY_CI_TENANT_ACTOR_ENABLED=true must be set, or this
      # step fails closed.
      #
      # CI-DEPLOY-DEV-WIF-ASSERTION-COLLISION-20261002 (F3 follow-up,
      # independent review REOPEN on candidate 4d3e94813): `create_credentials_
      # file` and `export_environment_variables` both default to true on
      # google-github-actions/auth@v2 (action.yml), so leaving them unset here
      # made this step silently overwrite CLOUDSDK_AUTH_CREDENTIAL_FILE_
      # OVERRIDE / GOOGLE_APPLICATION_CREDENTIALS / GOOGLE_GHA_CREDS_PATH with
      # a NEW external_account file whose service_account_impersonation_url
      # already targets $SERVICE_ACCOUNT, even though only this step's
      # `outputs.id_token` is consumed (see the "Issue deployment-machine
      # Tenant acceptance session" step below). The Tenant Ops step after this
      # one loads its *base* credential from that same env-var override via
      # `gcloud auth print-identity-token --impersonate-service-account=...`,
      # so it was picking up this step's already-impersonated credential
      # instead of the raw Direct-WIF one exported by "Authenticate to GCP"
      # above -- i.e. the service account trying to impersonate itself via
      # IAM Credentials API, which needs a self-grant of
      # roles/iam.serviceAccountTokenCreator that is not part of this task's
      # granted IAM and must not be added (guardrail: no GCP/IAM changes).
      # Disabling both file/env export here is safe: the action still returns
      # `outputs.id_token` for `token_format: id_token` independently of
      # whether a credentials file is written (google-github-actions/auth
      # src/main.ts mints the ID token via its own API client before the
      # optional file/env export step), and nothing downstream reads this
      # step's exported credential file -- every other job step either reads
      # `steps.id_token_api_operational.outputs.id_token` directly or mints
      # its own separate auth@v2 credential.
      - name: Mint identity token — API operational acceptance (Tenant Admin)
        id: id_token_api_operational
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.api }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      # CI-DEPLOY-DEV-WIF-ASSERTION-COLLISION-20261002: Google ID tokens are
      # RS256 and deterministic for a given (service account, audience, iat)
      # tuple, so minting the Tenant Ops assertion with a second
      # google-github-actions/auth@v2 step right after the Tenant Admin mint
      # above can return a byte-identical token for the same wall-clock
      # second. GoogleWorkloadIdentityAdapter consumes each assertion exactly
      # once (sha256(token)-keyed replay guard), so that collision makes the
      # second POST /api/auth/token call fail closed with
      # WORKLOAD_ASSERTION_REPLAYED even though these are two independent
      # mint steps. A wait keyed to this runner's own clock cannot guarantee
      # that -- the runner and Google's token-issuing service do not share a
      # clock, so the runner can already read a later second while the
      # issuer is still minting the prior one. Mint with `gcloud` instead, so
      # the *actual* resulting token is compared byte-for-byte against the
      # Tenant Admin token and re-minted on a real collision, bounded so a
      # persistent failure fails the job instead of looping forever. Never
      # print either raw token or its decoded payload.
      #
      # F3 repair (independent review REJECT on candidate 299fdfd8b): the
      # "Authenticate to GCP" step above intentionally has no
      # `service_account:`, so its exported credential is a plain
      # google.auth.identity_pool.Credentials (Direct WIF, no
      # service_account_impersonation_url). `gcloud auth print-identity-token`
      # rejects that credential type outright for both `--audiences` and
      # `--include-email` (auth_util.ValidIdTokenCredential /
      # IsImpersonationCredential both require
      # google.auth.impersonated_credentials.Credentials) -- it fails closed
      # with WrongAccountTypeError before making any network call, which is
      # what turned the original intermittent collision into a deterministic
      # failure. `--impersonate-service-account` makes gcloud wrap that same
      # base credential in a fresh impersonated_credentials.Credentials
      # (googlecloudsdk/core/credentials/store.py's `Load()`, then
      # api_lib/iamcredentials/util.py's GetElevationAccessTokenGoogleAuth /
      # GetElevationIdTokenGoogleAuth), satisfying both checks. The resulting
      # IAM Credentials API generateIdToken call is authenticated with the
      # *source* (raw federated) credential's token, targeting
      # $SERVICE_ACCOUNT -- the same workloadIdentityUser-style grant already
      # exercised by every other auth@v2 step in this workflow, not a new
      # self-impersonation permission.
      #
      # F3 follow-up (independent review REOPEN on candidate 4d3e94813): that
      # "same base credential" claim only holds if the intervening Tenant
      # Admin mint step above does not itself overwrite the exported
      # credential file/env vars with an already-impersonated one -- see the
      # `create_credentials_file: false` / `export_environment_variables:
      # false` note on that step above.
      - name: Mint identity token — API operational acceptance (Tenant Ops)
        id: id_token_api_operational_ops
        env:
          GOOGLE_ID_TOKEN_TENANT_ADMIN: ${{ steps.id_token_api_operational.outputs.id_token }}
          OPS_TOKEN_AUDIENCE: ${{ needs.health-check.outputs.api }}
          SERVICE_ACCOUNT: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          echo "::add-mask::$GOOGLE_ID_TOKEN_TENANT_ADMIN"

          ops_token=""
          for attempt in 1 2 3 4 5; do
            candidate="$(gcloud auth print-identity-token --impersonate-service-account="$SERVICE_ACCOUNT" --audiences="$OPS_TOKEN_AUDIENCE" --include-email)"
            echo "::add-mask::$candidate"
            if [[ "$candidate" != "$GOOGLE_ID_TOKEN_TENANT_ADMIN" ]]; then
              ops_token="$candidate"
              break
            fi
            sleep 1
          done

          if [[ -z "$ops_token" ]]; then
            echo "::error::could not mint a Tenant Ops Google identity token distinct from the Tenant Admin token after 5 attempts" >&2
            exit 1
          fi

          echo "id_token=$ops_token" >> "$GITHUB_OUTPUT"
      - name: Issue deployment-machine Tenant acceptance session
        env:
          API_URL: ${{ needs.health-check.outputs.api }}
          GOOGLE_ID_TOKEN_TENANT_ADMIN: ${{ steps.id_token_api_operational.outputs.id_token }}
          GOOGLE_ID_TOKEN_TENANT_OPS: ${{ steps.id_token_api_operational_ops.outputs.id_token }}
        run: |
          set -euo pipefail

          echo "::add-mask::$GOOGLE_ID_TOKEN_TENANT_ADMIN"
          echo "::add-mask::$GOOGLE_ID_TOKEN_TENANT_OPS"

          assert_tenant_session() {
            local token="$1"
            local expected_role="$2"
            local label="$3"
            local session_check http_status response_body

            session_check="$(curl --silent --show-error --write-out '\n%{http_code}' \
              --request GET "${API_URL}/api/auth/session" \
              --header "authorization: Bearer ${token}")"
            http_status="$(echo "$session_check" | tail -n 1)"
            response_body="$(echo "$session_check" | sed '$d')"
            if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
              echo "::error::${label} session verification failed with HTTP ${http_status}: ${response_body}" >&2
              exit 1
            fi
            jq --exit-status \
              --arg tenant_id '10000000-0000-0000-0000-000000000201' \
              --arg expected_role "$expected_role" \
              '.data.active == true and
               .data.identity.realm == "tenant" and
               .data.identity.tenant_id == $tenant_id and
               (.data.identity.roles | index($expected_role) != null)' \
              <<<"$response_body" >/dev/null || {
                safe_summary="$(jq --compact-output \
                  '{active: .data.active, identity: {
                    actor_id: .data.identity.actor_id,
                    realm: .data.identity.realm,
                    tenant_id: .data.identity.tenant_id,
                    roles: .data.identity.roles
                  }}' <<<"$response_body")"
                echo "::error::${label} session is not bound to the expected durable tenant role: ${safe_summary}" >&2
                exit 1
              }
          }

          session_response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            --request POST "${API_URL}/api/auth/token" \
            --header 'content-type: application/json' \
            --header "x-drts-google-id-token: ${GOOGLE_ID_TOKEN_TENANT_ADMIN}" \
            --header 'x-actor-type: tenant_admin' \
            --header 'x-actor-id: 10000000-0000-0000-0000-000000000901' \
            --header 'x-realm: tenant' \
            --header 'x-tenant-id: 10000000-0000-0000-0000-000000000201' \
            --data '{}')"
          http_status="$(echo "$session_response" | tail -n 1)"
          response_body="$(echo "$session_response" | sed '$d')"
          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Tenant session issuance failed with HTTP ${http_status}: ${response_body}" >&2
            exit 1
          fi
          tenant_session="$(jq --exit-status --raw-output '.token' <<<"$response_body")"
          echo "::add-mask::$tenant_session"
          assert_tenant_session "$tenant_session" "tenant_admin" "Tenant Admin"
          printf 'DRTS_OPERATIONAL_TENANT_SESSION_TOKEN=%s\n' "$tenant_session" >> "$GITHUB_ENV"

          dispatch_response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            --request POST "${API_URL}/api/auth/token" \
            --header 'content-type: application/json' \
            --header "x-drts-google-id-token: ${GOOGLE_ID_TOKEN_TENANT_OPS}" \
            --header 'x-actor-type: tenant_admin' \
            --header 'x-actor-id: 10000000-0000-0000-0000-000000000902' \
            --header 'x-realm: tenant' \
            --header 'x-tenant-id: 10000000-0000-0000-0000-000000000201' \
            --data '{}')"
          http_status="$(echo "$dispatch_response" | tail -n 1)"
          response_body="$(echo "$dispatch_response" | sed '$d')"
          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Tenant Ops session issuance failed with HTTP ${http_status}: ${response_body}" >&2
            exit 1
          fi
          dispatch_session="$(jq --exit-status --raw-output '.token' <<<"$response_body")"
          echo "::add-mask::$dispatch_session"
          assert_tenant_session "$dispatch_session" "tenant_ops_admin" "Tenant Ops"
          printf 'DRTS_OPERATIONAL_DISPATCH_SESSION_TOKEN=%s\n' "$dispatch_session" >> "$GITHUB_ENV"
      - name: Mint identity token — tenant console (operational candidate)
        id: id_token_tenant_console
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.tenant_console }}
          id_token_include_email: true

      - name: Mint identity token — bank console (operational candidate)
        id: id_token_bank_console
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.bank_console }}
          id_token_include_email: true

      - name: Mint identity token — enterprise dispatch (operational candidate)
        id: id_token_enterprise_dispatch
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.enterprise_dispatch }}
          id_token_include_email: true

      - name: Mint identity token — platform admin (operational candidate)
        id: id_token_platform_admin
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.platform_admin }}
          id_token_include_email: true

      - name: Mint identity token — ops console (operational candidate)
        id: id_token_ops_console
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.ops_console }}
          id_token_include_email: true

      - name: Mint identity token — fleet partner portal (operational candidate)
        id: id_token_fleet_partner_portal
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.fleet_partner_portal }}
          id_token_include_email: true

      - name: Mint identity token — channel partner portal (operational candidate)
        id: id_token_channel_partner_portal
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}
          token_format: id_token
          id_token_audience: ${{ needs.health-check.outputs.channel_partner_portal }}
          id_token_include_email: true

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Execute candidate-bound operational journeys
        env:
          DRTS_DEV_API_BASE_URL: ${{ needs.health-check.outputs.api }}
          DRTS_DEV_OPS_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.ops_console }}
          DRTS_DEV_REFERRAL_EMBED_BASE_URL: ${{ needs.health-check.outputs.referral_embed }}
          DRTS_DEV_ENTERPRISE_DISPATCH_BASE_URL: ${{ needs.health-check.outputs.enterprise_dispatch }}
          DRTS_DEV_FLEET_PARTNER_PORTAL_BASE_URL: ${{ needs.health-check.outputs.fleet_partner_portal }}
          DRTS_DEV_PLATFORM_ADMIN_BASE_URL: ${{ needs.health-check.outputs.platform_admin }}
          DRTS_DEV_TENANT_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.tenant_console }}
          DRTS_DEV_BANK_CONSOLE_BASE_URL: ${{ needs.health-check.outputs.bank_console }}
          DRTS_DEV_CHANNEL_PARTNER_PORTAL_BASE_URL: ${{ needs.health-check.outputs.channel_partner_portal }}
          DRTS_DEV_TENANT_CONSOLE_ID_TOKEN: ${{ steps.id_token_tenant_console.outputs.id_token }}
          DRTS_DEV_BANK_CONSOLE_ID_TOKEN: ${{ steps.id_token_bank_console.outputs.id_token }}
          DRTS_DEV_ENTERPRISE_DISPATCH_ID_TOKEN: ${{ steps.id_token_enterprise_dispatch.outputs.id_token }}
          DRTS_DEV_PLATFORM_ADMIN_ID_TOKEN: ${{ steps.id_token_platform_admin.outputs.id_token }}
          DRTS_DEV_OPS_CONSOLE_ID_TOKEN: ${{ steps.id_token_ops_console.outputs.id_token }}
          DRTS_DEV_FLEET_PARTNER_PORTAL_ID_TOKEN: ${{ steps.id_token_fleet_partner_portal.outputs.id_token }}
          DRTS_DEV_CHANNEL_PARTNER_PORTAL_ID_TOKEN: ${{ steps.id_token_channel_partner_portal.outputs.id_token }}
        run: |
          set -euo pipefail
          # Deleted Cloud Run services retain their service hostname; the control
          # plane returns 404, which is the retire/paused contract under test.
          api_url="${{ needs.health-check.outputs.api }}"
          cloud_run_suffix="${api_url#https://drts-dev-api-}"
          export DRTS_DEV_PARTNER_BOOKING_BASE_URL="https://drts-dev-partner-booking-web-${cloud_run_suffix}"
          export DRTS_DEV_CONCIERGE_BASE_URL="https://drts-dev-concierge-portal-web-${cloud_run_suffix}"
          export DRTS_DEV_PASSENGER_BASE_URL="https://drts-dev-passenger-web-${cloud_run_suffix}"
          operations/verification/run-operational-browser-acceptance.sh \
            --sha "${{ needs.build-push.outputs.candidate_sha }}"
      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-browser-evidence-${{ needs.build-push.outputs.candidate_sha }}
          path: test-results/
          if-no-files-found: warn

  # A red run used to mean two very different things that looked identical in the
  # run list: images never reached Artifact Registry and nothing was deployed, or
  # the deploy succeeded and a post-deploy check failed. Between 2026-08-09 and
  # 2026-08-22 both happened -- eight runs deployed fine and failed on UI smoke or
  # operational acceptance, four never built at all because GCP billing was off --
  # and telling them apart meant opening the run and reading job durations.
  outcome:
    name: Deploy outcome
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare
      - build-push
      - migrate
      - deploy
      - paused-partner-booking-cleanup
      - health-check
      - retired-service-cleanup
      - operational-candidate-acceptance
    steps:
      - name: Summarise what actually reached Cloud Run
        env:
          CANDIDATE_SHA: ${{ needs.build-push.outputs.candidate_sha }}
          API_URL: ${{ needs.health-check.outputs.api }}
          R_PREPARE: ${{ needs.prepare.result }}
          R_BUILD_PUSH: ${{ needs.build-push.result }}
          R_MIGRATE: ${{ needs.migrate.result }}
          R_DEPLOY: ${{ needs.deploy.result }}
          R_PAUSED_CLEANUP: ${{ needs.paused-partner-booking-cleanup.result }}
          R_HEALTH_CHECK: ${{ needs.health-check.result }}
          R_RETIRED_CLEANUP: ${{ needs.retired-service-cleanup.result }}
          R_ACCEPTANCE: ${{ needs.operational-candidate-acceptance.result }}
        run: |
          set -euo pipefail

          # Stage order matters: the first non-success is the one that stopped the
          # run, and everything after it is skipped rather than broken.
          stages=(
            "prepare|Prepare dev deploy|before deploy|${R_PREPARE}"
            "build-push|Build & push images|before deploy|${R_BUILD_PUSH}"
            "migrate|DB migration|before deploy|${R_MIGRATE}"
            "deploy|Deploy services|the deploy itself|${R_DEPLOY}"
            "paused-cleanup|Enforce Partner Booking paused state|after deploy|${R_PAUSED_CLEANUP}"
            "health-check|Dev health check|after deploy|${R_HEALTH_CHECK}"
            "retired-cleanup|Fail-closed retired service cleanup|after deploy|${R_RETIRED_CLEANUP}"
            "acceptance|Candidate SHA operational acceptance|after deploy|${R_ACCEPTANCE}"
          )

          failed_name=""
          failed_phase=""
          failed_result=""
          for stage in "${stages[@]}"; do
            IFS='|' read -r _ name phase result <<<"${stage}"
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              failed_name="${name}"
              failed_phase="${phase}"
              failed_result="${result}"
              break
            fi
          done

          # "Deployed" means exactly one thing: the Deploy services job succeeded,
          # so Cloud Run is now serving the candidate SHA. Nothing after it can
          # take that back, and nothing before it can stand in for it.
          if [[ "${R_DEPLOY}" == "success" ]]; then
            deployed="yes"
          else
            deployed="no"
          fi

          {
            echo "## Dev deploy outcome"
            echo
            echo "\`deployed=${deployed}\`"
            echo
            if [[ "${deployed}" == "yes" ]]; then
              echo "Cloud Run is serving \`${CANDIDATE_SHA:-<unknown>}\`."
              if [[ -n "${API_URL:-}" ]]; then
                echo "Confirm with \`curl ${API_URL}/api/health\` and compare \`candidateSha\`."
              fi
            else
              echo "**Nothing reached Cloud Run. The previously deployed version is still running**, unchanged."
            fi
            echo
            if [[ -n "${failed_name}" ]]; then
              echo "First stage to fail: **${failed_name}** (${failed_phase}, \`${failed_result}\`)."
              if [[ "${deployed}" == "yes" ]]; then
                echo
                echo "This run is red because a check after the deploy failed, not because the deploy failed."
                echo "Do not read it as \"the change is not live\" -- it is live and something about it did not pass."
              fi
            else
              echo "Every stage passed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          # Also an annotation, so `gh run view` and the run header carry the
          # verdict without anyone opening the summary tab.
          if [[ -n "${failed_name}" ]]; then
            echo "::notice title=Deploy outcome::deployed=${deployed}; first failure: ${failed_name} (${failed_phase})"
          else
            echo "::notice title=Deploy outcome::deployed=${deployed}; all stages passed"
          fi
