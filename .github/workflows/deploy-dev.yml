          cache-from: type=gha,scope=channel-partner-portal-web
          cache-to: type=gha,scope=channel-partner-portal-web,mode=min

  migrate:
    name: DB migration
    runs-on: ubuntu-latest
    needs: [prepare, build-push]
    if: ${{ inputs.skip_migration != 'true' }}
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Validate runtime identity split
        run: |
          set -euo pipefail

          deployer_sa="${DEV_WIF_SERVICE_ACCOUNT:-${WIF_SERVICE_ACCOUNT:-}}"
          if [[ "${{ needs.prepare.outputs.runtime_service_account }}" == "$deployer_sa" ]]; then
            echo "::error::Cloud Run runtime identity resolves to the GitHub deployer identity. Configure a separate runtime service account."
            exit 1
          fi

      - name: Create / update migration job definition
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/migrate:${{ needs.build-push.outputs.image_tag }}"
          DB_SECRET="${{ needs.prepare.outputs.secret_prefix }}-db-url"

          gcloud run jobs update "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "DATABASE_URL=${DB_SECRET}:latest" \
            --max-retries 0 \
            --project "${{ needs.prepare.outputs.project_id }}" \
          || gcloud run jobs create "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "DATABASE_URL=${DB_SECRET}:latest" \
            --max-retries 0 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Execute migration job and wait for completion
        run: |
          gcloud run jobs execute "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --wait \
            --project "${{ needs.prepare.outputs.project_id }}"

  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    needs: [prepare, build-push, migrate]
    if: ${{ always() && needs.build-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    environment: dev

    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Resolve configured artifact providers
        id: artifact_providers
        env:
          DEV_PROVIDER_CONFIG_JSON: ${{ toJSON(vars) }}
          PROVIDER_PROJECT_ID: ${{ needs.prepare.outputs.project_id }}
          PROVIDER_SECRET_PREFIX: ${{ needs.prepare.outputs.secret_prefix }}
        run: |
          python3 operations/deployment/resolve-dev-artifact-providers.py \
            --project "$PROVIDER_PROJECT_ID" \
            --secret-prefix "$PROVIDER_SECRET_PREFIX" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve API secret mounts
        id: api_secrets
        env:
          ARTIFACT_PROVIDER_SECRET_SUFFIX: ${{ steps.artifact_providers.outputs.secret_suffix }}
        run: |
          set -euo pipefail

          secret_prefix="${{ needs.prepare.outputs.secret_prefix }}"
          project_id="${{ needs.prepare.outputs.project_id }}"
          secret_args="DATABASE_URL=${secret_prefix}-db-url:latest,API_KEY_SALT=${secret_prefix}-api-key-salt:latest,JWT_SECRET=${secret_prefix}-jwt-secret:latest"
          web_secret_args="JWT_SECRET=${secret_prefix}-jwt-secret:latest"
          referral_embed_secret_args="$web_secret_args"
          ops_secret_args="$web_secret_args"
          map_provider_mode="mock"
          assistant_runtime="${DEV_PLATFORM_ADMIN_ASSISTANT_RUNTIME:-openclaw}"
          llm_provider="mock"
          llm_chat_model="mock-chat-v1"
          llm_summarizer_model="mock-summary-v1"
          llm_base_url=""
          openclaw_auth_provider=""
          openclaw_home=""

          # One source for both the API (which validates) and the control-plane
          # web apps (which mint the proxy token). Splitting these is what let
          # the minted and expected claims drift apart.
          jwt_issuer="${DEV_JWT_ISSUER:-https://auth.local.drts.internal}"
          jwt_audience="${DEV_JWT_AUDIENCE:-https://api.local.drts.internal}"

          controlled_download_secret="${secret_prefix}-controlled-download-signing-secret"
          workload_key_secret="${secret_prefix}-workload-identity-jwt-public-key"
          workload_registry_secret="${secret_prefix}-workload-identity-service-principals"
          workload_google_registry_secret="${secret_prefix}-workload-identity-google-service-principals"
          if ! gcloud secrets describe "$controlled_download_secret" --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Required secret ${controlled_download_secret} not found in project ${project_id}."
            exit 1
          fi
          secret_args="${secret_args},CONTROLLED_DOWNLOAD_SIGNING_SECRET=${controlled_download_secret}:latest"

          # Workload identity key material is mounted when it exists, and dev is
          # not blocked when it does not. The API agrees: its startup validation
          # requires the full set only for `production` and `staging`
          # (`isStrictEnvironment` in apps/api/src/config/auth-startup-config.ts),
          # and the verifier only reads these when a request actually presents a
          # workload assertion. Nothing in this repository mints one, and no
          # dev/staging GCP project has ever held these secrets.
          #
          # Demanding them here would only be satisfiable by inventing them, and
          # invented values are worse than absent ones: a public key whose
          # private half nobody holds, and a registry naming a service principal
          # that does not exist, read as configured security while authorising a
          # subject nobody can be. staging and prod keep their own checks.
          workload_mounts=""
          if gcloud secrets describe "$workload_key_secret" --project "$project_id" >/dev/null 2>&1; then
            workload_mounts="${workload_mounts},WORKLOAD_IDENTITY_JWT_SECRET_OR_PUBLIC_KEY=${workload_key_secret}:latest"
          else
            echo "::notice::${workload_key_secret} is absent; dev deploys without workload identity key material."
          fi
          if gcloud secrets describe "$workload_registry_secret" --project "$project_id" >/dev/null 2>&1; then
            workload_mounts="${workload_mounts},WORKLOAD_IDENTITY_SERVICE_PRINCIPALS=${workload_registry_secret}:latest"
          else
            echo "::notice::${workload_registry_secret} is absent; dev deploys without a service principal registry."
          fi
          # SEC-INTERNAL-KEY-WIF-MIGRATION-20260930: separate registry for
          # GoogleWorkloadIdentityAdapter (apps/api/src/modules/auth/google-workload-identity.adapter.ts),
          # which reads WORKLOAD_IDENTITY_GOOGLE_SERVICE_PRINCIPALS -- a
          # distinct env var from WORKLOAD_IDENTITY_SERVICE_PRINCIPALS above,
          # which only ServiceWorkloadIdentityAdapter reads. INTERNAL_KEY_EXCP_002
          # (the x-drts-internal-key fallback InternalKeyMiddleware used to fall
          # back to when this registry was absent) is retired: every
          # control-plane proxy, auth/token caller, and partner/ingress/handoff
          # bootstrap caller now depends solely on this registry. If the secret
          # below is absent, those callers fail closed (401
          # INTERNAL_KEY_UNDOCUMENTED), including this job's own operational
          # acceptance step further down.
          if gcloud secrets describe "$workload_google_registry_secret" --project "$project_id" >/dev/null 2>&1; then
            workload_mounts="${workload_mounts},WORKLOAD_IDENTITY_GOOGLE_SERVICE_PRINCIPALS=${workload_google_registry_secret}:latest"
          else
            echo "::error::${workload_google_registry_secret} is absent; INTERNAL_KEY_EXCP_002 is retired so dev's control-plane proxies and auth/token callers have no fallback and will fail closed without this registry."
            exit 1
          fi
          secret_args="${secret_args}${workload_mounts}"

          # Dev reuses the already-managed JWT secret for internal handoff.
          # Production environments can map these slots to distinct secrets.
          internal_key_secret="${secret_prefix}-jwt-secret"
          secret_args="${secret_args},DRTS_INTERNAL_KEY=${internal_key_secret}:latest"
          web_secret_args="${web_secret_args},DRTS_INTERNAL_KEY=${internal_key_secret}:latest"
          referral_embed_secret_args="${referral_embed_secret_args},DRTS_INTERNAL_KEY=${internal_key_secret}:latest"

          # SEC-INTERNAL-KEY-EXCP-001-WIF-MIGRATION-20261002: INTERNAL_KEY_EXCP_001
          # is retired. Nothing in the API or referral-embed-web source reads
          # DRTS_REFERRAL_EMBED_HANDOFF_KEY anymore (the three referral embed
          # handoff routes verify a Google workload identity assertion
          # instead -- see docs/02-architecture/internal-key-exceptions.md §9),
          # so this deploy no longer requires or mounts that retired secret.

          referral_partner_ingress_secret="${secret_prefix}-referral-embed-partner-ingress-key"
          if ! gcloud secrets describe "$referral_partner_ingress_secret" --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Required secret ${referral_partner_ingress_secret} not found in project ${project_id}."
            exit 1
          fi
          secret_args="${secret_args},PARTNER_INGRESS_KEY_YUHE_RESIDENCE=${referral_partner_ingress_secret}:latest"

          # Dev embeds use server-to-server handoff. Map the managed secret to
          # issuer-scoped credential slots without exposing it to the
          # browser or accepting API keys from query parameters.
          secret_args="${secret_args},PARTNER_INGRESS_KEY_ACME=${internal_key_secret}:latest"
          secret_args="${secret_args},PARTNER_INGRESS_KEY_CONTOSO=${internal_key_secret}:latest"
          secret_args="${secret_args},PARTNER_INGRESS_KEY_FABRIKAM=${internal_key_secret}:latest"
          secret_args="${secret_args},PARTNER_INGRESS_KEY_NORTHWIND=${internal_key_secret}:latest"

          geocoding_secret="${secret_prefix}-google-maps-geocoding-api-key"
          routes_secret="${secret_prefix}-google-maps-routes-api-key"
          browser_secret="${secret_prefix}-google-maps-browser-key"
          map_secret_count=0
          for map_secret in "$geocoding_secret" "$routes_secret" "$browser_secret"; do
            if gcloud secrets describe "$map_secret" --project "$project_id" >/dev/null 2>&1; then
              map_secret_count=$((map_secret_count + 1))
            fi
          done
          if [[ "$map_secret_count" -eq 3 ]]; then
            secret_args="${secret_args},GOOGLE_MAPS_GEOCODING_API_KEY=${geocoding_secret}:latest,GOOGLE_MAPS_ROUTES_API_KEY=${routes_secret}:latest"
            ops_secret_args="${ops_secret_args},GOOGLE_MAPS_BROWSER_KEY=${browser_secret}:latest"
            map_provider_mode="external"
          elif [[ "$map_secret_count" -ne 0 ]]; then
            echo "::error::Google Maps configuration is partial. Geocoding, Routes, and Browser secrets must be provisioned together."
            exit 1
          fi

          # Remote SMTP is opt-in and fail-closed. Mount secret references only;
          # never access or print SMTP credentials in the deployment runner.
          # Dev mail secrets deliberately use the drts-dev- namespace.
          smtp_mounts=""
          smtp_secret_count=0
          notification_outbox_type=""
          for smtp_setting in HOST PORT USERNAME PASSWORD FROM_EMAIL RECIPIENT_ALLOWLIST; do
            smtp_suffix="$(echo "$smtp_setting" | tr '[:upper:]_' '[:lower:]-')"
            smtp_secret="drts-dev-smtp-${smtp_suffix}"
            if gcloud secrets describe "$smtp_secret" --project "$project_id" >/dev/null 2>&1; then
              smtp_secret_count=$((smtp_secret_count + 1))
              smtp_mounts="${smtp_mounts},REMOTE_SMTP_${smtp_setting}=${smtp_secret}:latest"
            fi
          done
          if [[ "$smtp_secret_count" -eq 6 ]]; then
            secret_args="${secret_args}${smtp_mounts},NOTIFICATION_FROM_EMAIL=drts-dev-smtp-from-email:latest"
            # V0103 creates the durable outbox tables via the migration job.
            # Reuse the API's DATABASE_URL and shared pool, never Cloud Run disk.
            notification_outbox_type="postgres"
          elif [[ "$smtp_secret_count" -ne 0 ]]; then
            echo "::error::Remote SMTP configuration is partial. Host, port, username, password, sender and recipient allowlist secrets must all exist."
            exit 1
          fi
          echo "notification_outbox_type=${notification_outbox_type}" >> "$GITHUB_OUTPUT"

          # SR-LIVE-PUSH-001 web push is self-signed VAPID, not an external
          # provider (2026-09-15 decision). --set-secrets replaces the whole
          # set and gcloud run deploy fails on a missing secret name, so all
          # three must exist before any is mounted -- a partial mount would
          # either 500 the deploy or silently boot the API with an incomplete
          # VAPID config. Dev is not blocked when the credentials are absent;
          # Web Push just stays unavailable until an operator provisions them.
          vapid_public_secret="${secret_prefix}-passenger-webpush-vapid-public-key"
          vapid_private_secret="${secret_prefix}-passenger-webpush-vapid-private-key"
          vapid_subject_secret="${secret_prefix}-passenger-webpush-vapid-subject"
          vapid_secret_count=0
          for vapid_secret in "$vapid_public_secret" "$vapid_private_secret" "$vapid_subject_secret"; do
            if gcloud secrets describe "$vapid_secret" --project "$project_id" >/dev/null 2>&1; then
              vapid_secret_count=$((vapid_secret_count + 1))
            fi
          done
          if [[ "$vapid_secret_count" -eq 3 ]]; then
            secret_args="${secret_args},PASSENGER_WEBPUSH_VAPID_PUBLIC_KEY=${vapid_public_secret}:latest,PASSENGER_WEBPUSH_VAPID_PRIVATE_KEY=${vapid_private_secret}:latest,PASSENGER_WEBPUSH_VAPID_SUBJECT=${vapid_subject_secret}:latest"
          elif [[ "$vapid_secret_count" -eq 0 ]]; then
            echo "::notice::${vapid_public_secret}/${vapid_private_secret}/${vapid_subject_secret} are absent; dev deploys with Web Push unavailable (isAvailable() stays false)."
          else
            echo "::notice::VAPID configuration is partial (${vapid_secret_count}/3 secrets present); dev deploys with Web Push unavailable until all three of ${vapid_public_secret}, ${vapid_private_secret}, ${vapid_subject_secret} exist."
          fi

          llm_secret="${secret_prefix}-llm-gateway-api-key"
          if gcloud secrets describe "$llm_secret" --project "$project_id" >/dev/null 2>&1; then
            secret_args="${secret_args},LLM_GATEWAY_API_KEY=${llm_secret}:latest"
            if [[ "$assistant_runtime" == "openclaw" ]]; then
              llm_provider="openclaw"
              llm_chat_model="${DEV_OPENCLAW_AGENT_MODEL:-openai/gpt-5.5}"
              llm_summarizer_model="${DEV_OPENCLAW_SUMMARIZER_MODEL:-openai/gpt-5.4-mini}"
              openclaw_auth_provider="${DEV_OPENCLAW_AUTH_PROVIDER:-}"
              openclaw_home="${DEV_OPENCLAW_HOME:-/tmp/platform-admin-assistant-openclaw}"
            else
              llm_provider="${DEV_LLM_GATEWAY_PROVIDER:-openai}"
              llm_chat_model="${DEV_LLM_GATEWAY_CHAT_MODEL:-gpt-4.1-mini}"
              llm_summarizer_model="${DEV_LLM_GATEWAY_SUMMARIZER_MODEL:-gpt-4.1-mini}"
              llm_base_url="${DEV_LLM_GATEWAY_BASE_URL:-}"
            fi
          fi

          bank_signing_mounts="$(operations/deployment/resolve-bank-signing-secrets.sh "$secret_prefix" "$project_id")"
          bank_console_secret_args="$web_secret_args,BANK_SESSION_SECRET=${secret_prefix}-jwt-secret:latest"
          if [[ -n "$bank_signing_mounts" ]]; then
            bank_console_secret_args="${bank_console_secret_args},${bank_signing_mounts}"
          fi

          echo "jwt_issuer=${jwt_issuer}" >> "$GITHUB_OUTPUT"
          echo "jwt_audience=${jwt_audience}" >> "$GITHUB_OUTPUT"
          secret_args="${secret_args}${ARTIFACT_PROVIDER_SECRET_SUFFIX}"
          echo "api=${secret_args}" >> "$GITHUB_OUTPUT"
          echo "web=${web_secret_args}" >> "$GITHUB_OUTPUT"
          echo "referral_embed=${referral_embed_secret_args}" >> "$GITHUB_OUTPUT"
          echo "ops=${ops_secret_args}" >> "$GITHUB_OUTPUT"
          echo "bank_console=${bank_console_secret_args}" >> "$GITHUB_OUTPUT"
          echo "map_provider_mode=${map_provider_mode}" >> "$GITHUB_OUTPUT"
          echo "llm_provider=${llm_provider}" >> "$GITHUB_OUTPUT"
          echo "llm_chat_model=${llm_chat_model}" >> "$GITHUB_OUTPUT"
          echo "llm_summarizer_model=${llm_summarizer_model}" >> "$GITHUB_OUTPUT"
          echo "llm_base_url=${llm_base_url}" >> "$GITHUB_OUTPUT"
          echo "openclaw_auth_provider=${openclaw_auth_provider}" >> "$GITHUB_OUTPUT"
          echo "openclaw_home=${openclaw_home}" >> "$GITHUB_OUTPUT"

      - name: Verify live Google Maps provider
        if: ${{ steps.api_secrets.outputs.map_provider_mode == 'external' }}
        run: |
          set -euo pipefail

          project_id="${{ needs.prepare.outputs.project_id }}"
          secret_prefix="${{ needs.prepare.outputs.secret_prefix }}"
          export GOOGLE_MAPS_GEOCODING_API_KEY="$(gcloud secrets versions access latest --secret="${secret_prefix}-google-maps-geocoding-api-key" --project="$project_id")"
          export GOOGLE_MAPS_ROUTES_API_KEY="$(gcloud secrets versions access latest --secret="${secret_prefix}-google-maps-routes-api-key" --project="$project_id")"
          export GOOGLE_MAPS_BROWSER_KEY="$(gcloud secrets versions access latest --secret="${secret_prefix}-google-maps-browser-key" --project="$project_id")"
          export MAP_PROVIDER_SMOKE_ORIGIN="${DEV_MAP_PROVIDER_ALLOWED_ORIGINS}"
          echo "::add-mask::${GOOGLE_MAPS_GEOCODING_API_KEY}"
          echo "::add-mask::${GOOGLE_MAPS_ROUTES_API_KEY}"
          echo "::add-mask::${GOOGLE_MAPS_BROWSER_KEY}"
          node operations/verification/verify-google-map-provider-live.mjs

      - name: Build API env vars
        id: api_env
        env:
          ARTIFACT_PROVIDER_ENV_SUFFIX: ${{ steps.artifact_providers.outputs.env_suffix }}
        run: |
          set -euo pipefail

          # This step runs before any service is deployed, so on a freshly
          # provisioned project the Tenant Console does not exist yet. A missing
          # service must not be fatal here: it only means its URL cannot be known
          # on this pass. Treating it as fatal left the deploy unable to bootstrap
          # an empty project at all -- the origin it demanded could only be
          # created by the deploy it was blocking.
          tenant_console_cloud_run_origin="$(gcloud run services describe "${{ needs.prepare.outputs.tenant_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)' 2>/dev/null || true)"

          auth_allowed_origins=""
          for origin in "${{ needs.prepare.outputs.tenant_console_origin }}" "$tenant_console_cloud_run_origin"; do
            [[ -n "$origin" ]] || continue
            case "$origin" in
              https://*) ;;
              *)
                echo "::error::Tenant Console origin must be an HTTPS origin: $origin"
                exit 1
                ;;
            esac
            case ",${auth_allowed_origins}," in
              *",${origin},"*) continue ;;
            esac
            auth_allowed_origins="${auth_allowed_origins:+${auth_allowed_origins},}${origin}"
          done

          if [[ -z "$auth_allowed_origins" ]]; then
            echo "::warning::No Tenant Console origin available: ${{ needs.prepare.outputs.tenant_console_service }} does not exist in ${{ needs.prepare.outputs.project_id }} yet and DEV_TENANT_CONSOLE_ORIGIN is unset. Deploying the API with an empty browser origin allowlist -- dev treats that as local-origins-only, not as a wildcard. Re-run this deploy once the Tenant Console service exists to grant it access."
          fi

          # Use @ as the gcloud list delimiter because the allowlist itself is CSV.
          # Two long-lived LISTEN bridges occupy pool clients. Four query slots
          # keep startup and acceptance traffic moving; one API instance keeps
          # rollout demand below the 25-connection dev database limit.
          env_vars="^@^NODE_ENV=production@DRTS_ENV=development@DRTS_CANDIDATE_SHA=${{ needs.build-push.outputs.candidate_sha }}@AUTH_MODE=explicit@API_PORT=3001@DATABASE_POOL_MAX=6@JWT_ISSUER=${{ steps.api_secrets.outputs.jwt_issuer }}@JWT_AUDIENCE=${{ steps.api_secrets.outputs.jwt_audience }}@AUTH_ALLOWED_ORIGINS=${auth_allowed_origins}@DRTS_INTERNAL_KEY_ENFORCED=false@PLATFORM_ADMIN_ASSISTANT_ENABLED=true@WORKLOAD_IDENTITY_ISSUER=${DEV_WORKLOAD_IDENTITY_ISSUER}@WORKLOAD_IDENTITY_AUDIENCE=${DEV_WORKLOAD_IDENTITY_AUDIENCE}@WORKLOAD_IDENTITY_CI_TENANT_ACTOR_ENABLED=${DEV_WORKLOAD_IDENTITY_CI_TENANT_ACTOR_ENABLED:-false}@LLM_GATEWAY_PROVIDER=${{ steps.api_secrets.outputs.llm_provider }}@LLM_GATEWAY_CHAT_MODEL=${{ steps.api_secrets.outputs.llm_chat_model }}@LLM_GATEWAY_SUMMARIZER_MODEL=${{ steps.api_secrets.outputs.llm_summarizer_model }}@MAP_PROVIDER_MODE=${{ steps.api_secrets.outputs.map_provider_mode }}@MAP_PROVIDER_BACKEND=${{ steps.api_secrets.outputs.map_provider_mode == 'external' && 'google' || 'mock' }}@MAP_PROVIDER_NAME=${{ steps.api_secrets.outputs.map_provider_mode == 'external' && 'google' || 'mock' }}"
          # Dev API only: seed the fixed live-map-observer principal and its
          # read-only ops_observer membership. Never enable in staging/prod
          # or shared web env vars; Google proof is still required for issuance.
          env_vars="${env_vars}@DRTS_E2E_PROVISIONING=true"
          # Enable the durable SMTP outbox only with the complete secret set.
          if [[ "${{ steps.api_secrets.outputs.notification_outbox_type }}" == "postgres" ]]; then
            env_vars="${env_vars}@NOTIFICATION_OUTBOX_TYPE=postgres"
          fi
          # End SMTP outbox selection.
          # Mail links lead to the authenticated console, never signed artifacts.
          invoice_mail_portal_origin="${{ needs.prepare.outputs.tenant_console_origin }}"
          invoice_mail_portal_origin="${invoice_mail_portal_origin:-$tenant_console_cloud_run_origin}"
          if [[ -n "$invoice_mail_portal_origin" ]]; then
            env_vars="${env_vars}@INVOICE_MAIL_PORTAL_ORIGIN=${invoice_mail_portal_origin}"
          fi
          if [[ -n "${DEV_MAP_PROVIDER_ALLOWED_ORIGINS:-}" ]]; then
            env_vars="${env_vars}@MAP_PROVIDER_ALLOWED_ORIGINS=${DEV_MAP_PROVIDER_ALLOWED_ORIGINS}"
          fi
          if [[ -n "${{ steps.api_secrets.outputs.llm_base_url }}" ]]; then
            env_vars="${env_vars}@LLM_GATEWAY_BASE_URL=${{ steps.api_secrets.outputs.llm_base_url }}"
          fi
          if [[ "${{ steps.api_secrets.outputs.llm_provider }}" == "openclaw" ]]; then
            env_vars="${env_vars}@OPENCLAW_AGENT_MODEL=${{ steps.api_secrets.outputs.llm_chat_model }}"
            if [[ -n "${{ steps.api_secrets.outputs.openclaw_auth_provider }}" ]]; then
              env_vars="${env_vars}@OPENCLAW_AUTH_PROVIDER=${{ steps.api_secrets.outputs.openclaw_auth_provider }}"
            fi
            if [[ -n "${{ steps.api_secrets.outputs.openclaw_home }}" ]]; then
              env_vars="${env_vars}@OPENCLAW_HOME=${{ steps.api_secrets.outputs.openclaw_home }}"
            fi
          fi

          env_vars="${env_vars}${ARTIFACT_PROVIDER_ENV_SUFFIX}"
          echo "vars=${env_vars}" >> "$GITHUB_OUTPUT"

      - name: Deploy — api
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/api:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3001 \
            --ingress all \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.api }}" \
            --set-env-vars "${{ steps.api_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.api_exposure_flag }} \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Resolve API URL
        id: api_url
        run: |
          URL="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Build shared web env vars
        id: web_env
        run: |
          set -euo pipefail

          api_origin="${{ needs.prepare.outputs.api_origin }}"
          if [[ -z "$api_origin" ]]; then
            api_origin="${{ steps.api_url.outputs.url }}"
          fi

          ops_console_origin="${{ needs.prepare.outputs.ops_console_origin }}"
          if [[ -z "$ops_console_origin" ]]; then
            # Same bootstrap case as the Tenant Console above: this runs before
            # `Deploy — ops-console-web`, so on a fresh project the service is
            # not there to describe yet.
            ops_console_origin="$(gcloud run services describe "${{ needs.prepare.outputs.ops_console_service }}" \
              --region "${{ needs.prepare.outputs.region }}" \
              --project "${{ needs.prepare.outputs.project_id }}" \
              --format='value(status.url)' 2>/dev/null || true)"
          fi
          if [[ -z "$ops_console_origin" ]]; then
            echo "::warning::No Ops Console origin available yet; the web apps ship with NEXT_PUBLIC_OPS_CONSOLE_ORIGIN empty, which disables their cross-app links until a later deploy fills it in."
          fi

          # The Tenant Console links back into Platform Admin, so it needs that
          # origin the same way it needs the Ops Console one. It was never
          # passed, so those links could only ever fall back to localhost.
          platform_admin_origin="${{ needs.prepare.outputs.platform_admin_origin }}"
          if [[ -z "$platform_admin_origin" ]]; then
            platform_admin_origin="$(gcloud run services describe "${{ needs.prepare.outputs.platform_admin_service }}" \
              --region "${{ needs.prepare.outputs.region }}" \
              --project "${{ needs.prepare.outputs.project_id }}" \
              --format='value(status.url)' 2>/dev/null || true)"
          fi
          if [[ -z "$platform_admin_origin" ]]; then
            echo "::warning::No Platform Admin origin available yet; the web apps ship with NEXT_PUBLIC_PLATFORM_ADMIN_ORIGIN empty, which disables their cross-app links until a later deploy fills it in."
          fi

          env_vars="NODE_ENV=production,DRTS_ENV=development,DRTS_CANDIDATE_SHA=${{ needs.build-push.outputs.candidate_sha }},NEXT_PUBLIC_DRTS_CANDIDATE_SHA=${{ needs.build-push.outputs.candidate_sha }},JWT_ISSUER=${{ steps.api_secrets.outputs.jwt_issuer }},JWT_AUDIENCE=${{ steps.api_secrets.outputs.jwt_audience }},DRTS_API_URL=${api_origin},NEXT_PUBLIC_API_URL=/control-plane-proxy,NEXT_PUBLIC_OPS_CONSOLE_ORIGIN=${ops_console_origin},NEXT_PUBLIC_PLATFORM_ADMIN_ORIGIN=${platform_admin_origin},DRTS_FLEET_PARTNER_ID=fleet-demo-001,DRTS_ENTERPRISE_DISPATCH_TENANT_ID=10000000-0000-0000-0000-000000000201,MAP_PROVIDER_MODE=${{ steps.api_secrets.outputs.map_provider_mode }},MAP_PROVIDER_NAME=${{ steps.api_secrets.outputs.map_provider_mode == 'external' && 'google' || 'mock' }}"
          if [[ -n "${DEV_MAP_PROVIDER_ALLOWED_ORIGINS:-}" ]]; then
            env_vars="${env_vars},MAP_PROVIDER_ALLOWED_ORIGINS=${DEV_MAP_PROVIDER_ALLOWED_ORIGINS}"
          fi

          if [[ -n "${DEV_IAP_CLIENT_ID:-}" ]]; then
            env_vars="${env_vars},DRTS_API_AUTH_AUDIENCE=${DEV_IAP_CLIENT_ID}"
          fi

          echo "vars=${env_vars}" >> "$GITHUB_OUTPUT"

      - name: Deploy — platform-admin-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/platform-admin-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3002 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.web }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},NEXT_PUBLIC_PLATFORM_ADMIN_ASSISTANT_ENABLED=true" \
            ${{ needs.prepare.outputs.platform_admin_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      # `gcloud run deploy --no-allow-unauthenticated` controls whether this
      # deploy *grants* the allUsers run.invoker binding; it does not
      # reliably retract a binding a prior deploy (or a manual grant) already
      # added. Make the retraction explicit so a future accidental or
      # temporary flip of this service's *_ALLOW_UNAUTHENTICATED variable
      # back to true cannot leave it silently public after the flag is
      # turned false again. `gcloud run services remove-iam-policy-binding`
      # is NOT idempotent: it exits non-zero (IamPolicyBindingNotFound) when
      # the binding is already absent, so enforce-no-public-access.sh checks
      # the policy first and only removes a binding that is actually present.
      - name: Enforce no public access — platform-admin-web
        if: ${{ needs.prepare.outputs.platform_admin_exposure_flag == '--no-allow-unauthenticated' }}
        run: |
          ./operations/deployment/enforce-no-public-access.sh \
            "${{ needs.prepare.outputs.platform_admin_service }}" \
            "${{ needs.prepare.outputs.region }}" \
            "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — ops-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/ops-console-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3003 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.ops }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.ops_console_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Enforce no public access — ops-console-web
        if: ${{ needs.prepare.outputs.ops_console_exposure_flag == '--no-allow-unauthenticated' }}
        run: |
          ./operations/deployment/enforce-no-public-access.sh \
            "${{ needs.prepare.outputs.ops_console_service }}" \
            "${{ needs.prepare.outputs.region }}" \
            "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — fleet-partner-portal-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3007 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.fleet_partner_portal_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Enforce no public access — fleet-partner-portal-web
        if: ${{ needs.prepare.outputs.fleet_partner_portal_exposure_flag == '--no-allow-unauthenticated' }}
        run: |
          ./operations/deployment/enforce-no-public-access.sh \
            "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            "${{ needs.prepare.outputs.region }}" \
            "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — tenant-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/tenant-console-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.tenant_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3004 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.tenant_console_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — bank-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/bank-console-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.bank_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3008 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.bank_console }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},BANK_CONSOLE_DEMO_LOGIN=true" \
            ${{ needs.prepare.outputs.bank_console_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — referral-embed-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/referral-embed-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.referral_embed_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3014 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.referral_embed }}" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},REFERRAL_EMBED_ALLOWED_HOSTS=app.fabrikam-living.example app-stg.fabrikam-living.example,REFERRAL_EMBED_DEMO=true,REFERRAL_EMBED_DEFAULT_ENTRY_SLUG=${{ needs.prepare.outputs.referral_embed_entry_slug }}" \
            --allow-unauthenticated \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — enterprise-dispatch-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/enterprise-dispatch-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.enterprise_dispatch_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3010 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.enterprise_dispatch_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — channel-partner-portal-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/channel-partner-portal-web:${{ needs.build-push.outputs.image_tag }}"

          operations/deployment/deploy-cloud-run-service.sh "${{ needs.prepare.outputs.channel_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3013 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},DRTS_PARTNER_ID=partner_ead6bf3d-e858-47cc-bfe1-5a3742524118,DRTS_TENANT_ID=tenant-demo-001,DRTS_PARTNER_PROGRAM_ID=program-referral-community,DRTS_PARTNER_ENTRY_SLUG=yuhe-residence" \
            ${{ needs.prepare.outputs.channel_partner_portal_exposure_flag }} \
            --cpu 1 \
            --concurrency 80 \
            --execution-environment gen1 \
            --no-cpu-boost \
            --min-instances 0 \
            --max-instances 1 \
