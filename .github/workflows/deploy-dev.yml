name: Deploy — Dev

# v4: auto-fires on push to publish/v* (nightly snapshot). dev env now reflects
# the latest nightly publish — NOT bleeding-edge dev branch — so testers have
# a stable target for ~24h. Per docs/ops/branch-strategy.md (v4 §5).
# Manual dispatch is for explicit redeploys only; it must never fall back to
# the UI-selected dispatcher branch (especially main).

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Required for manual dispatch: publish/v<date>, release/v<date>, or full commit SHA. Never mutable branches like dev/main/design."
        required: true
        type: string
      skip_migration:
        description: "Skip DB migration step (use only if migrations already applied)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      target_profile:
        description: "Dev Cloud Run target profile. waji is the public dev URL set used for live acceptance."
        required: false
        default: "waji"
        type: choice
        options:
          - "waji"
          - "current"
  push:
    branches:
      - "publish/v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
  DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
  DEV_GCP_CLOUDSQL_INSTANCE: ${{ vars.DEV_GCP_CLOUDSQL_INSTANCE }}
  DEV_GCP_RUNTIME_SERVICE_ACCOUNT_VAR: ${{ vars.DEV_GCP_RUNTIME_SERVICE_ACCOUNT }}
  DEV_GCP_RUNTIME_SERVICE_ACCOUNT_SECRET: ${{ secrets.DEV_GCP_RUNTIME_SERVICE_ACCOUNT }}
  DEV_WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER }}
  DEV_WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
  DEV_ARTIFACT_PROJECT_ID: ${{ vars.DEV_ARTIFACT_PROJECT_ID }}
  DEV_ARTIFACT_REGION: ${{ vars.DEV_ARTIFACT_REGION }}
  DEV_ARTIFACT_REPOSITORY: ${{ vars.DEV_ARTIFACT_REPOSITORY }}
  DEV_SECRET_PREFIX: ${{ vars.DEV_SECRET_PREFIX }}
  DEV_GCP_API_SERVICE: ${{ vars.DEV_GCP_API_SERVICE }}
  DEV_GCP_PLATFORM_ADMIN_SERVICE: ${{ vars.DEV_GCP_PLATFORM_ADMIN_SERVICE }}
  DEV_GCP_OPS_CONSOLE_SERVICE: ${{ vars.DEV_GCP_OPS_CONSOLE_SERVICE }}
  DEV_GCP_FLEET_PARTNER_PORTAL_SERVICE: ${{ vars.DEV_GCP_FLEET_PARTNER_PORTAL_SERVICE }}
  DEV_GCP_MIGRATION_JOB: ${{ vars.DEV_GCP_MIGRATION_JOB }}
  DEV_API_ALLOW_UNAUTHENTICATED: ${{ vars.DEV_API_ALLOW_UNAUTHENTICATED }}
  DEV_PLATFORM_ADMIN_ALLOW_UNAUTHENTICATED: ${{ vars.DEV_PLATFORM_ADMIN_ALLOW_UNAUTHENTICATED }}
  DEV_OPS_CONSOLE_ALLOW_UNAUTHENTICATED: ${{ vars.DEV_OPS_CONSOLE_ALLOW_UNAUTHENTICATED }}
  DEV_FLEET_PARTNER_PORTAL_ALLOW_UNAUTHENTICATED: ${{ vars.DEV_FLEET_PARTNER_PORTAL_ALLOW_UNAUTHENTICATED }}
  DEV_CONTROL_PLANE_API_ORIGIN: ${{ vars.DEV_CONTROL_PLANE_API_ORIGIN }}
  DEV_IAP_CLIENT_ID: ${{ vars.DEV_IAP_CLIENT_ID }}
  DEV_PLATFORM_ADMIN_ORIGIN: ${{ vars.DEV_PLATFORM_ADMIN_ORIGIN }}
  DEV_OPS_CONSOLE_ORIGIN: ${{ vars.DEV_OPS_CONSOLE_ORIGIN }}
  DEV_FLEET_PARTNER_PORTAL_ORIGIN: ${{ vars.DEV_FLEET_PARTNER_PORTAL_ORIGIN }}
  DEV_PLATFORM_ADMIN_ASSISTANT_RUNTIME: ${{ vars.DEV_PLATFORM_ADMIN_ASSISTANT_RUNTIME }}
  DEV_OPENCLAW_AGENT_MODEL: ${{ vars.DEV_OPENCLAW_AGENT_MODEL }}
  DEV_OPENCLAW_SUMMARIZER_MODEL: ${{ vars.DEV_OPENCLAW_SUMMARIZER_MODEL }}
  DEV_OPENCLAW_AUTH_PROVIDER: ${{ vars.DEV_OPENCLAW_AUTH_PROVIDER }}
  DEV_OPENCLAW_HOME: ${{ vars.DEV_OPENCLAW_HOME }}
  LEGACY_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  LEGACY_GCP_REGION: ${{ vars.GCP_REGION }}
  LEGACY_GCP_CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE }}
  LEGACY_GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

jobs:
  prepare:
    name: Prepare dev deploy
    # Triggered by workflow_dispatch OR push to publish/v*. Both are intentional;
    # no upstream CI conclusion to check (publish snapshots are pre-validated by
    # nightly-publish.yml requiring ci-integ green on dev before cutting).
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      project_id: ${{ steps.resolve.outputs.project_id }}
      region: ${{ steps.resolve.outputs.region }}
      cloudsql: ${{ steps.resolve.outputs.cloudsql }}
      runtime_service_account: ${{ steps.resolve.outputs.runtime_service_account }}
      target_profile: ${{ steps.resolve.outputs.target_profile }}
      registry: ${{ steps.resolve.outputs.registry }}
      secret_prefix: ${{ steps.resolve.outputs.secret_prefix }}
      api_service: ${{ steps.resolve.outputs.api_service }}
      platform_admin_service: ${{ steps.resolve.outputs.platform_admin_service }}
      ops_console_service: ${{ steps.resolve.outputs.ops_console_service }}
      fleet_partner_portal_service: ${{ steps.resolve.outputs.fleet_partner_portal_service }}
      migration_job: ${{ steps.resolve.outputs.migration_job }}
      api_exposure_flag: ${{ steps.resolve.outputs.api_exposure_flag }}
      platform_admin_exposure_flag: ${{ steps.resolve.outputs.platform_admin_exposure_flag }}
      ops_console_exposure_flag: ${{ steps.resolve.outputs.ops_console_exposure_flag }}
      fleet_partner_portal_exposure_flag: ${{ steps.resolve.outputs.fleet_partner_portal_exposure_flag }}
      api_origin: ${{ steps.resolve.outputs.api_origin }}
      platform_admin_origin: ${{ steps.resolve.outputs.platform_admin_origin }}
      ops_console_origin: ${{ steps.resolve.outputs.ops_console_origin }}
      fleet_partner_portal_origin: ${{ steps.resolve.outputs.fleet_partner_portal_origin }}
      waji_wif_provider: ${{ steps.resolve.outputs.waji_wif_provider }}

    steps:
      - name: Resolve dev config
        id: resolve
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_SKIP_MIGRATION: ${{ inputs.skip_migration }}
          INPUT_TARGET_PROFILE: ${{ inputs.target_profile }}
          # On push to publish/v*, GITHUB_SHA is already the publish branch HEAD.
          # On workflow_dispatch, INPUT_SOURCE_REF is mandatory. Do not fall
          # back to the UI-selected workflow branch; that lets main/feature
          # branches overwrite the shared dev environment.
        run: |
          set -euo pipefail

          pick() {
            local first="${1:-}"
            local second="${2:-}"
            local fallback="${3:-}"

            if [[ -n "$first" ]]; then
              printf '%s' "$first"
            elif [[ -n "$second" ]]; then
              printf '%s' "$second"
            else
              printf '%s' "$fallback"
            fi
          }

          normalize_bool() {
            local raw="${1:-}"
            local default_value="${2:-true}"
            local normalized="${raw:-$default_value}"

            normalized="$(echo "$normalized" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              true|1|yes|y) echo true ;;
              false|0|no|n) echo false ;;
              *)
                echo "::error::Invalid boolean value: ${raw}. Use true/false."
                exit 1
                ;;
            esac
          }

          exposure_flag() {
            if [[ "$(normalize_bool "${1:-}" "${2:-true}")" == "true" ]]; then
              echo "--allow-unauthenticated"
            else
              echo "--no-allow-unauthenticated"
            fi
          }

          emit() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          validate_wif_provider() {
            local candidate="${1:-}"
            local audience=""

            candidate="${candidate#//iam.googleapis.com/}"
            local encoded=""
            local oidc_json=""
            local oidc_token=""
            local sts_response=""
            local access_token=""

            [[ -n "$candidate" ]] || return 1
            audience="//iam.googleapis.com/${candidate}"

            encoded="$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$audience")"

            oidc_json="$(curl -sS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}" 2>/dev/null || true)"
            oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value // empty' 2>/dev/null || true)"
            [[ -n "$oidc_token" ]] || return 1

            sts_response="$(curl -sS -X POST \
              -H 'Content-Type: application/json' \
              https://sts.googleapis.com/v1/token \
              -d "$(jq -cn \
                --arg audience "$audience" \
                --arg subject_token "$oidc_token" \
                '{audience: $audience, grantType: "urn:ietf:params:oauth:grant-type:token-exchange", requestedTokenType: "urn:ietf:params:oauth:token-type:access_token", scope: "https://www.googleapis.com/auth/cloud-platform", subjectTokenType: "urn:ietf:params:oauth:token-type:jwt", subjectToken: $subject_token}')" 2>/dev/null || true)"
            access_token="$(printf '%s' "$sts_response" | jq -r '.access_token // empty' 2>/dev/null || true)"
            [[ -n "$access_token" ]]
          }

          resolve_waji_wif_provider() {
            local current="${1:-}"
            local candidate=""
            local project_number=""
            local pool_name=""
            local provider_name=""
            local -a candidates=()

            [[ -n "$current" ]] && candidates+=("$current")

            for project_number in 75915426578 566531001929 1071409254673 384772941419; do
              for pool_name in github github-actions github-pool github-actions-pool gha-pool; do
                for provider_name in github github-actions github-provider github-actions-provider gha-provider; do
                  candidates+=("projects/${project_number}/locations/global/workloadIdentityPools/${pool_name}/providers/${provider_name}")
                done
              done
            done

            for candidate in "${candidates[@]}"; do
              if validate_wif_provider "$candidate"; then
                printf '%s' "${candidate#//iam.googleapis.com/}"
                return 0
              fi
            done

            return 1
          }

          project_id="${DEV_GCP_PROJECT_ID:-}"
          region="${DEV_GCP_REGION:-}"
          cloudsql="${DEV_GCP_CLOUDSQL_INSTANCE:-}"
          runtime_sa="$(pick "${DEV_GCP_RUNTIME_SERVICE_ACCOUNT_VAR:-}" "${DEV_GCP_RUNTIME_SERVICE_ACCOUNT_SECRET:-}" "")"
          deployer_sa="$(pick "${DEV_WIF_SERVICE_ACCOUNT:-}" "${WIF_SERVICE_ACCOUNT:-}" "")"
          wif_provider="$(pick "${DEV_WIF_PROVIDER:-}" "${WIF_PROVIDER:-}" "")"
          artifact_project_id="$(pick "${DEV_ARTIFACT_PROJECT_ID:-}" "" "$project_id")"
          artifact_region="$(pick "${DEV_ARTIFACT_REGION:-}" "" "$region")"
          artifact_repository="$(pick "${DEV_ARTIFACT_REPOSITORY:-}" "" "drts")"
          secret_prefix="$(pick "${DEV_SECRET_PREFIX:-}" "" "drts-dev")"
          api_service="$(pick "${DEV_GCP_API_SERVICE:-}" "" "drts-api")"
          platform_admin_service="$(pick "${DEV_GCP_PLATFORM_ADMIN_SERVICE:-}" "" "drts-platform-admin-web")"
          ops_console_service="$(pick "${DEV_GCP_OPS_CONSOLE_SERVICE:-}" "" "drts-ops-console-web")"
          fleet_partner_portal_service="$(pick "${DEV_GCP_FLEET_PARTNER_PORTAL_SERVICE:-}" "" "drts-fleet-partner-portal-web")"
          migration_job="$(pick "${DEV_GCP_MIGRATION_JOB:-}" "" "drts-migrate")"
          api_exposure_flag="$(exposure_flag "${DEV_API_ALLOW_UNAUTHENTICATED:-}" true)"
          platform_admin_exposure_flag="$(exposure_flag "${DEV_PLATFORM_ADMIN_ALLOW_UNAUTHENTICATED:-}" true)"
          ops_console_exposure_flag="$(exposure_flag "${DEV_OPS_CONSOLE_ALLOW_UNAUTHENTICATED:-}" true)"
          fleet_partner_portal_exposure_flag="$(exposure_flag "${DEV_FLEET_PARTNER_PORTAL_ALLOW_UNAUTHENTICATED:-}" true)"
          api_origin="${DEV_CONTROL_PLANE_API_ORIGIN:-}"
          platform_admin_origin="${DEV_PLATFORM_ADMIN_ORIGIN:-}"
          ops_console_origin="${DEV_OPS_CONSOLE_ORIGIN:-}"
          fleet_partner_portal_origin="${DEV_FLEET_PARTNER_PORTAL_ORIGIN:-}"

          target_profile="${INPUT_TARGET_PROFILE:-waji}"
          case "$target_profile" in
            waji|current) ;;
            *)
              echo "::error::Invalid target_profile ${target_profile}. Use waji or current."
              exit 1
              ;;
          esac

          if [[ "$target_profile" == "waji" ]]; then
            project_id="${LEGACY_GCP_PROJECT_ID:-}"
            region="${LEGACY_GCP_REGION:-}"
            cloudsql="${LEGACY_GCP_CLOUDSQL_INSTANCE:-}"
            runtime_sa="${LEGACY_GCP_RUNTIME_SERVICE_ACCOUNT:-}"
            deployer_sa="${WIF_SERVICE_ACCOUNT:-}"
            wif_provider="${WIF_PROVIDER:-}"
            artifact_project_id="${LEGACY_GCP_PROJECT_ID:-}"
            artifact_region="${LEGACY_GCP_REGION:-}"
            artifact_repository="drts"
            secret_prefix="drts-dev"
            api_service="drts-dev-api"
            platform_admin_service="drts-dev-platform-admin-web"
            ops_console_service="drts-dev-ops-console-web"
            fleet_partner_portal_service="drts-dev-fleet-partner-portal-web"
            migration_job="drts-dev-migrate"
            api_exposure_flag="--allow-unauthenticated"
            platform_admin_exposure_flag="--allow-unauthenticated"
            ops_console_exposure_flag="--allow-unauthenticated"
            fleet_partner_portal_exposure_flag="--allow-unauthenticated"
            api_origin=""
            platform_admin_origin=""
            ops_console_origin=""
            fleet_partner_portal_origin=""
          fi

          waji_wif_provider=""
          if [[ "$target_profile" == "waji" ]]; then
            waji_wif_provider="$(resolve_waji_wif_provider "$wif_provider" || true)"
            if [[ -n "$waji_wif_provider" ]]; then
              echo "::notice::Resolved a usable waji Workload Identity provider via OIDC preflight."
            else
              echo "::warning::Could not preflight a usable waji Workload Identity provider; falling back to secrets.WIF_PROVIDER."
            fi
          fi

          registry="${artifact_region}-docker.pkg.dev/${artifact_project_id}/${artifact_repository}"

          echo "::notice::Dev deploy target_profile=${target_profile}"

          if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            dispatch_ref="${GITHUB_REF_NAME:-}"
            if [[ "$dispatch_ref" == "main" || "$dispatch_ref" == "refs/heads/main" ]]; then
              echo "::error::Do not dispatch deploy-dev from main. Per branch-strategy v4, run nightly-publish.yml or dispatch deploy-dev on a publish/v* snapshot ref."
              exit 1
            fi
          fi

          source_ref="${INPUT_SOURCE_REF:-}"
          if [[ -z "$source_ref" ]]; then
            if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
              echo "::error::source_ref is required for manual dev deploy. Per branch-strategy v4, dev deploys must use a publish/v* snapshot, release/v* snapshot, or full commit SHA, never the dispatcher branch SHA."
              exit 1
            fi
            source_ref="${GITHUB_SHA}"
          fi

          if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]]; then
            case "$source_ref" in
              publish/v*|refs/heads/publish/v*|release/v*|refs/tags/release/v*) ;;
              *)
                if [[ "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  :
                else
                  echo "::error::${source_ref} is not a valid dev deploy source_ref. Per branch-strategy v4, manual dev deploys must use publish/v*, release/v*, or a full commit SHA; mutable branches such as dev/main/design are blocked."
                  exit 1
                fi
                ;;
            esac
            echo "::notice::Dev deploy source_ref resolved to ${source_ref}."
          fi

          missing=()
          [[ -n "$project_id" ]] || missing+=("vars.DEV_GCP_PROJECT_ID")
          [[ -n "$region" ]] || missing+=("vars.DEV_GCP_REGION")
          [[ -n "$cloudsql" ]] || missing+=("vars.DEV_GCP_CLOUDSQL_INSTANCE")
          [[ -n "$runtime_sa" ]] || missing+=("vars.DEV_GCP_RUNTIME_SERVICE_ACCOUNT or secrets.DEV_GCP_RUNTIME_SERVICE_ACCOUNT")
          [[ -n "$deployer_sa" ]] || missing+=("secrets.DEV_WIF_SERVICE_ACCOUNT or secrets.WIF_SERVICE_ACCOUNT")
          [[ -n "$wif_provider" ]] || missing+=("secrets.DEV_WIF_PROVIDER or secrets.WIF_PROVIDER")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions dev configuration: ${missing[*]}."
            exit 1
          fi

          emit source_ref "$source_ref"
          emit project_id "$project_id"
          emit region "$region"
          emit cloudsql "$cloudsql"
          emit runtime_service_account "$runtime_sa"
          emit target_profile "$target_profile"
          emit registry "$registry"
          emit secret_prefix "$secret_prefix"
          emit api_service "$api_service"
          emit platform_admin_service "$platform_admin_service"
          emit ops_console_service "$ops_console_service"
          emit fleet_partner_portal_service "$fleet_partner_portal_service"
          emit migration_job "$migration_job"
          emit api_exposure_flag "$api_exposure_flag"
          emit platform_admin_exposure_flag "$platform_admin_exposure_flag"
          emit ops_console_exposure_flag "$ops_console_exposure_flag"
          emit fleet_partner_portal_exposure_flag "$fleet_partner_portal_exposure_flag"
          emit api_origin "$api_origin"
          emit platform_admin_origin "$platform_admin_origin"
          emit ops_console_origin "$ops_console_origin"
          emit fleet_partner_portal_origin "$fleet_partner_portal_origin"
          emit waji_wif_provider "$waji_wif_provider"

  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Derive image tag
        id: tag
        run: |
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.prepare.outputs.target_profile == 'waji' && needs.prepare.outputs.waji_wif_provider || needs.prepare.outputs.target_profile == 'waji' && env.WIF_PROVIDER || env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ needs.prepare.outputs.target_profile == 'waji' && env.WIF_SERVICE_ACCOUNT || env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Configure Docker for Artifact Registry
        run: |
          host="$(echo "${{ needs.prepare.outputs.registry }}" | cut -d/ -f1)"
          gcloud auth configure-docker "$host" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/api:${{ steps.tag.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/api:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/api:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/api:cache,mode=max

      - name: Build & push — migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/migrate:${{ steps.tag.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/migrate:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/migrate:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/migrate:cache,mode=max

      - name: Build & push — platform-admin-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/platform-admin-web/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/platform-admin-web:${{ steps.tag.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/platform-admin-web:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/platform-admin-web:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/platform-admin-web:cache,mode=max

      - name: Build & push — ops-console-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/ops-console-web/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/ops-console-web:${{ steps.tag.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/ops-console-web:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/ops-console-web:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/ops-console-web:cache,mode=max

      - name: Build & push — fleet-partner-portal-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/fleet-partner-portal-web/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:${{ steps.tag.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:latest
          cache-from: type=registry,ref=${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:cache,mode=max

  migrate:
    name: DB migration
    runs-on: ubuntu-latest
    needs: [prepare, build-push]
    if: ${{ inputs.skip_migration != 'true' }}
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.prepare.outputs.target_profile == 'waji' && needs.prepare.outputs.waji_wif_provider || needs.prepare.outputs.target_profile == 'waji' && env.WIF_PROVIDER || env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ needs.prepare.outputs.target_profile == 'waji' && env.WIF_SERVICE_ACCOUNT || env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Validate runtime identity split
        run: |
          set -euo pipefail

          if [[ "${{ needs.prepare.outputs.target_profile }}" == "waji" ]]; then
            deployer_sa="${WIF_SERVICE_ACCOUNT:-}"
          else
            deployer_sa="${DEV_WIF_SERVICE_ACCOUNT:-${WIF_SERVICE_ACCOUNT:-}}"
          fi
          if [[ "${{ needs.prepare.outputs.runtime_service_account }}" == "$deployer_sa" ]]; then
            echo "::error::Cloud Run runtime identity resolves to the GitHub deployer identity. Configure a separate runtime service account."
            exit 1
          fi

      - name: Create / update migration job definition
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/migrate:${{ needs.build-push.outputs.image_tag }}"
          DB_SECRET="${{ needs.prepare.outputs.secret_prefix }}-db-url"

          gcloud run jobs update "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "DATABASE_URL=${DB_SECRET}:latest" \
            --max-retries 0 \
            --project "${{ needs.prepare.outputs.project_id }}" \
          || gcloud run jobs create "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "DATABASE_URL=${DB_SECRET}:latest" \
            --max-retries 0 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Execute migration job and wait for completion
        run: |
          gcloud run jobs execute "${{ needs.prepare.outputs.migration_job }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --wait \
            --project "${{ needs.prepare.outputs.project_id }}"

  deploy:
    name: Deploy services
    runs-on: ubuntu-latest
    needs: [prepare, build-push, migrate]
    if: ${{ always() && needs.build-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.prepare.outputs.target_profile == 'waji' && needs.prepare.outputs.waji_wif_provider || needs.prepare.outputs.target_profile == 'waji' && env.WIF_PROVIDER || env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ needs.prepare.outputs.target_profile == 'waji' && env.WIF_SERVICE_ACCOUNT || env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Resolve API secret mounts
        id: api_secrets
        run: |
          set -euo pipefail

          secret_prefix="${{ needs.prepare.outputs.secret_prefix }}"
          project_id="${{ needs.prepare.outputs.project_id }}"
          secret_args="DATABASE_URL=${secret_prefix}-db-url:latest,API_KEY_SALT=${secret_prefix}-api-key-salt:latest,JWT_SECRET=${secret_prefix}-jwt-secret:latest"
          assistant_runtime="${DEV_PLATFORM_ADMIN_ASSISTANT_RUNTIME:-openclaw}"
          llm_provider="mock"
          llm_chat_model="mock-chat-v1"
          llm_summarizer_model="mock-summary-v1"
          llm_base_url=""
          openclaw_auth_provider=""
          openclaw_home=""

          controlled_download_secret="${secret_prefix}-controlled-download-signing-secret"
          if ! gcloud secrets describe "$controlled_download_secret" --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Required secret ${controlled_download_secret} not found in project ${project_id}."
            exit 1
          fi
          secret_args="${secret_args},CONTROLLED_DOWNLOAD_SIGNING_SECRET=${controlled_download_secret}:latest"

          if gcloud secrets describe "${secret_prefix}-internal-key" --project "$project_id" >/dev/null 2>&1; then
            secret_args="${secret_args},DRTS_INTERNAL_KEY=${secret_prefix}-internal-key:latest"
          fi

          llm_secret="${secret_prefix}-llm-gateway-api-key"
          if gcloud secrets describe "$llm_secret" --project "$project_id" >/dev/null 2>&1; then
            secret_args="${secret_args},LLM_GATEWAY_API_KEY=${llm_secret}:latest"
            if [[ "$assistant_runtime" == "openclaw" ]]; then
              llm_provider="openclaw"
              llm_chat_model="${DEV_OPENCLAW_AGENT_MODEL:-openai/gpt-5.5}"
              llm_summarizer_model="${DEV_OPENCLAW_SUMMARIZER_MODEL:-openai/gpt-5.4-mini}"
              openclaw_auth_provider="${DEV_OPENCLAW_AUTH_PROVIDER:-}"
              openclaw_home="${DEV_OPENCLAW_HOME:-/tmp/platform-admin-assistant-openclaw}"
            else
              llm_provider="${DEV_LLM_GATEWAY_PROVIDER:-openai}"
              llm_chat_model="${DEV_LLM_GATEWAY_CHAT_MODEL:-gpt-4.1-mini}"
              llm_summarizer_model="${DEV_LLM_GATEWAY_SUMMARIZER_MODEL:-gpt-4.1-mini}"
              llm_base_url="${DEV_LLM_GATEWAY_BASE_URL:-}"
            fi
          fi

          echo "api=${secret_args}" >> "$GITHUB_OUTPUT"
          echo "llm_provider=${llm_provider}" >> "$GITHUB_OUTPUT"
          echo "llm_chat_model=${llm_chat_model}" >> "$GITHUB_OUTPUT"
          echo "llm_summarizer_model=${llm_summarizer_model}" >> "$GITHUB_OUTPUT"
          echo "llm_base_url=${llm_base_url}" >> "$GITHUB_OUTPUT"
          echo "openclaw_auth_provider=${openclaw_auth_provider}" >> "$GITHUB_OUTPUT"
          echo "openclaw_home=${openclaw_home}" >> "$GITHUB_OUTPUT"

      - name: Build API env vars
        id: api_env
        run: |
          set -euo pipefail

          env_vars="NODE_ENV=production,API_PORT=3001,PLATFORM_ADMIN_ASSISTANT_ENABLED=true,LLM_GATEWAY_PROVIDER=${{ steps.api_secrets.outputs.llm_provider }},LLM_GATEWAY_CHAT_MODEL=${{ steps.api_secrets.outputs.llm_chat_model }},LLM_GATEWAY_SUMMARIZER_MODEL=${{ steps.api_secrets.outputs.llm_summarizer_model }}"
          if [[ -n "${{ steps.api_secrets.outputs.llm_base_url }}" ]]; then
            env_vars="${env_vars},LLM_GATEWAY_BASE_URL=${{ steps.api_secrets.outputs.llm_base_url }}"
          fi
          if [[ "${{ steps.api_secrets.outputs.llm_provider }}" == "openclaw" ]]; then
            env_vars="${env_vars},OPENCLAW_AGENT_MODEL=${{ steps.api_secrets.outputs.llm_chat_model }}"
            if [[ -n "${{ steps.api_secrets.outputs.openclaw_auth_provider }}" ]]; then
              env_vars="${env_vars},OPENCLAW_AUTH_PROVIDER=${{ steps.api_secrets.outputs.openclaw_auth_provider }}"
            fi
            if [[ -n "${{ steps.api_secrets.outputs.openclaw_home }}" ]]; then
              env_vars="${env_vars},OPENCLAW_HOME=${{ steps.api_secrets.outputs.openclaw_home }}"
            fi
          fi

          echo "vars=${env_vars}" >> "$GITHUB_OUTPUT"

      - name: Deploy — api
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/api:${{ needs.build-push.outputs.image_tag }}"

          gcloud run deploy "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3001 \
            --ingress all \
            --set-cloudsql-instances "${{ needs.prepare.outputs.cloudsql }}" \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "${{ steps.api_secrets.outputs.api }}" \
            --set-env-vars "${{ steps.api_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.api_exposure_flag }} \
            --min-instances 0 \
            --max-instances 3 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Resolve API URL
        id: api_url
        run: |
          URL="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Build shared web env vars
        id: web_env
        run: |
          set -euo pipefail

          api_origin="${{ needs.prepare.outputs.api_origin }}"
          if [[ -z "$api_origin" ]]; then
            api_origin="${{ steps.api_url.outputs.url }}"
          fi

          env_vars="NODE_ENV=production,DRTS_API_URL=${api_origin},NEXT_PUBLIC_API_URL=/control-plane-proxy"

          if [[ -n "${DEV_IAP_CLIENT_ID:-}" ]]; then
            env_vars="${env_vars},DRTS_API_AUTH_AUDIENCE=${DEV_IAP_CLIENT_ID}"
          fi

          echo "vars=${env_vars}" >> "$GITHUB_OUTPUT"

      - name: Deploy — platform-admin-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/platform-admin-web:${{ needs.build-push.outputs.image_tag }}"

          gcloud run deploy "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3002 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }},NEXT_PUBLIC_PLATFORM_ADMIN_ASSISTANT_ENABLED=true" \
            ${{ needs.prepare.outputs.platform_admin_exposure_flag }} \
            --min-instances 0 \
            --max-instances 2 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — ops-console-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/ops-console-web:${{ needs.build-push.outputs.image_tag }}"

          gcloud run deploy "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3003 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.ops_console_exposure_flag }} \
            --min-instances 0 \
            --max-instances 2 \
            --project "${{ needs.prepare.outputs.project_id }}"

      - name: Deploy — fleet-partner-portal-web
        run: |
          IMAGE="${{ needs.prepare.outputs.registry }}/fleet-partner-portal-web:${{ needs.build-push.outputs.image_tag }}"

          gcloud run deploy "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --image "$IMAGE" \
            --port 3007 \
            --ingress all \
            --service-account "${{ needs.prepare.outputs.runtime_service_account }}" \
            --set-secrets "JWT_SECRET=${{ needs.prepare.outputs.secret_prefix }}-jwt-secret:latest" \
            --set-env-vars "${{ steps.web_env.outputs.vars }}" \
            ${{ needs.prepare.outputs.fleet_partner_portal_exposure_flag }} \
            --min-instances 0 \
            --max-instances 2 \
            --project "${{ needs.prepare.outputs.project_id }}"

  health-check:
    name: Dev health check
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    environment: dev

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ needs.prepare.outputs.target_profile == 'waji' && needs.prepare.outputs.waji_wif_provider || needs.prepare.outputs.target_profile == 'waji' && env.WIF_PROVIDER || env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ needs.prepare.outputs.target_profile == 'waji' && env.WIF_SERVICE_ACCOUNT || env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ needs.prepare.outputs.project_id }}

      - name: Wait for services to be Ready
        run: |
          set -euo pipefail

          for svc in \
            "${{ needs.prepare.outputs.api_service }}" \
            "${{ needs.prepare.outputs.platform_admin_service }}" \
            "${{ needs.prepare.outputs.ops_console_service }}" \
            "${{ needs.prepare.outputs.fleet_partner_portal_service }}"; do
            echo "Waiting for ${svc} ..."
            service_ready=false
            for i in $(seq 1 24); do
              ready="$(gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='value(status.conditions[0].status)' 2>/dev/null || true)"
              echo "  attempt ${i}: Ready=${ready}"
              if [[ "$ready" == "True" ]]; then
                service_ready=true
                break
              fi
              sleep 10
            done
            if [[ "$service_ready" != "true" ]]; then
              echo "::error::${svc} did not reach Ready=True in time."
              gcloud run services describe "${svc}" \
                --region "${{ needs.prepare.outputs.region }}" \
                --project "${{ needs.prepare.outputs.project_id }}" \
                --format='yaml(status)' || true
              exit 1
            fi
          done

      - name: Resolve service URLs
        id: urls
        run: |
          api_url="$(gcloud run services describe "${{ needs.prepare.outputs.api_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          platform_admin_url="$(gcloud run services describe "${{ needs.prepare.outputs.platform_admin_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          ops_console_url="$(gcloud run services describe "${{ needs.prepare.outputs.ops_console_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"
          fleet_partner_portal_url="$(gcloud run services describe "${{ needs.prepare.outputs.fleet_partner_portal_service }}" \
            --region "${{ needs.prepare.outputs.region }}" \
            --project "${{ needs.prepare.outputs.project_id }}" \
            --format='value(status.url)')"

          echo "api=${api_url}" >> "$GITHUB_OUTPUT"
          echo "platform_admin=${platform_admin_url}" >> "$GITHUB_OUTPUT"
          echo "ops_console=${ops_console_url}" >> "$GITHUB_OUTPUT"
          echo "fleet_partner_portal=${fleet_partner_portal_url}" >> "$GITHUB_OUTPUT"

      - name: Verify dev endpoints
        run: |
          curl --fail --silent --show-error "${{ steps.urls.outputs.api }}/health" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.platform_admin }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.ops_console }}" >/dev/null
          curl --fail --silent --show-error "${{ steps.urls.outputs.fleet_partner_portal }}" >/dev/null

      - name: Print dev URLs
        run: |
          echo "=== Dev deployment complete ==="
          echo "  api: ${{ steps.urls.outputs.api }}"
          echo "  platform-admin: ${{ steps.urls.outputs.platform_admin }}"
          echo "  ops-console: ${{ steps.urls.outputs.ops_console }}"
          echo "  fleet-partner-portal: ${{ steps.urls.outputs.fleet_partner_portal }}"
