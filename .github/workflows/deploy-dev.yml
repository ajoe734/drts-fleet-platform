          push: true
          tags: |
            ${{ needs.prepare.outputs.registry }}/bank-console-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=bank-console-web
          cache-to: type=gha,scope=bank-console-web,mode=min

      - name: Build & push — referral-embed-web
        if: steps.existing.outputs.referral-embed-web != 'true'
        uses: docker/build-push-action@v5
        with:
