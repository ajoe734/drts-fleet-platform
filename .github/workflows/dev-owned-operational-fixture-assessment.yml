name: Dev Owned Operational Fixture Assessment

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/dev-owned-operational-fixture-assessment.yml"
      - "operations/verification/assess-owned-operational-fixtures.py"
      - "tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_assessment.py"
      - "docs/04-uat/dev-owned-operational-fixture-assessment-20261010.md"
  push:
    branches:
      - dev
      - "gemini2/**"
      - "codex/**"
    paths:
      - ".github/workflows/dev-owned-operational-fixture-assessment.yml"
      - "operations/verification/assess-owned-operational-fixtures.py"
      - "tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_assessment.py"
      - "docs/04-uat/dev-owned-operational-fixture-assessment-20261010.md"
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Immutable product commit SHA (must match source SHA 4a166f3ed2a7000061acc737ee475ae3c47dca56)'
        required: true
        default: '4a166f3ed2a7000061acc737ee475ae3c47dca56'
        type: string
      product_run_id:
        description: "Authoritative product run ID"
        required: true
        default: "37906298090"
        type: string
      workflow_def_sha:
        description: 'Authoritative deploy workflow definition SHA'
        required: true
        default: '9a1b6466a8b15d7d328e9ceba33ba5dc92f7fa9c'
        type: string
      artifact_id:
        description: "Authoritative operational browser evidence artifact ID"
        required: true
        default: "11606165993"
        type: string
      current_runtime_sha:
        description: 'Expected current runtime SHA'
        required: true
        default: '4a166f3ed2a7000061acc737ee475ae3c47dca56'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  DEV_GCP_PROJECT_ID: "drts-dev-devcc-20260825"
  DEV_GCP_REGION: "us-central1"
  EXPECTED_PROJECT_ID: "drts-dev-devcc-20260825"
  EXPECTED_REGION: "us-central1"

jobs:
  unit-tests:
    name: Unit tests & safety guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tool definition
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile python sources
        run: |
          python3 -m py_compile \
            operations/verification/assess-owned-operational-fixtures.py \
            tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_assessment.py

      - name: Execute unit test suite
        run: |
          python3 -m unittest tests/unit/gcp-artifact-activation-20261004/test_owned_operational_fixture_assessment.py -v

  assess-fixtures:
    name: Owned fixture assessment (Read-only GCS / DB)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'workflow_dispatch'
    environment: operator
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.DEV_GCP_PROJECT_ID }}
          workload_identity_provider: "projects/24645990627/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "github-actions-deployer@drts-dev-devcc-20260825.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fresh Cloud metadata and overlap reservation check
        env:
          INPUT_WORKFLOW_DEF_SHA: ${{ github.event.inputs.workflow_def_sha }}
          INPUT_CURRENT_RUNTIME_SHA: ${{ github.event.inputs.current_runtime_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 operations/verification/read-dev-cloud-metadata.py \
            --expected-runtime-sha "$INPUT_CURRENT_RUNTIME_SHA" \
            --definition-sha "$INPUT_WORKFLOW_DEF_SHA" \
            --output .local-cloud-metadata.json
            
          MERGE_BASE=$(gh api "/repos/${{ github.repository }}/compare/dev...${{ github.sha }}" --jq '.status' || echo "unknown")
          if [ "$MERGE_BASE" != "identical" ] && [ "$MERGE_BASE" != "behind" ]; then
            echo "::error::Commit is not on the protected dev branch (status: $MERGE_BASE)"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up Cloud SQL Proxy
        run: |
          curl -o $RUNNER_TEMP/cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x $RUNNER_TEMP/cloud-sql-proxy

      - name: Execute read-only assessment
        env:
          INPUT_PRODUCT_RUN_ID: ${{ github.event.inputs.product_run_id }}
          INPUT_ARTIFACT_ID: ${{ github.event.inputs.artifact_id }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          INPUT_WORKFLOW_DEF_SHA: ${{ github.event.inputs.workflow_def_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE_JOBS=""
          for STATUS in requested queued waiting pending in_progress; do
            PAGE=1
            HAS_NEXT=true
            while [ "$HAS_NEXT" = "true" ]; do
              RES=$(gh api "/repos/${{ github.repository }}/actions/runs?status=$STATUS&per_page=100&page=$PAGE")
              MATCHES=$(echo "$RES" | jq -r '.workflow_runs[] | select(.name | test("deploy|restore|provision|provider|scanner"; "i")) | .id')
              if [ -n "$MATCHES" ]; then
                ACTIVE_JOBS="$ACTIVE_JOBS $MATCHES"
              fi
              COUNT=$(echo "$RES" | jq '.workflow_runs | length')
              if [ "$COUNT" -lt 100 ]; then
                HAS_NEXT=false
              else
                PAGE=$((PAGE+1))
              fi
            done
          done
          if [ -n "$ACTIVE_JOBS" ]; then
            echo "::error::Overlap detected: $ACTIVE_JOBS"
            exit 1
          fi

          python3 operations/verification/assess-owned-operational-fixtures.py \
            --product-run-id "$INPUT_PRODUCT_RUN_ID" \
            --artifact-id "$INPUT_ARTIFACT_ID" \
            --source-sha "$INPUT_SOURCE_REF" \
            --workflow-def-sha "$INPUT_WORKFLOW_DEF_SHA" > assessment-report.json

      - name: Upload assessment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assessment-report
          path: assessment-report.json
