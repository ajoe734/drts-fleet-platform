name: Nightly publish (cut snapshot)

# T4-T7 of v4 branch strategy: once per night (03:00 UTC = 11:00 Taipei), cut
# an immutable publish/v<date> branch from dev's current HEAD AND tag it
# release/v<date>. Pushing the publish branch triggers Deploy — Dev separately
# so the dev VM rolls over to this snapshot.
#
# Idempotent: if today's first publish already exists, increment the .N suffix
# (v2026.05.18.0 -> v2026.05.18.1).

on:
  schedule:
    # 03:00 UTC = 11:00 Asia/Taipei = start of TW business day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to snapshot (default: dev)"
        required: false
        default: "dev"
        type: string

permissions:
  contents: write # create branch + tag
  actions: write # gh workflow run deploy-dev.yml from inside this workflow

concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE: ${{ github.event.inputs.source_branch || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source SHA
        id: src
        run: |
          git fetch origin "$SOURCE" --quiet
          sha=$(git rev-parse "origin/$SOURCE")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Snapshotting $SOURCE @ $sha"

      - name: Verify dev's latest ci-integ is green
        id: green
        env:
          SRC_SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail

          # This gate used to read the check-run once and skip on anything that
          # was not "success" -- including "missing", which means the check has
          # not been created yet rather than that it failed.
          #
          # On 2026-08-22 a PR merged at 03:36:59, this ran at 03:37:39, and
          # ci-integ was not created until 03:46:01. Forty seconds of GitHub
          # latency cancelled that day's publish and deploy. The check itself
          # passed. The cron fires at 03:00 and merges land continuously, so
          # this race is a matter of timing, not of anything being wrong.
          #
          # Not-yet-started and failed are now different answers: wait for the
          # first, skip on the second.
          deadline=$(( SECONDS + 20 * 60 ))
          state="missing"
          while :; do
            state=$(gh api "repos/${{ github.repository }}/commits/${SRC_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="ci-integ")] | (if length==0 then "missing" else (.[0].conclusion // "pending") end)')
            case "${state}" in
              # A check filtered out by path rules is not a broken dev, and
              # blocking on it would stop publishing on documentation-only days.
              success|skipped|neutral)
                echo "ci-integ on dev HEAD = ${state}"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                echo "reason=" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              missing|pending|queued|in_progress)
                if (( SECONDS >= deadline )); then
                  echo "::warning::ci-integ on dev HEAD is still ${state} after 20 minutes. Skipping nightly publish."
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  echo "reason=ci-integ never concluded (last seen: ${state})" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "ci-integ on dev HEAD = ${state}; waiting."
                sleep 30
                ;;
              *)
                echo "::warning::ci-integ on dev HEAD is ${state} (need success). Skipping nightly publish."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "reason=ci-integ concluded ${state}" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

      - name: Compute next version
        if: steps.green.outputs.skip != 'true'
        id: ver
        run: |
          today_date=$(date -u +%Y.%m.%d)
          # Find the highest .N already used today; default to .0 if none.
          existing_nums=$(git ls-remote --refs --tags origin "refs/tags/release/v${today_date}.*" \
            | awk '{print $2}' | sed 's|refs/tags/release/v[0-9.]*\.||' | sort -n | tail -1)
          if [ -z "$existing_nums" ]; then
            n=0
          else
            n=$((existing_nums + 1))
          fi
          version="v${today_date}.${n}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next publish version: $version"

      - name: Check source has content delta vs latest publish
        if: steps.green.outputs.skip != 'true'
        id: delta
        run: |
          # Find latest publish/* branch on origin
          latest_publish=$(git ls-remote --heads origin "refs/heads/publish/v*" \
            | awk '{print $2}' | sort -V | tail -1 | sed 's|refs/heads/||')
          if [ -z "$latest_publish" ]; then
            echo "No previous publish branch; cutting first one."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$latest_publish" --quiet
          if git diff --quiet "origin/$latest_publish..${{ steps.src.outputs.sha }}"; then
            echo "::notice::No content delta between $latest_publish and dev HEAD; skipping nightly publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no content delta since $latest_publish" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut publish branch + tag
        if: steps.green.outputs.skip != 'true' && steps.delta.outputs.skip != 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          version="${{ steps.ver.outputs.version }}"
          sha="${{ steps.src.outputs.sha }}"
          branch="publish/$version"
          tag="release/$version"
          # Push branch
          git push origin "$sha:refs/heads/$branch"
          echo "Created branch $branch @ $sha"
          # Push annotated tag
          git tag -a "$tag" "$sha" -m "Nightly publish snapshot of $SOURCE at $sha"
          git push origin "$tag"
          echo "Tagged $tag"

      - name: Explicitly dispatch Deploy — Dev for the new snapshot
        if: steps.green.outputs.skip != 'true' && steps.delta.outputs.skip != 'true'
        run: |
          # The push of publish/v* above is by GITHUB_TOKEN, which under
          # GitHub's anti-recursion rules does NOT trigger downstream `push`
          # event workflows. workflow_dispatch IS allowed by the same rules,
          # so we dispatch deploy-dev explicitly. Without this, dev VM would
          # not roll until an operator manually triggers a deploy.
          version="${{ steps.ver.outputs.version }}"
          branch="publish/$version"
          if gh workflow run deploy-dev.yml --ref "$branch" -f source_ref="$branch" 2>&1; then
            echo "Dispatched deploy-dev.yml against $branch"
          else
            echo "::warning::Failed to dispatch deploy-dev.yml. Operator can run manually: gh workflow run deploy-dev.yml -f source_ref=$branch"
          fi

      # A skipped nightly used to report the run as a plain green tick, so
      # "today's snapshot went out" and "today's snapshot never happened" were
      # the same row in the workflow list. That is how a skipped 2026-08-22
      # publish went unnoticed. This step always runs and always states which
      # one it was, matching `deployed=yes|no` on the deploy-dev side.
      - name: Summarise
        if: always()
        env:
          GREEN_SKIP: ${{ steps.green.outputs.skip }}
          GREEN_REASON: ${{ steps.green.outputs.reason }}
          DELTA_SKIP: ${{ steps.delta.outputs.skip }}
          DELTA_REASON: ${{ steps.delta.outputs.reason }}
          VERSION: ${{ steps.ver.outputs.version }}
          SRC_SHA: ${{ steps.src.outputs.sha }}
        run: |
          set -euo pipefail

          if [ "${GREEN_SKIP:-}" = "true" ]; then
            published="no"
            reason="${GREEN_REASON:-dev HEAD was not verified green}"
          elif [ "${DELTA_SKIP:-}" = "true" ]; then
            published="no"
            reason="${DELTA_REASON:-no content delta}"
          elif [ -n "${VERSION:-}" ]; then
            published="yes"
            reason=""
          else
            published="no"
            reason="the job did not reach the publish decision"
          fi

          {
            echo "## Nightly publish"
            echo ""
            echo "\`published=${published}\`"
            echo ""
            if [ "${published}" = "yes" ]; then
              echo "- Version: \`${VERSION}\`"
              echo "- Source: \`${SOURCE}\` @ \`${SRC_SHA:0:12}\`"
              echo "- Branch: \`publish/${VERSION}\` (immutable snapshot)"
              echo "- Tag:    \`release/${VERSION}\` (same SHA)"
              echo "- Deploy — Dev: dispatched explicitly (a push by GITHUB_TOKEN cannot auto-trigger it)"
              echo "- Promotion to master: \`hourly-promote.yml\` picks this up after the ≥30 min soak window unless a \`regression:${VERSION}\` issue is opened."
            else
              echo "**No snapshot was cut and no deploy was dispatched.** Dev is still serving the previous publish."
              echo ""
              echo "Reason: ${reason}."
              if [ "${GREEN_SKIP:-}" = "true" ]; then
                echo ""
                echo "A green run with \`published=no\` for this reason is worth reading: nothing failed here, the nightly declined to publish."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${published}" = "yes" ]; then
            echo "::notice title=Nightly publish::published=yes; ${VERSION} cut and Deploy — Dev dispatched"
          else
            echo "::notice title=Nightly publish::published=no; ${reason}"
          fi
