name: Academy Acceptance Runner (SR-ACADEMY-BE-001)

# Dedicated acceptance runner for SR-ACADEMY-BE-001 Driver Academy:
# courses, versioned quizzes, grading, durable pass/expiry projection,
# lossless driver_id varchar migration, and active cohort boundary evaluation.
#
# Runs against a dedicated PostGIS migrated PostgreSQL database in GitHub Actions.
# Checks out the immutable candidate SHA, asserts HEAD match, preserves
# harness overlay without mutating candidate runtime sources, executes real HTTP
# and raw SQL acceptance tests, extracts SQL row evidence, verifies manifest,
# and gates on zero skips with all tests passing.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable candidate commit SHA to verify (full 40-char SHA)"
        required: true
        default: "432034826ccf802aa14609863ccc4fec54022199"
      candidate_ref:
        description: "Optional git ref/branch containing the candidate SHA (default: origin/gemini/sr-academy-be-001)"
        required: false
        default: "origin/gemini/sr-academy-be-001"
  push:
    branches:
      - "gemini/sr-academy-be-001"
      - "claude2/sr-academy-be-001"
      - "claude/sr-academy-be-001"

permissions:
  contents: read

concurrency:
  group: academy-acceptance-${{ github.event.inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CI: true
  JWT_SECRET: "sr-academy-be-001-acceptance-runner-test-only-hmac-secret-do-not-reuse"

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      DRTS_ACADEMY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      # Routed through job env to prevent script injection
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || '432034826ccf802aa14609863ccc4fec54022199' }}
      CANDIDATE_REF: ${{ github.event.inputs.candidate_ref || 'origin/gemini/sr-academy-be-001' }}
    steps:
      - name: Validate candidate_sha input
        run: |
          sha="$CANDIDATE_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA, got: $sha"
            exit 1
          fi

      - name: Checkout harness workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow structural contract (pre-overlay, this workflow only)
        run: python3 -m unittest tools/ci/test_academy_acceptance_workflow.py -v

      - name: Record harness SHA and preserve harness overlay
        run: |
          HARNESS_SHA="$(git rev-parse HEAD)"
          echo "HARNESS_SHA=$HARNESS_SHA" >> "$GITHUB_ENV"
          echo "Recorded harness SHA: $HARNESS_SHA"
          mkdir -p /tmp/academy-harness-overlay
          cp -r tests/integration/system-remediation/sr-academy-be-001 /tmp/academy-harness-overlay/
          echo "HARNESS_OVERLAY_HASH_HARNESS=$(git hash-object /tmp/academy-harness-overlay/sr-academy-be-001/academy-acceptance-test-harness.ts)" >> "$GITHUB_ENV"
          echo "HARNESS_OVERLAY_HASH_TESTS=$(git hash-object /tmp/academy-harness-overlay/sr-academy-be-001/academy-remote-acceptance.integration.test.ts)" >> "$GITHUB_ENV"

      - name: Checkout candidate runtime
        run: |
          echo "Fetching candidate ref $CANDIDATE_REF and SHA $CANDIDATE_SHA"
          git fetch origin "$CANDIDATE_REF" || git fetch origin "$CANDIDATE_SHA" || true
          git checkout "$CANDIDATE_SHA"
          resolved="$(git rev-parse HEAD)"
          echo "Resolved HEAD: $resolved"
          echo "Expected candidate: $CANDIDATE_SHA"
          if [ "$resolved" != "$CANDIDATE_SHA" ]; then
            echo "::error::Checked-out HEAD ($resolved) does not match requested candidate ($CANDIDATE_SHA)"
            exit 1
          fi
          echo "CANDIDATE_RESOLVED_SHA=$resolved" >> "$GITHUB_ENV"

      - name: Apply harness overlay and assert candidate runtime immutability
        run: |
          mkdir -p tests/integration/system-remediation/sr-academy-be-001
          cp -r /tmp/academy-harness-overlay/sr-academy-be-001/* tests/integration/system-remediation/sr-academy-be-001/

          # Assert candidate runtime sources and migrations remain strictly immutable
          status="$(git status --porcelain)"
          echo "Git status after applying harness overlay:"
          printf '%s\n' "$status"
          dirty_outside="$(echo "$status" | grep -v 'tests/integration/system-remediation/sr-academy-be-001/' || true)"
          if [ -n "$dirty_outside" ]; then
            echo "::error::Candidate runtime sources must remain strictly immutable; unexpected changes outside harness overlay:"
            printf '%s\n' "$dirty_outside"
            exit 1
          fi
          echo "Candidate runtime immutability verified."

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts package
        run: pnpm --filter @drts/contracts build

      - name: Apply database migrations
        run: |
          set -o pipefail
          mkdir -p .artifacts/academy-acceptance
          pnpm db:migrate 2>&1 | tee -a .artifacts/academy-acceptance/execution-log.txt

      - name: Run Driver Academy real PostgreSQL acceptance suite
        run: |
          set -o pipefail
          pnpm exec vitest run \
            tests/integration/system-remediation/sr-academy-be-001/academy-remote-acceptance.integration.test.ts \
            --no-file-parallelism --maxConcurrency=1 \
            --reporter=default --reporter=json \
            --outputFile.json=.artifacts/academy-acceptance/report.json \
            2>&1 | tee -a .artifacts/academy-acceptance/execution-log.txt

      - name: Extract raw SQL row evidence from PostgreSQL
        if: always()
        run: |
          echo "Extracting raw SQL evidence from PostgreSQL..."
          mkdir -p .artifacts/academy-acceptance

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT course_id, course_version, course_code, is_required, passing_score, created_at
          FROM reg.phase1_driver_academy_courses
          ORDER BY created_at DESC
          LIMIT 10;
          " > .artifacts/academy-acceptance/raw-sql-courses.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT attempt_id, course_id, course_version, driver_id, score, passed, attempted_at
          FROM reg.phase1_driver_quiz_attempts
          ORDER BY created_at DESC
          LIMIT 10;
          " > .artifacts/academy-acceptance/raw-sql-attempts.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT training_record_id, driver_id, course_name, course_type, result, completed_at, expires_at
          FROM reg.driver_training_records
          ORDER BY completed_at DESC
          LIMIT 10;
          " > .artifacts/academy-acceptance/raw-sql-training-records.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT driver_id, training_status, last_training_at, updated_at
          FROM reg.driver_reg_profiles
          ORDER BY updated_at DESC
          LIMIT 10;
          " > .artifacts/academy-acceptance/raw-sql-profiles.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT driver_id, registration_no, status, masked_display, updated_at
          FROM reg.driver_public_registration_credentials
          ORDER BY updated_at DESC
          LIMIT 10;
          " > .artifacts/academy-acceptance/raw-sql-credentials.txt || true

          PGPASSWORD=postgres psql -h localhost -U postgres -d drts_fleet_platform -x -c "
          SELECT affiliation_id, fleet_partner_id, driver_id, effective_from, effective_until, updated_at
          FROM admin.phase1_driver_fleet_affiliations
          ORDER BY updated_at DESC
          LIMIT 10;
          " > .artifacts/academy-acceptance/raw-sql-affiliations.txt || true

      - name: Write acceptance evidence manifest (runtime SHA, harness SHA, overlay hashes)
        if: always()
        run: |
          python3 - <<'PY_MANIFEST'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = {
              "requestedCandidateSha": os.environ.get("CANDIDATE_SHA"),
              "resolvedCandidateSha": os.environ.get("CANDIDATE_RESOLVED_SHA"),
              "candidateRef": os.environ.get("CANDIDATE_REF"),
              "harnessSha": os.environ.get("HARNESS_SHA"),
              "harnessOverlayHashes": {
                  "academy-acceptance-test-harness.ts": os.environ.get("HARNESS_OVERLAY_HASH_HARNESS"),
                  "academy-remote-acceptance.integration.test.ts": os.environ.get("HARNESS_OVERLAY_HASH_TESTS"),
              },
              "workflowRunId": os.environ.get("GITHUB_RUN_ID"),
              "workflowRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "generatedAt": datetime.now(timezone.utc).isoformat(),
          }
          Path(".artifacts/academy-acceptance").mkdir(parents=True, exist_ok=True)
          Path(".artifacts/academy-acceptance/manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY_MANIFEST

      - name: Gate on zero skips, all tests passed, and evidence present
        if: always()
        run: |
          python3 - <<'PY_GATE'
          import json
          from pathlib import Path

          def load_report(path):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"Acceptance gate: {path} was not produced.")
              return json.loads(p.read_text())

          report = load_report(".artifacts/academy-acceptance/report.json")
          total = report.get("numTotalTests", 0)
          passed = report.get("numPassedTests", 0)
          pending = report.get("numPendingTests", 0)
          failed = report.get("numFailedTests", 0)
          print(f"Academy Acceptance Suite: total={total} passed={passed} pending={pending} failed={failed}")

          if total == 0:
              raise SystemExit("Acceptance gate: executed zero tests.")
          if pending > 0:
              raise SystemExit(f"Acceptance gate: skipped {pending} tests (zero skips required).")
          if failed > 0 or not report.get("success"):
              raise SystemExit(f"Acceptance gate: had {failed} failing tests.")
          if passed != total:
              raise SystemExit(f"Acceptance gate: passed ({passed}) != total ({total}).")

          for sql_file in (
              "raw-sql-courses.txt",
              "raw-sql-attempts.txt",
              "raw-sql-training-records.txt",
              "raw-sql-profiles.txt",
              "raw-sql-credentials.txt",
              "raw-sql-affiliations.txt",
          ):
              sql_path = Path(f".artifacts/academy-acceptance/{sql_file}")
              if not sql_path.exists() or sql_path.stat().st_size == 0:
                  raise SystemExit(f"Acceptance gate: {sql_file} raw SQL evidence was not produced.")

          manifest_path = Path(".artifacts/academy-acceptance/manifest.json")
          if not manifest_path.exists():
              raise SystemExit("Acceptance gate: manifest.json (runtime/harness SHA evidence) was not produced.")
          manifest = json.loads(manifest_path.read_text())
          if not manifest.get("resolvedCandidateSha") or not manifest.get("harnessSha"):
              raise SystemExit("Acceptance gate: manifest.json is missing resolvedCandidateSha or harnessSha.")

          print(
              f"Academy acceptance runner: {passed} tests passed, zero skipped, "
              f"raw SQL evidence present, candidate={manifest['resolvedCandidateSha']}."
          )
          PY_GATE

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-acceptance-${{ env.CANDIDATE_RESOLVED_SHA || env.CANDIDATE_SHA }}
          path: |
            .artifacts/academy-acceptance/execution-log.txt
            .artifacts/academy-acceptance/report.json
            .artifacts/academy-acceptance/manifest.json
            .artifacts/academy-acceptance/raw-sql-*.txt
          if-no-files-found: warn
