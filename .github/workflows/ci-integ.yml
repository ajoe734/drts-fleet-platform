name: CI (integration trunk)

# Runs the full integration candidate on pull requests to `dev`, then repeats
# it on the merged `dev` head. `ci-integ` is a required PR check; a green dev
# result remains the prerequisite for nightly-publish.yml to cut the next
# publish/v<date> snapshot.

on:
  push:
    branches:
      - "dev"
  pull_request:
    branches:
      - "dev"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to run against"
        required: false
        default: "dev"
      readonly_dev_metadata:
        description: "Also collect fixed-inventory read-only dev cloud metadata; full CI remains mandatory"
        required: false
        default: false
        type: boolean
      expected_runtime_sha:
        description: "For metadata/shared bureau: full expected currently deployed release SHA"
        required: false
        default: ""
        type: string
      failed_api_revision:
        description: "Read-only startup log readback for one fixed failed API revision (drts-dev-api-00092-9j6)"
        required: false
        default: ""
        type: string
      readonly_fleet_failure:
        description: "Read only the two fixed original Fleet failure requests; never reruns them"
        required: false
        default: false
        type: boolean
      owned_referral_business:
        description: "Opt in to one owned synthetic business ride on the existing shared Referral Demo; never deploys"
        required: false
        default: false
        type: boolean
      owned_referral_recovery_only:
        description: "Recover only the exact retained original Referral order; no new booking or full-journey PASS"
        required: false
        default: false
        type: boolean
      dev_ops_enablement:
        description: "Explicitly enable the existing development Ops account through normal Admin activation and private service configuration; no ride operations"
        required: false
        default: false
        type: boolean
      shared_bureau:
        description: "Also run bureau journeys against the existing shared release; never deploys"
        required: false
        default: false
        type: boolean
      bureau_phones:
        description: "JSON: eight distinct allocated fresh synthetic identities, consent/wrong/resend/expiry/returning/trip/reliability/matching"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-integ-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

# Every job carries timeout-minutes. GitHub's default is six hours, and on
# 2026-08-19 a transient hang in `apt-get install postgresql-client` held
# iam-negative-matrix for three hours and twenty minutes on dev while the
# branch's CI result stayed unknown; the same step had hung three jobs on a PR
# earlier the same day. The limits are three times the longest observed
# successful run, floored at ten minutes, so a slow runner still passes and a
# hang is capped in minutes rather than hours.

jobs:
  dev-ops-enablement:
    if: github.event_name == 'workflow_dispatch' && inputs.dev_ops_enablement == true && inputs.owned_referral_business != true && inputs.shared_bureau != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: shared-dev-owned-referral-business-journey
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_DEFINITION_SHA: ${{ inputs.ref }}
      EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
    steps:
      - name: Validate explicit immutable development setup target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEFINITION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_DEFINITION_SHA" == "$GITHUB_SHA" ]]
          [[ "$DEV_GCP_PROJECT_ID" == drts-dev-devcc-20260825 ]]
          [[ "$DEV_GCP_REGION" == us-central1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual normal setup checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEFINITION_SHA"
      - name: Authenticate existing development deploy identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bind existing five services before normal account setup
        id: runtime_before
        run: python3 tests/e2e/owned-referral-business-journey/runtime-check.py --phase before
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Mint existing private API audience proof
        id: api_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.api_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Mint existing private Admin audience proof
        id: admin_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.admin_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Mint existing private Ops audience proof
        id: ops_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.ops_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Explicit normal existing-account activation and Ops verification
        env:
          DRTS_DEV_OPS_ENABLEMENT: "true"
          DEV_OPS_API_ID_TOKEN: ${{ steps.api_token.outputs.id_token }}
          DEV_OPS_ADMIN_ID_TOKEN: ${{ steps.admin_token.outputs.id_token }}
          DEV_OPS_CONSOLE_ID_TOKEN: ${{ steps.ops_token.outputs.id_token }}
        run: ./apps/api/node_modules/.bin/tsx tools/dev-ops-enablement/run.ts
      - name: Preserve only the normal setup safe journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-ops-enablement-${{ inputs.expected_runtime_sha }}-${{ github.run_id }}
          path: .artifacts/dev-ops-enablement/setup.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  owned-referral-business-journey:
    if: github.event_name == 'workflow_dispatch' && inputs.owned_referral_business == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: shared-dev-owned-referral-business-journey
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPECTED_DEFINITION_SHA: ${{ inputs.ref }}
      EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
    steps:
      - name: Validate immutable definition and existing dev target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEFINITION_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_RUNTIME_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_DEFINITION_SHA" == "$GITHUB_SHA" ]]
          [[ "$DEV_GCP_PROJECT_ID" == drts-dev-devcc-20260825 ]]
          [[ "$DEV_GCP_REGION" == us-central1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual consumer checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEFINITION_SHA"
      - name: Verify socket-free runtime allocation controls
        timeout-minutes: 2
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/unit/owned-referral-business-journey -p 'test_*.py' -v
      - name: Read the exact retained original booking journal
        if: inputs.owned_referral_recovery_only == true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNED_REFERRAL_HOSTED_OPT_IN: "true"
          OWNED_REFERRAL_RECOVERY_ONLY: "true"
        run: python3 tests/e2e/owned-referral-business-journey/retained-journal.py
      - name: Authenticate existing hosted verification identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bind the five existing live services before any data operation
        id: runtime_before
        run: python3 tests/e2e/owned-referral-business-journey/runtime-check.py --phase before
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium only in the hosted runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Mint existing API audience proof for normal Referral handoff
        id: api_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.api_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Mint existing private Admin audience proof
        id: admin_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.admin_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Mint existing private Ops audience proof
        id: ops_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.ops_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Mint existing private Fleet audience proof
        id: fleet_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.fleet_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Execute one owned synthetic same-order business lifecycle
        env:
          OWNED_REFERRAL_HOSTED_OPT_IN: "true"
          OWNED_REFERRAL_RECOVERY_ONLY: ${{ inputs.owned_referral_recovery_only }}
          OWNED_REFERRAL_RECOVER_ORIGINAL_JOURNAL: ${{ inputs.owned_referral_recovery_only }}
          OWNED_TEST_CODE_SHA: ${{ github.sha }}
          DRTS_CANDIDATE_SHA: ${{ inputs.expected_runtime_sha }}
          OWNED_REFERRAL_ORIGIN: ${{ steps.runtime_before.outputs.referral_origin }}
          OWNED_OPS_ORIGIN: ${{ steps.runtime_before.outputs.ops_origin }}
          OWNED_API_ID_TOKEN: ${{ steps.api_token.outputs.id_token }}
          OWNED_OPS_ID_TOKEN: ${{ steps.ops_token.outputs.id_token }}
          DRTS_OPERATIONAL_API_URL: ${{ steps.runtime_before.outputs.api_origin }}
          DRTS_OPERATIONAL_PLATFORM_ADMIN_URL: ${{ steps.runtime_before.outputs.admin_origin }}
          DRTS_OPERATIONAL_PLATFORM_ADMIN_ID_TOKEN: ${{ steps.admin_token.outputs.id_token }}
          DRTS_DEV_PLATFORM_ADMIN_BASE_URL: ${{ steps.runtime_before.outputs.admin_origin }}
          DRTS_DEV_PLATFORM_ADMIN_ID_TOKEN: ${{ steps.admin_token.outputs.id_token }}
          DRTS_DEV_FLEET_PARTNER_PORTAL_BASE_URL: ${{ steps.runtime_before.outputs.fleet_origin }}
          DRTS_DEV_FLEET_PARTNER_PORTAL_ID_TOKEN: ${{ steps.fleet_token.outputs.id_token }}
        run: pnpm exec playwright test -c playwright.owned-referral-business-journey.config.ts
      - name: Verify all five runtime revisions stayed unchanged
        if: always() && steps.runtime_before.outcome == 'success'
        run: python3 tests/e2e/owned-referral-business-journey/runtime-check.py --phase after
      - name: Preserve only this consumer's allowlisted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-referral-business-${{ inputs.expected_runtime_sha }}-${{ github.run_id }}
          path: |
            .artifacts/owned-referral-business-journey/runtime-before.json
            .artifacts/owned-referral-business-journey/runtime-after.json
            .artifacts/owned-referral-business-journey/journey-evidence.json
            .artifacts/owned-referral-business-journey/booking-write-journal.json
            .artifacts/owned-referral-business-journey/own-receipt.txt
            .artifacts/owned-referral-business-journey/cancellations/*-facts.json
            .artifacts/owned-referral-business-journey/cancellations/*-booking-write-journal.json
            .artifacts/owned-referral-business-journey/cancellations/results.json
            .artifacts/owned-referral-business-journey/cancellations/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  shared-bureau-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.shared_bureau == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: shared-dev-pax-bureau-acceptance
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_DEFINITION_SHA: ${{ inputs.ref }}
      EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
      PAX_BUREAU_PHONES: ${{ inputs.bureau_phones }}
    steps:
      - name: Validate fixed target and immutable definition before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEFINITION_SHA" == "$GITHUB_SHA" ]]
          [[ "$DEV_GCP_PROJECT_ID" == drts-dev-devcc-20260825 ]]
          [[ "$DEV_GCP_REGION" == us-central1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEFINITION_SHA"
      - name: Authenticate existing shared acceptance identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Bind all three live revisions before any journey
        id: runtime_before
        run: python3 tests/e2e/pax-bureau-acceptance/shared-runtime-check.py --phase before
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium in the hosted runner
        run: pnpm exec playwright install --with-deps chromium
      - name: Mint the existing private Ops and Driver audience credential
        id: ops_token
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          token_format: id_token
          id_token_audience: ${{ steps.runtime_before.outputs.ops_origin }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify the served Passenger, Ops and private Driver SHA
        env:
          PAX_ORIGIN: ${{ steps.runtime_before.outputs.pax_origin }}
          OPS_ORIGIN: ${{ steps.runtime_before.outputs.ops_origin }}
          OPS_ID_TOKEN: ${{ steps.ops_token.outputs.id_token }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          (async () => {
            const checks = [];
            for (const [role, url, privateService] of [
              ['pax', `${process.env.PAX_ORIGIN}/login`, false],
              ['ops', `${process.env.OPS_ORIGIN}/review`, true],
              ['driver', `${process.env.OPS_ORIGIN}/review-driver`, true],
            ]) {
              const headers = privateService
                ? {'X-Serverless-Authorization': `Bearer ${process.env.OPS_ID_TOKEN}`}
                : {};
              const response = await fetch(url, {headers, redirect: 'manual', signal: AbortSignal.timeout(60000)});
              assert.equal(response.status, 200, `${role}: served entry unavailable`);
              const sha = response.headers.get('x-drts-candidate-sha');
              assert.equal(sha, process.env.EXPECTED_RUNTIME_SHA, `${role}: served SHA differs`);
              checks.push({role, url, status: response.status, sha, cloudCredentialAttached: privateService});
            }
            fs.writeFileSync('.artifacts/pax-bureau-acceptance/shared-served-entries.json', JSON.stringify(checks, null, 2));
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Execute bureau journeys against the unchanged shared release
        env:
          PAX_REVIEW_SHARED_DEV_SMOKE: "true"
          PAX_REVIEW_PUBLIC_PASSENGER: "true"
          PAX_BUREAU_MATCHING_TIMEOUT_MS: ${{ steps.runtime_before.outputs.matching_timeout_ms }}
          PAX_REVIEW_PASSENGER_ORIGIN: ${{ steps.runtime_before.outputs.pax_origin }}
          PAX_REVIEW_OPS_ORIGIN: ${{ steps.runtime_before.outputs.ops_origin }}
          PAX_REVIEW_DRIVER_ORIGIN: ${{ steps.runtime_before.outputs.ops_origin }}
          PAX_REVIEW_OPS_ID_TOKEN: ${{ steps.ops_token.outputs.id_token }}
          PAX_REVIEW_DRIVER_ID_TOKEN: ${{ steps.ops_token.outputs.id_token }}
        run: pnpm exec playwright test -c playwright.pax-bureau-acceptance.config.ts
      - name: Verify the runtime stayed on the same three revisions
        if: always() && steps.runtime_before.outcome == 'success'
        run: python3 tests/e2e/pax-bureau-acceptance/shared-runtime-check.py --phase after
      - name: Preserve shared bureau results and explicit unexecuted branches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-pax-bureau-${{ inputs.expected_runtime_sha }}-${{ github.run_id }}
          path: .artifacts/pax-bureau-acceptance
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  readonly-dev-metadata:
    if: github.event_name == 'workflow_dispatch' && inputs.readonly_dev_metadata == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_DEFINITION_SHA: ${{ inputs.ref }}
      EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
    steps:
      - name: Validate immutable definition and target before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUNTIME_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEFINITION_SHA" == "$GITHUB_SHA" ]]
          [[ "$DEV_GCP_PROJECT_ID" == drts-dev-devcc-20260825 ]]
          [[ "$DEV_GCP_REGION" == us-central1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual checkout before authentication
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEFINITION_SHA"
      - name: Authenticate existing deploy identity for read-only metadata
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect fixed-inventory control-plane metadata only
        run: >-
          python3 operations/verification/read-dev-cloud-metadata.py
          --expected-runtime-sha "$EXPECTED_RUNTIME_SHA"
          --definition-sha "$EXPECTED_DEFINITION_SHA"
          --output .artifacts/dev-readonly-metadata/snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: dev-readonly-metadata-${{ github.run_id }}
          path: .artifacts/dev-readonly-metadata/snapshot.json
          if-no-files-found: error
          retention-days: 30

  readonly-api-startup-readback:
    if: github.event_name == 'workflow_dispatch' && inputs.failed_api_revision == 'drts-dev-api-00092-9j6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_DEFINITION_SHA: ${{ inputs.ref }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
    steps:
      - name: Validate immutable definition and target before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEFINITION_SHA" == "$GITHUB_SHA" ]]
          [[ "$DEV_GCP_PROJECT_ID" == drts-dev-devcc-20260825 ]]
          [[ "$DEV_GCP_REGION" == us-central1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual checkout before authentication
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEFINITION_SHA"
      - name: Authenticate existing deploy identity for read-only startup readback
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read failed API revision startup diagnostics
        run: >-
          python3 operations/verification/read-dev-api-startup-log.py
          --output .artifacts/dev-api-startup-readback/snapshot.json
      - name: Preserve startup readback or concrete query failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-api-startup-readback-${{ github.run_id }}
          path: .artifacts/dev-api-startup-readback/snapshot.json
          if-no-files-found: error
          retention-days: 14

  readonly-fleet-document-failure-readback:
    if: github.event_name == 'workflow_dispatch' && inputs.readonly_fleet_failure == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_DEFINITION_SHA: ${{ inputs.ref }}
      DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
    steps:
      - name: Validate immutable diagnostic definition and dev target before authentication
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEFINITION_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_DEFINITION_SHA" == "$GITHUB_SHA" ]]
          [[ "$DEV_GCP_PROJECT_ID" == drts-dev-devcc-20260825 ]]
          [[ "$DEV_GCP_REGION" == us-central1 ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual diagnostic checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_DEFINITION_SHA"
      - name: Authenticate existing deploy identity for read-only request diagnostics
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.DEV_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.DEV_WIF_PROVIDER }}
          service_account: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read only the fixed failure window without invoking the product
        run: >-
          python3 operations/verification/read-dev-fleet-document-failure-log.py
          --output .artifacts/dev-fleet-document-failure-readback/snapshot.json
      - name: Preserve only the safe diagnostic projection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-fleet-document-failure-readback-${{ github.run_id }}
          path: .artifacts/dev-fleet-document-failure-readback/snapshot.json
          if-no-files-found: error
          retention-days: 14

  # Owner checkpoints are intentionally cheap. A review candidate is the first
  # immutable SHA that may start the full integration gate.
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_full_ci: ${{ steps.gate.outputs.run_full_ci }}
    steps:
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PR_DRAFT" = "true" ]; then
            echo "run_full_ci=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR: waiting for the owner to hand off an immutable candidate."
          else
            echo "run_full_ci=true" >> "$GITHUB_OUTPUT"
          fi

  # One fail-safe classifier owns product/tool scope for both CI workflows.
  # Unknown paths, workflow changes, empty diffs, and non-PR events run the full
  # suite. Only a dev PR containing exclusively known internal-tool/docs paths
  # may skip product jobs.
  changes:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.filter.outputs.scope }}
      product: ${{ steps.filter.outputs.product }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scope classifier contract
        run: |
          python3 -m unittest tools/ci/test_classify_change_scope.py
          python3 -m unittest tools/ci/test_check_commit_trailers.py
          python3 -m unittest tools/ci/test_check_test_coverage.py
          python3 -m unittest tools/ci/test_workflow_timeouts.py
          python3 -m unittest tools/ci/test_workflow_unit_partitioning.py
          python3 -m unittest tools/ci/test_delivery_workflow_contract.py
          python3 -m unittest tools/ci/test_unit_partition_coverage.py
          python3 -m unittest tools/ci/test_dependency_security.py
          python3 -m unittest tools/ci/test_dev_artifact_providers.py
          python3 -m unittest tools/ci/test_dev_cloud_metadata_preflight.py
          python3 -m unittest tools/ci/test_tenant_binding_acceptance_workflow.py
          python3 -m unittest tools/ci/test_academy_acceptance_workflow.py
          python3 -m unittest tools/ci/test_leave_acceptance_workflow.py
          python3 -m unittest tools/ci/test_booking_search_acceptance_workflow.py
          python3 -m unittest tools/ci/test_host_acceptance_workflow.py
          python3 -m unittest tools/ci/test_driver_web_acceptance_workflow.py
          python3 -m unittest tools/ci/test_enterprise_search_acceptance_workflow.py
          python3 -m unittest tools/ci/test_enterprise_data_acceptance_workflow.py
          python3 -m unittest tools/ci/test_ops_proof_acceptance_workflow.py
          python3 -m unittest tools/ci/test_tenant_uat_acceptance_workflow.py
          python3 -m unittest tests/unit/system-remediation/sr-live-ops-001/test_drill.py -v
      - name: Verify fixed Fleet read-only diagnostic contracts
        run: python3 -m unittest tools/ci/test_read_dev_fleet_document_failure_log.py
      - name: Verify live mail Python unit tests
        run: python3 -m unittest discover -s tests/unit/system-remediation/sr-live-mail-001 -p 'test_*.py' -v
      - name: Verify live invoice mail Python unit tests
        run: python3 -m unittest discover -s tests/unit/system-remediation/sr-live-invoice-mail-20261007 -p 'test_*.py' -v
      - name: Verify every test file is on a path CI runs
        run: python3 tools/ci/check_test_coverage.py
      - id: filter
        name: Classify product and internal-tool changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/ci/classify_change_scope.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  lint:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # CI-BUDGET-F1: the API image build (measured 224-283s) and `pnpm run
  # test:unit` (measured running 849-944s and still not finished) used to
  # compete inside one 20-minute "unit" job, so the job was repeatedly
  # cancelled mid-suite rather than ever failing on a real assertion. The
  # image now builds once here and is loaded from a saved tarball by each
  # shard below; `unit` is now a cheap coverage+merge aggregate rather than
  # the job that runs tests, keeping that required check's name stable.
  unit-image:
    name: Unit test API image
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The default docker driver cannot export a cache; the container driver can.
      - uses: docker/setup-buildx-action@v3
      - name: Build API image for the control-plane resolution test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          tags: drts-api:test
          push: false
          load: true
          cache-from: type=gha,scope=api-test-image
          cache-to: type=gha,scope=api-test-image,mode=max
      - name: Save the built image so every unit shard can load it without rebuilding
        run: docker save drts-api:test -o drts-api-test-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: drts-api-test-image-${{ github.run_id }}
          path: drts-api-test-image.tar
          if-no-files-found: error
          retention-days: 1

  unit-shard:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    needs: [candidate, changes, unit-image]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_SEQ_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_TRANSPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_UI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: drts-api-test-image-${{ github.run_id }}
      - name: Load the API image this shard's control-plane resolution test requires
        run: docker load -i drts-api-test-image.tar
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        # Only unit-image builds drts-api:test; this shard only loads it, but
        # a missing image is still a failure here. Smoke acceptance runs the
        # same suite without one.
        env:
          DRTS_REQUIRE_API_TEST_IMAGE: "1"
        run: |
          pnpm db:migrate
          pnpm exec vitest run \
            --exclude tests/integration/unattended-voice-postgres.integration.test.ts \
            --exclude "tests/integration/system-remediation/sr-leave-be-001/**" \
            --exclude tests/e2e/system-remediation/sr-host-fe-001/host-api-sql-acceptance.test.ts \
            --shard=${{ matrix.shard }}/4 \
            --reporter=default --reporter=json \
            --outputFile.json=ci-integ-unit-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-integ-unit-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ci-integ-unit-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  # Verifies the 4 shards above covered the exact file set `pnpm run
  # test:unit` would discover unsharded -- no gaps, no duplicates -- then
  # merges their reports into the same single-report shape the rest of this
  # file's tooling already expects.
  unit:
    name: Unit tests
    needs: [candidate, changes, unit-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Not applicable for this scope/checkpoint
        if: needs.candidate.outputs.run_full_ci != 'true' || needs.changes.outputs.product != 'true'
        run: echo "Unit tests are not applicable to this scope/checkpoint; shard job was skipped."
      - uses: actions/download-artifact@v4
        if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
        with:
          pattern: ci-integ-unit-shard-*-${{ github.run_id }}
          path: ci-integ-unit-shards
          merge-multiple: true
      - name: Verify shard partition coverage and merge reports
        if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
        run: |
          [ '${{ needs.unit-shard.result }}' = 'success' ] || { echo "A unit test shard failed, was cancelled or was skipped: ${{ needs.unit-shard.result }}"; exit 1; }
          python3 tools/ci/verify_unit_partition_coverage.py \
            --root . \
            --include "tests/contract/**/*.test.ts" \
            --include "tests/integ/**/*.test.ts" \
            --include "tests/unit/**/*.test.ts" \
            --include "tests/unit/**/*.test.tsx" \
            --include "tests/integration/**/*.test.ts" \
            --include "tests/security/**/*.test.ts" \
            --include "tests/load/**/*.test.ts" \
            --include "tests/e2e/**/*.test.ts" \
            --exclude tests/integration/unattended-voice-postgres.integration.test.ts \
            --exclude "tests/integration/system-remediation/sr-leave-be-001/**" \
            --exclude tests/e2e/system-remediation/sr-host-fe-001/host-api-sql-acceptance.test.ts \
            --shard-report ci-integ-unit-shards/ci-integ-unit-shard-1.json \
            --shard-report ci-integ-unit-shards/ci-integ-unit-shard-2.json \
            --shard-report ci-integ-unit-shards/ci-integ-unit-shard-3.json \
            --shard-report ci-integ-unit-shards/ci-integ-unit-shard-4.json

  integration:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_UI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      # This job runs as a non-strict (CI/"test") auth environment. The
      # platform/ops workforce step-up MFA gate denies by default
      # (ENTRY-IAP-WORKFORCE-AUTH-20261005); the bootstrap dev fixture no
      # longer fabricates verified_iap_workforce/aal2, so integration tests
      # exercising platform_admin/ops_user privileged actions need this
      # explicit, audited dev waiver. isDevWorkforceMfaWaiverEnabled rejects
      # it outright in staging/production regardless of this value.
      DRTS_DEV_MFA_WAIVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Run voice booking command PostgreSQL crash matrix
        env:
          UV_BOOKING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @drts/contracts build
          pnpm --filter @drts/control-plane-auth build
          mkdir -p .artifacts/voice-booking-command
          pnpm exec vitest run tests/integration/uv-exec-015.integration.test.ts \
            --no-file-parallelism --maxConcurrency=1 \
            --reporter=default --reporter=json \
            --outputFile.json=.artifacts/voice-booking-command/postgres-results.json
          python3 - <<'PY_GATE'
          import json
          from pathlib import Path
          report = json.loads(Path('.artifacts/voice-booking-command/postgres-results.json').read_text())
          total = report.get('numTotalTests', 0)
          passed = report.get('numPassedTests', 0)
          pending = report.get('numPendingTests', 0)
          if total < 14 or passed != total or pending or not report.get('success'):
              raise SystemExit(f'PostgreSQL matrix incomplete: total={total}, passed={passed}, pending={pending}')
          print(f'PostgreSQL command/crash matrix: {passed} passed, none skipped')
          PY_GATE
      - name: Upload voice booking command PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-booking-command-postgres-${{ github.sha }}
          path: .artifacts/voice-booking-command/postgres-results.json
          if-no-files-found: warn
      - name: Run UV-EXEC-024 real PostgreSQL two-instance race & fault matrix
        env:
          UV_BOOKING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm --filter @drts/contracts build
          pnpm --filter @drts/control-plane-auth build
          mkdir -p .artifacts/unattended-voice-postgres
          pnpm exec vitest run tests/integration/unattended-voice-postgres.integration.test.ts \
            --no-file-parallelism --maxConcurrency=1 \
            --reporter=default --reporter=json \
            --outputFile.json=.artifacts/unattended-voice-postgres/postgres-results.json
          python3 - <<'PY_GATE'
          import json
          from pathlib import Path
          report = json.loads(Path('.artifacts/unattended-voice-postgres/postgres-results.json').read_text())
          total = report.get('numTotalTests', 0)
          passed = report.get('numPassedTests', 0)
          pending = report.get('numPendingTests', 0)
          if total < 18 or passed != total or pending or not report.get('success'):
              raise SystemExit(f'UV-EXEC-024 matrix incomplete: total={total}, passed={passed}, pending={pending}')
          print(f'UV-EXEC-024 two-instance race & fault matrix: {passed} passed, none skipped')
          PY_GATE
      - name: Upload UV-EXEC-024 PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unattended-voice-postgres-${{ github.sha }}
          path: .artifacts/unattended-voice-postgres/postgres-results.json
          if-no-files-found: warn
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run integration tests
        run: pnpm run test:integration
      - name: Run PostgreSQL UAT gates serially
        run: pnpm --filter @drts/api run test:integration:postgres-gates

  iam-negative-matrix:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      E2E_API_URL: http://localhost:3001
      AUTH_MODE: test
      JWT_SECRET: ci-e2e-secret
      JWT_ISSUER: drts-local
      JWT_AUDIENCE: drts-api
      CONTROLLED_DOWNLOAD_SIGNING_SECRET: ci-e2e-controlled-download-secret
      PARTNER_INGRESS_KEY_BANK_DEMO_ALPHA_AIRPORT: ci-e2e-alpha-ingress-key
      PARTNER_INGRESS_KEY_BANK_DEMO_BETA_AIRPORT: ci-e2e-beta-ingress-key
      # This job's hermetic E2E sub-run (tests/e2e/E2E-004/018 via
      # run-iam-negative-matrix.sh) drives real platform_admin/ops_user
      # bootstrap identities through privileged platform-admin routes. Since
      # ENTRY-IAP-WORKFORCE-AUTH-20261005 removed the fabricated
      # verified_iap_workforce/aal2 stamping on those bootstrap identities,
      # the step-up gate needs the explicit, audited dev waiver to clear
      # (mirrors the "API unit tests" step in ci.yml). The tests/security/*
      # cases in this same step do not reference MFA/step-up state, so this
      # is safe at job level. isDevWorkforceMfaWaiverEnabled rejects the flag
      # outright in staging/production regardless of this value.
      DRTS_DEV_MFA_WAIVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      # The suite asserts denial behaviour against real iam.* tables; without
      # the schema every case fails with `relation "iam.identity_principals"
      # does not exist` rather than testing anything.
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run IAM negative matrix
        run: pnpm run test:security:iam-negative-matrix

  build:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  i18n-guard:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run i18n:guard

  repo-classification:
    name: Repo classification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository file classification
        run: node tools/ci/check-repo-classification.mjs

  dependency-security:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Run dependency security gate
        run: python3 tools/ci/dependency_security.py

  orchestrator-tests:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run orchestrator unit tests
        run: python3 -m unittest discover -s tools/development-orchestrator -p 'test_*.py' -v
      - name: Validate task materializer contract
        run: python3 tools/task-dispatch/dispatch-stage1-functional-completion-20260808.py --dry-run

  # Cross-surface E2E suite (tests/e2e/E2E-0*.sh) against a real Postgres-backed
  # API runtime. This is the gate that proves the named business-line workflows
  # (enterprise dispatch, forwarded order, partner airport/booking, tenant
  # governance, driver multi-platform, fleet revenue share, etc.) stay green.
  cross-surface-e2e:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostGIS-enabled image: V0038 migration enables the postgis extension
        # (operating-area/route geometry). Plain postgres:16 lacks the postgis
        # shared library, so db:migrate fails and every hermetic scenario aborts.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      E2E_API_URL: http://localhost:3001
      # The API rejects implicit local/test auth configuration at startup.
      AUTH_MODE: test
      JWT_SECRET: ci-e2e-secret
      JWT_ISSUER: drts-local
      JWT_AUDIENCE: drts-api
      CONTROLLED_DOWNLOAD_SIGNING_SECRET: ci-e2e-controlled-download-secret
      DOCUMENT_ARTIFACT_STORAGE_PROVIDER: memory
      PARTNER_INGRESS_KEY_BANK_DEMO_ALPHA_AIRPORT: ci-e2e-alpha-ingress-key
      PARTNER_INGRESS_KEY_BANK_DEMO_BETA_AIRPORT: ci-e2e-beta-ingress-key
      # Several scenarios here (E2E-004/008/011/015/016) drive real
      # platform_admin/ops_user bootstrap identities through privileged
      # platform-admin routes. ENTRY-IAP-WORKFORCE-AUTH-20261005 removed the
      # fabricated verified_iap_workforce/aal2 stamping on those bootstrap
      # identities, so the step-up gate needs the explicit, audited dev
      # waiver to clear (mirrors the "API unit tests" step in ci.yml).
      # isDevWorkforceMfaWaiverEnabled rejects the flag outright in
      # staging/production regardless of this value.
      DRTS_DEV_MFA_WAIVED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter @drts/api build
      - name: Run cross-surface E2E suite (hermetic baseline clone + restart API per scenario)
        run: ./tests/e2e/run-e2e-hermetic.sh
      - name: API logs on failure
        if: failure()
        run: tail -n 100 /tmp/drts-e2e-api.log || true

  # This suite is independent from the API lifecycle exercised above. Running
  # it in a second runner removes a serialized 39-route tail from every CI run.
  ui-route-e2e:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_route_suite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      # This runner owns its web server. Parallel E2E jobs cannot consume the
      # API build produced by cross-surface-e2e's ephemeral filesystem.
      - name: Build API
        run: pnpm --filter @drts/api build
      - name: Run deterministic 39-route UI suite
        run: |
          PGPASSWORD=postgres psql \
            postgresql://postgres:postgres@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS drts_route_suite;' \
            -c 'CREATE DATABASE drts_route_suite;'
          pnpm db:migrate
          pnpm db:seed
          # ubuntu-latest can expose a stale Google Chrome apt index whose hash
          # mismatch prevents Playwright dependency installation. Chromium uses
          # Ubuntu packages here, so disable that unrelated source in this
          # ephemeral runner before installing browser dependencies.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname "*google*" -o -iname "*chrome*" \) \
            -exec mv "{}" "{}.disabled" \; || true
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test -c playwright.deterministic-route-suite.config.ts
          pnpm exec playwright test -c playwright.tenant-map-booking.config.ts
          pnpm exec playwright test -c playwright.partner-booking-surfaces.config.ts
          pnpm exec playwright test -c playwright.concierge-map-booking.config.ts
          pnpm --filter @drts/passenger-app-web... build
          pnpm exec playwright test -c playwright.passenger-demo.config.ts
      - name: Upload passenger demonstration browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passenger-demo-browser-${{ github.run_id }}
          path: |
            .artifacts/passenger-demo-e2e
            .artifacts/passenger-demo-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The real scheduled journeys need their own existing 25-minute envelope;
  # the legacy route suites consumed half of it before this case could start.
  # Both jobs remain required by the original E2E aggregate below.
  ui-shared-order-e2e:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_route_suite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter @drts/api build
      - name: Run the real three-role shared-order journeys
        run: |
          PGPASSWORD=postgres psql \
            postgresql://postgres:postgres@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS drts_route_suite;' \
            -c 'CREATE DATABASE drts_route_suite;'
          pnpm db:migrate
          pnpm db:seed
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname "*google*" -o -iname "*chrome*" \) \
            -exec mv "{}" "{}.disabled" \; || true
          pnpm exec playwright install --with-deps chromium
          # Build the exact production Driver mount plus the existing standalone
          # Driver Web surface. Neither export starts a dev server on this VM.
          EXPO_PUBLIC_API_URL=/api/review-driver-api \
            EXPO_PUBLIC_REVIEW_DEMO=true EXPO_PUBLIC_REVIEW_BASE_PATH=/review-driver \
            pnpm --filter @drts/driver-app exec expo export -p web --output-dir dist
          mkdir -p apps/passenger-app-web/public/review-driver
          cp -R apps/driver-app/dist/. apps/passenger-app-web/public/review-driver/
          pnpm --filter @drts/passenger-app-web... build
          EXPO_PUBLIC_API_URL=http://127.0.0.1:3001 \
            EXPO_PUBLIC_REVIEW_DEMO=true EXPO_PUBLIC_REVIEW_BASE_PATH= \
            pnpm --filter @drts/driver-app exec expo export -p web --output-dir dist
          pnpm exec tsc -p tests/unit/pax-review-shared-order-demo-20261015/tsconfig.driver-tests.json --noEmit
          pnpm exec vitest run --config tests/unit/pax-review-shared-order-demo-20261015/driver-vitest.config.ts
          pnpm exec playwright test -c playwright.pax-review-shared-order.config.ts
      - name: Run additional real booking, accepted-cancellation and no-contact rating branches
        run: pnpm exec playwright test -c playwright.pax-review-additional-branches.config.ts
      - name: Upload additional passenger branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-review-additional-branches-${{ github.run_id }}
          path: .artifacts/pax-review-additional-branches
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Upload new shared-order rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-review-shared-order-${{ github.run_id }}
          path: .artifacts/pax-review-shared-order
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # OTP/consent-gate branches (wrong code, lockout, real sixty-second resend,
  # the real five-minute code expiry, and a returning session's
  # consent-already-current skip) only need the API and Passenger web, not
  # Ops/Driver/Platform Admin; the UC05 on_trip cancellation-rejection branch
  # added alongside them does need a real Ops dispatch/assignment and a real
  # Driver trip through to on_trip, so this job also builds the standalone
  # Driver Web export (same step ui-shared-order-e2e uses) and boots Ops.
  # This still runs as its own job instead of growing ui-shared-order-e2e's
  # already-tight 25-minute envelope. The real five-minute OTP expiry wait
  # alone needs over five minutes inside this job, on top of
  # install/build/browser-install, the Driver export and the other serial
  # cases; timeout-minutes is raised 25->40 to fit the added Driver export
  # build and the real scheduled-pickup/trip-duration waits the on_trip case
  # needs, pending the first hosted run's actual step times.
  ui-bureau-acceptance-e2e:
    needs: [candidate, changes]
    if: needs.candidate.outputs.run_full_ci == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_bureau_acceptance
      PAX_REVIEW_OPS_FIXTURE_EVIDENCE_DIR: .artifacts/pax-bureau-acceptance
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared release binding and private-role failure cases without sockets
        run: python3 -B -m unittest discover -s tests/unit/pax-bureau-journey-coverage-20261018 -p test_shared_runtime_check.py
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed the disposable hosted database
        run: |
          PGPASSWORD=postgres psql \
            postgresql://postgres:postgres@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS drts_bureau_acceptance;' \
            -c 'CREATE DATABASE drts_bureau_acceptance;'
          pnpm db:migrate
          pnpm db:seed
      - name: Build the original API and Passenger application
        run: |
          pnpm --filter @drts/api build
          pnpm --filter @drts/passenger-app-web... build
      - name: Build the Driver Web standalone export
        run: |
          EXPO_PUBLIC_API_URL=http://127.0.0.1:3001 \
            EXPO_PUBLIC_REVIEW_DEMO=true EXPO_PUBLIC_REVIEW_BASE_PATH= \
            pnpm --filter @drts/driver-app exec expo export -p web --output-dir dist
      - name: Install Chromium in the hosted runner
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname "*google*" -o -iname "*chrome*" \) \
            -exec mv "{}" "{}.disabled" \; || true
          pnpm exec playwright install --with-deps chromium
      - name: Run OTP, cancellation, reliability, aftercare and matching bureau branches
        run: pnpm exec playwright test -c playwright.pax-bureau-acceptance.config.ts
      - name: Upload bureau acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pax-bureau-acceptance-${{ github.run_id }}
          path: .artifacts/pax-bureau-acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    needs:
      [
        candidate,
        changes,
        cross-surface-e2e,
        ui-route-e2e,
        ui-shared-order-e2e,
        ui-bureau-acceptance-e2e,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Aggregate E2E gates
        run: |
          if [ '${{ needs.candidate.outputs.run_full_ci }}' != 'true' ]; then
            echo "E2E skipped for an owner checkpoint draft."
            exit 0
          fi
          [ '${{ needs.changes.result }}' = 'success' ] || { echo "changes gate failed"; exit 1; }
          for result in '${{ needs.cross-surface-e2e.result }}' '${{ needs.ui-route-e2e.result }}' '${{ needs.ui-shared-order-e2e.result }}' '${{ needs.ui-bureau-acceptance-e2e.result }}'; do
            case "$result" in
              success) ;;
              skipped) echo "E2E skipped: no changed path can exercise it." ;;
              *) echo "Required E2E gate failed: $result"; exit 1 ;;
            esac
          done

  # Aggregate job for branch-protection "required check" simplicity.
  ci-integ:
    needs:
      [
        candidate,
        changes,
        lint,
        typecheck,
        unit,
        integration,
        iam-negative-matrix,
        build,
        i18n-guard,
        repo-classification,
        dependency-security,
        orchestrator-tests,
        e2e,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Aggregate
        run: |
          # `changes` must succeed on its own: if the gate breaks, e2e reports
          # "skipped" for the wrong reason, and treating that as a pass would
          # silently disable the suite.
          [ '${{ needs.candidate.result }}' = 'success' ] || { echo "Candidate gate failed"; exit 1; }
          if [ '${{ needs.candidate.outputs.run_full_ci }}' != 'true' ]; then
            echo "Owner checkpoint draft accepted; full CI starts only for a locked candidate."
            exit 0
          fi
          [ '${{ needs.changes.result }}' = 'success' ] || { echo "Change scope gate failed"; exit 1; }

          [ '${{ needs.repo-classification.result }}' = 'success' ] || { echo "Repo classification check failed"; exit 1; }
          [ '${{ needs.dependency-security.result }}' = 'success' ] || { echo "Dependency security check failed"; exit 1; }

          if [ '${{ needs.changes.outputs.product }}' = 'true' ]; then
            for r in '${{ needs.lint.result }}' '${{ needs.typecheck.result }}' '${{ needs.unit.result }}' '${{ needs.integration.result }}' '${{ needs.iam-negative-matrix.result }}' '${{ needs.build.result }}' '${{ needs.i18n-guard.result }}'; do
              [ "$r" = "success" ] || { echo "Required product check failed: $r"; exit 1; }
            done
          else
            echo "Product checks are not applicable to scope '${{ needs.changes.outputs.scope }}'."
          fi

          if [ '${{ needs.changes.outputs.orchestrator }}' = 'true' ]; then
            [ '${{ needs.orchestrator-tests.result }}' = 'success' ] || { echo "Orchestrator tests failed"; exit 1; }
          else
            echo "Orchestrator tests are not applicable to scope '${{ needs.changes.outputs.scope }}'."
          fi

          [ '${{ needs.e2e.result }}' = 'success' ] || { echo "Required E2E aggregate failed: ${{ needs.e2e.result }}"; exit 1; }
          echo "All checks required for scope '${{ needs.changes.outputs.scope }}' passed."
