name: CI (integration trunk)

# v4: post-merge integration suite on `dev`. Triggered by `push` only —
# PR-time gating is handled by ci.yml's 3 named checks (Commit trailers /
# Runtime mirror guard / Smoke acceptance).
#
# A green ci-integ on dev HEAD is the prerequisite for nightly-publish.yml
# to cut the next publish/v<date> snapshot. Without ci-integ green,
# nightly-publish skips with a warning.

on:
  push:
    branches:
      - "dev"
  pull_request:
    branches:
      - "dev"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit SHA to run against"
        required: false
        default: "dev"

permissions:
  contents: read

concurrency:
  group: ci-integ-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run integration tests
        run: pnpm run test:integration
      - name: Run PostgreSQL UAT gates serially
        run: pnpm --filter @drts/api run test:integration:postgres-gates

  iam-negative-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      E2E_API_URL: http://localhost:3001
      AUTH_MODE: test
      JWT_SECRET: ci-e2e-secret
      JWT_ISSUER: drts-local
      JWT_AUDIENCE: drts-api
      CONTROLLED_DOWNLOAD_SIGNING_SECRET: ci-e2e-controlled-download-secret
      PARTNER_INGRESS_KEY_BANK_DEMO_ALPHA_AIRPORT: ci-e2e-alpha-ingress-key
      PARTNER_INGRESS_KEY_BANK_DEMO_BETA_AIRPORT: ci-e2e-beta-ingress-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      # The suite asserts denial behaviour against real iam.* tables; without
      # the schema every case fails with `relation "iam.identity_principals"
      # does not exist` rather than testing anything.
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run IAM negative matrix
        run: pnpm run test:security:iam-negative-matrix

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  i18n-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run i18n:guard

  orchestrator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run orchestrator unit tests
        working-directory: .orchestrator
        run: python3 -m unittest discover -s . -p 'test_*.py' -v

  # Cross-surface E2E suite (tests/e2e/E2E-0*.sh) against a real Postgres-backed
  # API runtime. This is the gate that proves the named business-line workflows
  # (enterprise dispatch, forwarded order, partner airport/booking, tenant
  # governance, driver multi-platform, fleet revenue share, etc.) stay green.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS-enabled image: V0038 migration enables the postgis extension
        # (operating-area/route geometry). Plain postgres:16 lacks the postgis
        # shared library, so db:migrate fails and every hermetic scenario aborts.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      API_PORT: "3001"
      API_HOST: 0.0.0.0
      E2E_API_URL: http://localhost:3001
      # The API rejects implicit local/test auth configuration at startup.
      AUTH_MODE: test
      JWT_SECRET: ci-e2e-secret
      JWT_ISSUER: drts-local
      JWT_AUDIENCE: drts-api
      CONTROLLED_DOWNLOAD_SIGNING_SECRET: ci-e2e-controlled-download-secret
      PARTNER_INGRESS_KEY_BANK_DEMO_ALPHA_AIRPORT: ci-e2e-alpha-ingress-key
      PARTNER_INGRESS_KEY_BANK_DEMO_BETA_AIRPORT: ci-e2e-beta-ingress-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - run: pnpm install --frozen-lockfile
      - name: Build API
        run: pnpm --filter @drts/api build
      - name: Run cross-surface E2E suite (hermetic — reset DB + restart API per scenario)
        run: ./tests/e2e/run-e2e-hermetic.sh
      - name: Run deterministic 39-route UI suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_route_suite
        run: |
          PGPASSWORD=postgres psql \
            postgresql://postgres:postgres@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 \
            -c 'DROP DATABASE IF EXISTS drts_route_suite;' \
            -c 'CREATE DATABASE drts_route_suite;'
          pnpm db:migrate
          pnpm db:seed
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test -c playwright.deterministic-route-suite.config.ts
      - name: API logs on failure
        if: failure()
        run: tail -n 100 /tmp/drts-e2e-api.log || true

  # Aggregate job for branch-protection "required check" simplicity.
  ci-integ:
    needs:
      [
        lint,
        typecheck,
        unit,
        integration,
        iam-negative-matrix,
        build,
        i18n-guard,
        orchestrator-tests,
        e2e,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Aggregate
        run: |
          for r in '${{ needs.lint.result }}' '${{ needs.typecheck.result }}' '${{ needs.unit.result }}' '${{ needs.integration.result }}' '${{ needs.iam-negative-matrix.result }}' '${{ needs.build.result }}' '${{ needs.i18n-guard.result }}' '${{ needs.orchestrator-tests.result }}' '${{ needs.e2e.result }}'; do
            [ "$r" = "success" ] || { echo "Required check failed: $r"; exit 1; }
          done
          echo "All integration checks passed."
