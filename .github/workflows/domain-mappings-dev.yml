name: Domain Maintenance — Dev (smarttransport.tw)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'apply' to create Cloud Run domain mappings for smarttransport.tw"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
  # Explicit user-approved pause. Re-enabling requires a reviewed workflow change.
  DEV_PARTNER_BOOKING_STATE: "paused"
  DEV_GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
  DEV_GCP_REGION: ${{ vars.DEV_GCP_REGION }}
  DEV_GCP_API_SERVICE: ${{ vars.DEV_GCP_API_SERVICE }}
  DEV_GCP_PLATFORM_ADMIN_SERVICE: ${{ vars.DEV_GCP_PLATFORM_ADMIN_SERVICE }}
  DEV_GCP_OPS_CONSOLE_SERVICE: ${{ vars.DEV_GCP_OPS_CONSOLE_SERVICE }}
  DEV_GCP_FLEET_PARTNER_PORTAL_SERVICE: ${{ vars.DEV_GCP_FLEET_PARTNER_PORTAL_SERVICE }}
  DEV_GCP_TENANT_CONSOLE_SERVICE: ${{ vars.DEV_GCP_TENANT_CONSOLE_SERVICE }}
  DEV_GCP_BANK_CONSOLE_SERVICE: ${{ vars.DEV_GCP_BANK_CONSOLE_SERVICE }}
  DEV_GCP_REFERRAL_EMBED_SERVICE: ${{ vars.DEV_GCP_REFERRAL_EMBED_SERVICE }}
  DEV_GCP_ENTERPRISE_DISPATCH_SERVICE: ${{ vars.DEV_GCP_ENTERPRISE_DISPATCH_SERVICE }}
  DEV_GCP_CHANNEL_PARTNER_PORTAL_SERVICE: ${{ vars.DEV_GCP_CHANNEL_PARTNER_PORTAL_SERVICE }}
  DEV_WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER }}
  DEV_WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

jobs:
  map:
    if: ${{ inputs.confirm == 'apply' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ env.DEV_WIF_SERVICE_ACCOUNT || env.WIF_SERVICE_ACCOUNT }}
          project_id: ${{ env.DEV_GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.DEV_GCP_PROJECT_ID }}
          install_components: beta

      - name: Show acting identity
        run: |
          echo "Acting account (base64, decode to get the SA email to add as a Search Console owner):"
          gcloud config get-value account 2>/dev/null | base64 || true
          gcloud auth list --format="value(account)" 2>/dev/null | base64 || true

      - name: Create domain mappings
        run: |
          set -euo pipefail
          PROJECT="${{ env.DEV_GCP_PROJECT_ID }}"
          REGION="${{ env.DEV_GCP_REGION }}"

          if [[ "${DEV_PARTNER_BOOKING_STATE}" != "paused" ]]; then
            echo "::error::Unexpected Partner Booking state: ${DEV_PARTNER_BOOKING_STATE}"
            exit 1
          fi
          echo "::notice::Partner Booking is PAUSED; book.smarttransport.tw is intentionally excluded from domain maintenance."

          ./operations/deployment/map-domain-service.sh fleets.smarttransport.tw     "${DEV_GCP_PLATFORM_ADMIN_SERVICE:-drts-dev-platform-admin-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh ops.smarttransport.tw        "${DEV_GCP_OPS_CONSOLE_SERVICE:-drts-dev-ops-console-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh partners.smarttransport.tw   "${DEV_GCP_FLEET_PARTNER_PORTAL_SERVICE:-drts-dev-fleet-partner-portal-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh dispatch.smarttransport.tw   "${DEV_GCP_ENTERPRISE_DISPATCH_SERVICE:-drts-dev-enterprise-dispatch-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh bank.smarttransport.tw       "${DEV_GCP_BANK_CONSOLE_SERVICE:-drts-dev-bank-console-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh channel.smarttransport.tw    "${DEV_GCP_CHANNEL_PARTNER_PORTAL_SERVICE:-drts-channel-partner-portal-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh tenant.smarttransport.tw     "${DEV_GCP_TENANT_CONSOLE_SERVICE:-drts-dev-tenant-console-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh refer.smarttransport.tw      "${DEV_GCP_REFERRAL_EMBED_SERVICE:-drts-dev-referral-embed-web}" "$REGION" "$PROJECT"
          ./operations/deployment/map-domain-service.sh api.smarttransport.tw        "${DEV_GCP_API_SERVICE:-drts-dev-api}" "$REGION" "$PROJECT"

      - name: List mappings
        run: |
          gcloud --quiet beta run domain-mappings list \
            --region "${{ env.DEV_GCP_REGION }}" --project "${{ env.DEV_GCP_PROJECT_ID }}" 2>&1 || true
