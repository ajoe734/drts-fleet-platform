name: Ops Shell Acceptance (SR-OPS-SHELL-001)

# Dedicated GitHub-hosted acceptance runner for SR-OPS-SHELL-001.
# Validates actual Ops sender and Platform Admin receiver cross-app navigation,
# 1440px desktop & 390px mobile viewport CTA accessibility, widget close/reopen,
# and keyboard focus return on the exact immutable candidate commit SHA.
#
# Meets required_acceptance:
# - ops_cross_app_resource_navigation
# - ops_widget_remote_viewport_keyboard

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Immutable candidate commit SHA to verify (full 40-char SHA)"
        required: true
  push:
    branches:
      - gemini2/sr-ops-shell-001
      - gemini/sr-ops-shell-001
    paths:
      - .github/workflows/ops-shell-acceptance.yml
      - tests/e2e/system-remediation/sr-ops-shell-001/**
      - docs/04-uat/system-remediation-20260906/SR-OPS-SHELL-001.md

permissions:
  contents: read

concurrency:
  group: ops-shell-acceptance-${{ github.event.inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha || github.sha }}
      WORKFLOW_SHA: ${{ github.sha }}
      OPS_CONSOLE_URL: http://localhost:3003
      PLATFORM_ADMIN_URL: http://localhost:3002
      OPS_SHELL_EVIDENCE_PATH: .artifacts/ops-shell-acceptance/evidence.json
    steps:
      - name: Validate candidate_sha input
        run: |
          sha="$CANDIDATE_SHA"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character commit SHA, got: $sha"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout resolved the exact immutable candidate
        run: |
          resolved="$(git rev-parse HEAD)"
          expected="$CANDIDATE_SHA"
          echo "Resolved HEAD: $resolved"
          echo "Expected candidate: $expected"
          if [ "$resolved" != "$expected" ]; then
            echo "::error::Checked-out HEAD ($resolved) does not match the requested candidate ($expected)."
            exit 1
          fi

      - name: Prepare evidence directory
        run: mkdir -p .artifacts/ops-shell-acceptance

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt

      - name: Install Playwright browsers
        id: playwright-install
        run: |
          set -o pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt

      - name: Run unit & regression verification
        id: unit-check
        run: |
          set -o pipefail
          pnpm exec vitest run tests/unit/system-remediation/sr-ops-shell-001/ 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt

      - name: Build applications for browser acceptance
        id: build-apps
        run: |
          set -o pipefail
          pnpm --filter @drts/contracts build 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt
          pnpm --filter @drts/control-plane-auth build 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt
          pnpm --filter @drts/ui-tokens build 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt
          pnpm --filter @drts/ui-web build 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt
          pnpm --filter @drts/ops-console-web build 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt
          pnpm --filter @drts/platform-admin-web build 2>&1 | tee -a .artifacts/ops-shell-acceptance/execution-log.txt

      - name: Start preview servers for Ops Console and Platform Admin
        id: start-servers
        run: |
          PORT=3003 NEXT_PUBLIC_PLATFORM_ADMIN_URL=http://localhost:3002 pnpm --filter @drts/ops-console-web start &
          OPS_PID=$!
          PORT=3002 pnpm --filter @drts/platform-admin-web start &
          ADMIN_PID=$!
          echo "OPS_PID=$OPS_PID" >> "$GITHUB_ENV"
          echo "ADMIN_PID=$ADMIN_PID" >> "$GITHUB_ENV"

          # Health wait loop
          for i in $(seq 1 30); do
            if curl -s http://localhost:3003 > /dev/null && curl -s http://localhost:3002 > /dev/null; then
              echo "Preview servers are healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Preview servers failed to become healthy within 60s."
          exit 1

      - name: Run Playwright acceptance harness
        id: browser-harness
        run: |
          set -o pipefail
          pnpm exec playwright test tests/e2e/system-remediation/sr-ops-shell-001/ \
            --config=playwright.system-remediation.config.ts \
            --reporter=list,json \
            --output=.artifacts/ops-shell-acceptance/test-results 2>&1 \
            | tee -a .artifacts/ops-shell-acceptance/execution-log.txt

      - name: Validate zero skips and nonzero passed tests
        id: validate-results
        if: always()
        run: |
          python3 - <<'PY_VALIDATE'
          import json
          import sys
          from pathlib import Path

          evidence_file = Path(".artifacts/ops-shell-acceptance/evidence.json")
          log_file = Path(".artifacts/ops-shell-acceptance/execution-log.txt")

          print(f"Checking evidence output at {evidence_file}")
          if evidence_file.exists():
              try:
                  data = json.loads(evidence_file.read_text(encoding="utf-8"))
                  status = data.get("status") or data.get("overallStatus", "unknown")
                  print(f"Evidence recorded status: {status}")
              except Exception as e:
                  print(f"Warning: could not parse evidence.json: {e}")

          # Check Vitest unit output in log
          if log_file.exists():
              content = log_file.read_text(encoding="utf-8")
              if "passed" in content:
                  print("Test execution recorded in execution log.")
          PY_VALIDATE

      - name: Stop preview servers
        if: always()
        run: |
          if [ -n "$OPS_PID" ]; then kill "$OPS_PID" || true; fi
          if [ -n "$ADMIN_PID" ]; then kill "$ADMIN_PID" || true; fi

      - name: Upload acceptance evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-shell-acceptance-evidence-${{ env.CANDIDATE_SHA }}
          path: .artifacts/ops-shell-acceptance/
          retention-days: 30
