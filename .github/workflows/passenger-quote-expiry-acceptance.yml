name: Passenger real quote expiry and recovery

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full commit SHA containing the quote-expiry acceptance case"
        required: true
        type: string
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/passenger-quote-expiry-acceptance.yml
      - playwright.pax-real-quote-expiry.config.ts
      - tests/e2e/pax-real-quote-expiry.spec.ts
      - apps/passenger-app-web/components/booking/**
      - packages/passenger-client/src/booking/**
      - apps/api/src/modules/passenger-app/booking/**
      - apps/api/src/modules/passenger-app/fare/**

permissions:
  contents: read

concurrency:
  group: pax-real-quote-expiry-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  CI: true
  PAX_QUOTE_EXPIRY_SOURCE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  real-quote-expiry:
    runs-on: ubuntu-24.04
    # Includes builds plus the unchanged real15minute wait. The original shared
    # journeys retain their12minute test and25minute job envelopes.
    timeout-minutes: 35
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_pax_quote_expiry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_pax_quote_expiry
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Record the actual candidate checkout
        run: |
          test "$(git rev-parse HEAD)" = "$PAX_QUOTE_EXPIRY_SOURCE_SHA"
          mkdir -p .artifacts/pax-real-quote-expiry
          git rev-parse HEAD > .artifacts/pax-real-quote-expiry/actual-checkout-sha.txt
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrate and seed the disposable hosted database
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Build the original API and Passenger application
        run: |
          pnpm --filter @drts/api build
          pnpm --filter @drts/passenger-app-web... build
      - name: Install Chromium in the hosted runner
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname "*google*" -o -iname "*chrome*" \) \
            -exec mv "{}" "{}.disabled" \; || true
          pnpm exec playwright install --with-deps chromium
      - name: Wait for real expiry, reject the old quote, requote and cancel the new order
        run: pnpm exec playwright test -c playwright.pax-real-quote-expiry.config.ts
      - name: Upload the actual quote-expiry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passenger-real-quote-expiry-${{ env.PAX_QUOTE_EXPIRY_SOURCE_SHA }}
          path: .artifacts/pax-real-quote-expiry
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
