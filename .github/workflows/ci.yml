name: CI

# ci-feat — the 3 gates every PR must clear to merge into a protected branch.
# Branch protection on main + dev requires:
#   ① Commit trailers       — commit messages have <TASK-ID>: subject + Task-ID/LLM-Agent/Reviewer trailers
#   ② Runtime mirror guard  — no tools/development-orchestrator/dashboard/ / *-bg.pid / runtime-logs/ etc. in the diff
#   ③ Smoke acceptance      — product smoke for product diffs; scoped pass for internal-tool diffs
#
# See docs/ops/branch-strategy.md §6 for the model.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - "dev"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

# Every job carries timeout-minutes. GitHub's default is six hours, and on
# 2026-08-19 a transient hang in `apt-get install postgresql-client` held
# iam-negative-matrix for three hours and twenty minutes on dev while the
# branch's CI result stayed unknown; the same step had hung three jobs on a PR
# earlier the same day. The limits are three times the longest observed
# successful run, floored at ten minutes, so a slow runner still passes and a
# hang is capped in minutes rather than hours.

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      product: ${{ steps.classify.outputs.product }}
      orchestrator: ${{ steps.classify.outputs.orchestrator }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify scope classifier contract
        run: |
          python3 -m unittest tools/ci/test_classify_change_scope.py
          python3 -m unittest tools/ci/test_check_commit_trailers.py
          python3 -m unittest tools/ci/test_check_test_coverage.py
          python3 -m unittest tools/ci/test_workflow_timeouts.py
          python3 -m unittest tools/ci/test_workflow_unit_partitioning.py
          python3 -m unittest tools/ci/test_delivery_workflow_contract.py
          python3 -m unittest tools/ci/test_unit_partition_coverage.py
          python3 -m unittest tools/ci/test_canonical_consistency.py
          python3 -m unittest tools/ci/test_dependency_security.py
          python3 -m unittest tools/ci/test_dev_artifact_providers.py
          python3 -m unittest tools/ci/test_verify_dev_artifact_backends.py
          python3 -m unittest tools/ci/test_driver_web_acceptance_workflow.py
          python3 -m unittest tools/ci/test_enterprise_search_acceptance_workflow.py
          python3 -m unittest tools/ci/test_enterprise_data_acceptance_workflow.py
          python3 -m unittest discover -s tests/unit/gcp-artifact-activation-20261004 -p 'test_*.py'
          python3 -m unittest discover -s tests/unit/gcp-scanner-cold-readiness-20261007 -p 'test_*.py'
      - name: Verify live mail Python unit tests
        run: python3 -m unittest discover -s tests/unit/system-remediation/sr-live-mail-001 -p 'test_*.py' -v
      - name: Verify live invoice mail Python unit tests
        run: python3 -m unittest discover -s tests/unit/system-remediation/sr-live-invoice-mail-20261007 -p 'test_*.py' -v
      - name: Verify every test file is on a path CI runs
        run: python3 tools/ci/check_test_coverage.py
      - id: classify
        name: Classify product and internal-tool changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/ci/classify_change_scope.py \
            --event-name "$EVENT_NAME" \
            --base-ref "$BASE_REF" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  commit-trailers:
    name: Commit trailers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Determine base ref + auto-publish exception
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${{ github.event.pull_request.base.ref || 'main' }}"
          echo "base=origin/$base" >> "$GITHUB_OUTPUT"
          # Auto-publish PRs collect already-validated commits from a *-dev
          # branch; per-commit trailer validation is redundant + would fail
          # because GitHub's earlier squash-merges stripped trailers from
          # what's now history. Skip the check for those PRs.
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            if gh pr view "$pr" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx 'auto-publish'; then
              echo "::notice::auto-publish PR detected (#$pr); skipping per-commit trailer check."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Validate trailers on every commit in the PR
        if: steps.ctx.outputs.skip != 'true'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}" --quiet
          python3 tools/ci/git/check_commit_trailers.py --base ${{ steps.ctx.outputs.base }} --head HEAD
      - name: Auto-publish bypass acknowledged
        if: steps.ctx.outputs.skip == 'true'
        run: echo "Commit trailers gate bypassed for auto-publish PR. (Trailers were enforced when the source commits entered dev.)"

  repo-classification:
    name: Repo classification
    # ci-integ owns this check on every dev PR (including drafts).
    if: github.event_name != 'pull_request' || github.base_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository file classification
        run: node tools/ci/check-repo-classification.mjs

  spec-source-archive:
    name: Spec source archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify archived source specs are full UTF-8 originals (not derived summaries)
        run: python3 tools/ci/check_spec_source_archive.py

  dependency-security:
    name: Dependency security
    # Ready dev PRs require ci-integ, which runs this same check once.
    # Keep CI's existing checks on drafts and on main/dispatch events.
    if: github.event_name != 'pull_request' || github.base_ref != 'dev' || github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Run dependency security gate
        run: python3 tools/ci/dependency_security.py

  canonical-consistency:
    name: Canonical consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check what this change asserts against what is there
        run: |
          # Diff-scoped: prevents new drift without failing on the debt already
          # in the tree. The repository-wide view runs on a schedule in
          # canonical-consistency-audit.yml.
          base="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch origin "$base" --quiet
          python3 tools/ci/git/check_canonical_consistency.py --ci --base "origin/$base" --head HEAD

  bff-only-imports:
    name: BFF-only imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Enforce BFF-only imports for protected UI surfaces
        run: ./tools/ci/check-bff-only-imports.sh

  verify-internal-key-exceptions:
    name: Verify Internal Key Exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify internal key exception registry and documentation
        run: python3 operations/security/verify-internal-key-exceptions.py

  no-real-institutions:
    name: No real financial-institution identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail if real bank/insurer names or corporate domains appear in deployable source
        run: ./scripts/ci/check-no-real-institutions.sh

  runtime-mirror-guard:
    name: Runtime mirror guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Determine base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            echo "ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate no runtime mirrors in PR diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref || 'main' }}" --quiet
          python3 tools/ci/git/check_staged_generated_files.py --range ${{ steps.base.outputs.ref }} HEAD

  i18n-guard:
    name: i18n guard
    needs: scope
    if: needs.scope.outputs.product == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'dev' || github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run i18n guard
        run: pnpm run i18n:guard

  # CI-BUDGET-F2: lint/typecheck/native-passenger, root `test:unit` (measured
  # 1085s) and the apps/api suite used to run serially inside one 25-minute
  # "product_smoke_acceptance" job. Root unit tests alone left the API suite
  # under 90s of nominal budget before the job's 25m cap cancelled it mid-run.
  # Each stage now has its own job (and, for the two test suites, its own
  # parallel shards with independent budgets); product_smoke_acceptance below
  # is now a cheap coverage+merge aggregate, keeping that required check's
  # name -- which smoke-acceptance depends on -- unchanged.
  product_fast_checks:
    name: Product fast checks (lint/typecheck/native passenger)
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        # ci-integ's required aggregate owns lint/typecheck on ready dev PRs.
        if: github.event_name != 'pull_request' || github.base_ref != 'dev' || github.event.pull_request.draft
        run: pnpm run lint
      - name: Reject cross-app relative imports
        run: node tools/ci/check-cross-app-imports.mjs

      - name: Verify Passenger Client Portability & Export
        run: |
          pnpm --filter @drts/passenger-client run build
          test -f packages/passenger-client/dist/index.d.ts

          # Static portability check for DOM/Node/Next
          echo "Checking passenger-client portability..."
          if grep -qR -E "from ['\"](next|react|fs|path|os|events|crypto|child_process)" packages/passenger-client/src; then
            echo "Failed portability check: contains restricted Node/Next imports"
            exit 1
          fi
          if grep -qR -E "(window\.|document\.)" packages/passenger-client/src; then
            echo "Failed portability check: contains DOM globals"
            exit 1
          fi

      - name: Typecheck
        if: github.event_name != 'pull_request' || github.base_ref != 'dev' || github.event.pull_request.draft
        run: pnpm run typecheck
      - name: Native passenger App typecheck and unit tests
        run: |
          pnpm --filter @drts/passenger-app typecheck
          pnpm --filter @drts/passenger-app test --reporter=default --reporter=json --outputFile.json=native-passenger-app-test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-fast-checks-native-passenger-${{ github.run_id }}
          path: apps/passenger-app/native-passenger-app-test-results.json
          if-no-files-found: warn
          retention-days: 7

  product_root_unit:
    name: Product root unit tests (shard ${{ matrix.shard }}/4)
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PARTNER_NOTIFY_SEQ_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_TRANSPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_UI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PASSENGER_PUSH_CHANNEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PASSENGER_APP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      UV_RECORDER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Unit tests (shard ${{ matrix.shard }}/4)
        # Deliberately does not set DRTS_DEV_MFA_WAIVED: tests/unit/** includes
        # the ENTRY-IAP-WORKFORCE-AUTH-20261005 tests that pin the no-waiver
        # deny-by-default baseline (tests/unit/step-up-iap-path.test.ts,
        # tests/unit/system-remediation/sr-qa-identity-001/c003-c004-c005-*);
        # enabling the waiver here would make them pass for the wrong reason.
        run: |
          pnpm exec vitest run \
            --exclude tests/integration/unattended-voice-postgres.integration.test.ts \
            --exclude "tests/integration/system-remediation/sr-leave-be-001/**" \
            --exclude tests/e2e/system-remediation/sr-host-fe-001/host-api-sql-acceptance.test.ts \
            --shard=${{ matrix.shard }}/4 \
            --reporter=default --reporter=json \
            --outputFile.json=unit-test-results-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-root-unit-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: unit-test-results-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  product_api_unit:
    name: Product API unit tests (shard ${{ matrix.shard }}/2)
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: drts_fleet_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PARTNER_NOTIFY_SEQ_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_TRANSPORT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PARTNER_NOTIFY_UI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PASSENGER_PUSH_CHANNEL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      PASSENGER_APP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      UV_RECORDER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drts_fleet_platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0, run_install: false }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 22,
            cache: pnpm,
            cache-dependency-path: pnpm-lock.yaml,
          }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: API unit tests (shard ${{ matrix.shard }}/2)
        # The root `test:unit` only covers tests/unit/**; the apps/api package
        # also owns package-local tests, including DB-backed regressions that
        # must run against the migrated schema to match ci-integ coverage.
        # Each shard has its own fresh database above, but files within one
        # shard still share it: running them concurrently lets another test's
        # background outbox consumer claim the Stage1 gate's rows, changing
        # its replay snapshot or consuming its delivery without a sink. Keep
        # every test and assertion, but serialize access to each shard's DB.
        #
        # This step (only) runs as a non-strict (CI/"test") auth environment
        # that needs the explicit, audited DRTS_DEV_MFA_WAIVED dev waiver
        # (ENTRY-IAP-WORKFORCE-AUTH-20261005): the bootstrap dev fixture no
        # longer fabricates verified_iap_workforce/aal2, so apps/api's own
        # DB-backed tests exercising platform_admin/ops_user privileged
        # actions need it. isDevWorkforceMfaWaiverEnabled rejects the flag
        # outright in staging/production regardless of this value.
        env:
          DRTS_DEV_MFA_WAIVED: "true"
        run: |
          pnpm --filter @drts/api exec vitest run --passWithNoTests \
            --shard=${{ matrix.shard }}/2 \
            --no-file-parallelism --maxConcurrency=1 \
            --reporter=default --reporter=json \
            --outputFile.json=api-test-results-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-api-unit-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: apps/api/api-test-results-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  # Verifies the root-unit and API-unit shards above each covered their exact
  # file set with no gaps/duplicates, merges every shard into the same
  # single-report shape the existing postgres-gate verifiers already expect
  # (unchanged below), and runs those unchanged verifiers plus the voice
  # checkpoint gate exactly as the old monolithic job did.
  product_smoke_acceptance:
    name: Product smoke acceptance
    needs: [scope, product_fast_checks, product_root_unit, product_api_unit]
    if: needs.scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Require every upstream stage to have actually succeeded
        run: |
          [ '${{ needs.product_fast_checks.result }}' = 'success' ] || { echo "product_fast_checks: ${{ needs.product_fast_checks.result }}"; exit 1; }
          [ '${{ needs.product_root_unit.result }}' = 'success' ] || { echo "product_root_unit: ${{ needs.product_root_unit.result }}"; exit 1; }
          [ '${{ needs.product_api_unit.result }}' = 'success' ] || { echo "product_api_unit: ${{ needs.product_api_unit.result }}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: product-root-unit-shard-*-${{ github.run_id }}
          path: product-root-unit-shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: product-api-unit-shard-*-${{ github.run_id }}
          path: product-api-unit-shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: product-fast-checks-native-passenger-${{ github.run_id }}
          path: apps/passenger-app
      - name: Verify root unit shard partition coverage and merge reports
        run: |
          python3 tools/ci/verify_unit_partition_coverage.py \
            --root . \
            --include "tests/contract/**/*.test.ts" \
            --include "tests/integ/**/*.test.ts" \
            --include "tests/unit/**/*.test.ts" \
            --include "tests/unit/**/*.test.tsx" \
            --include "tests/integration/**/*.test.ts" \
            --include "tests/security/**/*.test.ts" \
            --include "tests/load/**/*.test.ts" \
            --include "tests/e2e/**/*.test.ts" \
            --exclude tests/integration/unattended-voice-postgres.integration.test.ts \
            --exclude "tests/integration/system-remediation/sr-leave-be-001/**" \
            --exclude tests/e2e/system-remediation/sr-host-fe-001/host-api-sql-acceptance.test.ts \
            --shard-report product-root-unit-shards/unit-test-results-shard-1.json \
            --shard-report product-root-unit-shards/unit-test-results-shard-2.json \
            --shard-report product-root-unit-shards/unit-test-results-shard-3.json \
            --shard-report product-root-unit-shards/unit-test-results-shard-4.json \
            --merged-output unit-test-results.json
      - name: Verify API unit shard partition coverage and merge reports
        run: |
          python3 tools/ci/verify_unit_partition_coverage.py \
            --root apps/api \
            --include "**/*.test.ts" \
            --shard-report product-api-unit-shards/api-test-results-shard-1.json \
            --shard-report product-api-unit-shards/api-test-results-shard-2.json \
            --merged-output apps/api/api-test-results.json
      - name: Verify partner notification PostgreSQL gate (root + API)
        run: python3 tools/ci/verify_partner_notification_postgres_gate.py unit-test-results.json apps/api/api-test-results.json
      - name: Verify passenger App PostgreSQL and HTTP test counts
        run: |
          python3 -m unittest tools/ci/test_passenger_app_postgres_gate.py
          python3 tools/ci/verify_passenger_app_postgres_gate.py unit-test-results.json
      - name: Verify passenger push PostgreSQL and regression gates
        run: |
          python3 -m unittest tools/ci/test_partner_notification_postgres_gate.py
          python3 tools/ci/verify_passenger_push_channel_postgres_gate.py unit-test-results.json
      - name: Verify voice checkpoint PostgreSQL gate (four cases, zero skips)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          path = "tests/integration/uv-exec-010-checkpoint.integration.test.ts"
          group = "UV-EXEC-010 PostgreSQL checkpoint journal"
          expected = {
              group + " " + title for title in (
                  "concurrent retries converge on one immutable row across connections",
                  "conflicting evidence/policy cannot overwrite the established version",
                  "rollback leaves no checkpoint and allows a fresh verified append",
                  "database triggers reject update, delete and truncate",
              )
          }
          try:
              report = json.loads(Path("unit-test-results.json").read_text())
          except (OSError, ValueError) as error:
              sys.exit(f"Voice checkpoint gate: cannot read report: {error}")
          if not isinstance(report, dict) or not isinstance(report.get("testResults"), list):
              sys.exit("Voice checkpoint gate: missing testResults array")
          matches = [
              suite for suite in report["testResults"]
              if isinstance(suite, dict) and isinstance(suite.get("name"), str)
              and (suite["name"].replace("\\", "/") == path
                   or suite["name"].replace("\\", "/").endswith("/" + path))
          ]
          if len(matches) != 1:
              sys.exit(f"Voice checkpoint gate: expected one exact suite, got {len(matches)}")
          suite = matches[0]
          if suite.get("status") != "passed" or suite.get("message") or suite.get("failureMessage"):
              sys.exit("Voice checkpoint gate: suite/hook did not pass")
          cases = suite.get("assertionResults")
          if not isinstance(cases, list) or len(cases) != 4:
              sys.exit("Voice checkpoint gate: expected exactly four cases")
          if any(not isinstance(case, dict) or case.get("status") != "passed"
                 or case.get("failureMessages") for case in cases):
              sys.exit("Voice checkpoint gate: failed, pending, skipped, todo or missing case status")
          names = [case.get("fullName") for case in cases]
          if any(not isinstance(name, str) for name in names) or set(names) != expected:
              sys.exit("Voice checkpoint gate: missing, duplicate or unexpected case identity")
          print("Voice checkpoint PostgreSQL gate: four passed, zero skipped/pending/failed/todo.")
          PY
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            unit-test-results.json
            apps/api/api-test-results.json
            apps/passenger-app/native-passenger-app-test-results.json

  smoke-acceptance:
    name: Smoke acceptance
    needs: [scope, product_smoke_acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate scoped smoke gate
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PRODUCT_REQUIRED: ${{ needs.scope.outputs.product }}
          PRODUCT_SMOKE_RESULT: ${{ needs.product_smoke_acceptance.result }}
        run: |
          [ "$SCOPE_RESULT" = "success" ] || { echo "Change scope classification failed"; exit 1; }
          if [ "$PRODUCT_REQUIRED" = "true" ]; then
            [ "$PRODUCT_SMOKE_RESULT" = "success" ] || { echo "Product smoke failed: $PRODUCT_SMOKE_RESULT"; exit 1; }
            echo "Product smoke acceptance passed."
          else
            [ "$PRODUCT_SMOKE_RESULT" = "skipped" ] || { echo "Unexpected product smoke result: $PRODUCT_SMOKE_RESULT"; exit 1; }
            echo "Product smoke is not applicable to scope '${{ needs.scope.outputs.scope }}'."
          fi
