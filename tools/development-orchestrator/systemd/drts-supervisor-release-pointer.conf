# Preserve the release pointer even if a legacy installer overwrites the main
# unit. A release must be selected through release-lifecycle.py first.
[Service]
WorkingDirectory=@STATUS_ROOT@
Environment=ORCH_STATUS_ROOT=@STATUS_ROOT@
Environment=AI_STATUS_ROOT=@STATUS_ROOT@
ExecStart=
ExecStart=/usr/bin/env bash @STATUS_ROOT@/.artifacts/releases/current/tools/development-orchestrator/bin/run-supervisor.sh --config @STATUS_ROOT@/.orchestrator/config.json --verbose
