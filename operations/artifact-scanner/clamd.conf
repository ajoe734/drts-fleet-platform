# Bounded, loopback-only clamd configuration for the Cloud Run sidecar.
#
# TCPAddr is 127.0.0.1 on purpose: this socket must only ever be reachable
# by the gateway container sharing this Cloud Run instance's network
# namespace, never from outside it. No LocalSocket is configured, so this
# is the only listener clamd exposes.
# Foreground yes below keeps logs on inherited output. Do not set LogFile
# to /dev/stdout (or another descriptor symlink): clamd opens it with
# O_NOFOLLOW and aborts logger initialization with ELOOP.
LogTime yes
LogVerbose no
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav

# freshclam.c ignores a failed notify() to clamd after a genuine database
# update, so a successful download can silently never reach the running
# engine. This bounds clamd's own independent database-directory check well
# inside the gateway's MAX_SIGNATURE_AGE_MS (6h, see gateway/server.ts), so
# a real signature update still reaches the loaded engine even if the
# notify() handoff is lost (R8, round 2).
SelfCheck 1800

TCPSocket 3310
TCPAddr 127.0.0.1
MaxConnectionQueueLength 10
MaxThreads 4

# Mirrors the gateway's own 10 MiB proof bound (MAX_PROOF_BYTES in
# gateway/clamd-protocol.ts) and keeps archive/recursion/time bounded so a
# single request can never hold the one allowed instance indefinitely.
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 10M
MaxRecursion 5
MaxFiles 1000
ReadTimeout 60
CommandReadTimeout 5
SendBufTimeout 5000

# AlertExceedsMax defaults to "no", which makes clamd silently skip
# scanning (and report OK) once compressed/embedded content exceeds the
# bounds above -- an allowed <=10 MiB request could then come back
# "clean" without ever being fully scanned. "yes" makes an exceeded limit
# a definitive FOUND ("Heuristics.Limits.Exceeded"), which
# gateway/clamd-protocol.ts's parseInstreamReply already treats as a
# fail-closed "infected" verdict, never a fabricated "clean".
AlertExceedsMax yes

ExitOnOOM yes
Foreground yes
User clamav
