# Bounded, loopback-only clamd configuration for the Cloud Run sidecar.
#
# TCPAddr is 127.0.0.1 on purpose: this socket must only ever be reachable
# by the gateway container sharing this Cloud Run instance's network
# namespace, never from outside it. No LocalSocket is configured, so this
# is the only listener clamd exposes.
LogFile /dev/stdout
LogFileUnlock yes
LogTime yes
LogVerbose no
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav

TCPSocket 3310
TCPAddr 127.0.0.1
MaxConnectionQueueLength 10
MaxThreads 4

# Mirrors the gateway's own 10 MiB proof bound (MAX_PROOF_BYTES in
# gateway/clamd-protocol.ts) and keeps archive/recursion/time bounded so a
# single request can never hold the one allowed instance indefinitely.
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 10M
MaxRecursion 5
MaxFiles 1000
ReadTimeout 60
CommandReadTimeout 5
SendBufTimeout 5000

ExitOnOOM yes
Foreground yes
User clamav
