<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>ROC Console · FSD Sandbox · DRTS</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Inter", "Noto Sans TC", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#08323F"/>
  <circle cx="50" cy="44" r="20" fill="none" stroke="#67E8F9" stroke-width="3"/>
  <circle cx="50" cy="44" r="5" fill="#67E8F9"/>
  <path d="M50 24v-8M50 64v8M30 44h-8M70 44h8" stroke="#67E8F9" stroke-width="3"/>
  <rect x="30" y="78" width="40" height="4" rx="2" fill="#0E7490"/>
</svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="macos-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mgmt-tokens.jsx"></script>
<script type="text/babel" src="mgmt-primitives.jsx"></script>
<script type="text/babel" src="mgmt-shell.jsx"></script>
<script type="text/babel" src="mgmt-auth.jsx"></script>
<script type="text/babel" src="roc-data.jsx"></script>
<script type="text/babel" src="roc-screens-1.jsx"></script>
<script type="text/babel" src="roc-screens-2.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true,
  "density": "compact"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const th = buildMgmtTheme({ console: 'roc', dark: tw.dark, density: tw.density });
  const W = 1440, H = 900;
  const Frame = ({ children, chrome, url }) => chrome
    ? <MacWindow title="ROC Console · FSD Sandbox" url={'https://roc.drts.com.tw' + (url || '')} variant={tw.dark ? 'dark' : 'light'} width={W} height={H}>{children}</MacWindow>
    : <div style={{ width: W, height: H, background: th.bg, borderRadius: 10, overflow: 'hidden', border: '1px solid ' + th.border }}>{children}</div>;
  const Hero = ({ url, children }) => <Frame chrome url={url}>{children}</Frame>;
  const Bare = ({ children }) => <Frame>{children}</Frame>;

  return (
    <>
      <DesignCanvas projectName="ROC Console · FSD 沙盒遠端監控中心"
        subtitle="Phase 2 A1 · roc-console-web · 12 screens · 監看唯讀 · 無遠端駕駛 · 雙鮮度分離 · 三欄真相 · 證據來源標記 · zh-TW / en">

        <DCSection id="monitoring" title="01 · 監控 Monitoring" subtitle="總覽 / 即時看板 / 行程 · telemetry 與 監理事件鮮度分離">
          <DCArtboard id="overview" label="總覽 · Overview" width={W} height={H}><Hero url="/"><ROC_Overview theme={th} /></Hero></DCArtboard>
          <DCArtboard id="liveboard" label="即時看板 · Live Board · 核准路線 overlay" width={W} height={H}><Hero url="/live"><ROC_LiveBoard theme={th} /></Hero></DCArtboard>
          <DCArtboard id="trips" label="行程 · Trips" width={W} height={H}><Bare><ROC_Trips theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="fleet" title="02 · 車輛 Fleet" subtitle="Tesla 整合狀態 · 不顯示方向盤/感知/RSU · 無遠端駕駛">
          <DCArtboard id="vehicles" label="車輛 · Vehicles" width={W} height={H}><Hero url="/vehicles"><ROC_Vehicles theme={th} /></Hero></DCArtboard>
          <DCArtboard id="vehicle-detail" label="車輛詳情 · 遠端駕駛永遠停用" width={W} height={H}><Bare><ROC_VehicleDetail theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="response" title="03 · 處置 Response" subtitle="接管佇列三欄並列 / 警示 / 事故 / 證據">
          <DCArtboard id="takeover" label="接管佇列 · 三欄真相（Tesla/安全員/ROC 不合併）" width={W} height={H}><Hero url="/takeover"><ROC_Takeover theme={th} /></Hero></DCArtboard>
          <DCArtboard id="alerts" label="警示 · Alerts" width={W} height={H}><Bare><ROC_Alerts theme={th} /></Bare></DCArtboard>
          <DCArtboard id="incidents" label="事故 · Incidents · policy 通報時限" width={W} height={H}><Bare><ROC_Incidents theme={th} /></Bare></DCArtboard>
          <DCArtboard id="evidence" label="證據 · Evidence · 來源標記 + 原廠未提供" width={W} height={H}><Bare><ROC_Evidence theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="regulatory" title="04 · 監理 Regulatory" subtitle="供應商健康 / 監理報表 / 交班">
          <DCArtboard id="provider" label="供應商健康 · Provider Health" width={W} height={H}><Hero url="/provider-health"><ROC_Provider theme={th} /></Hero></DCArtboard>
          <DCArtboard id="reports" label="監理報表 · Regulatory Reports" width={W} height={H}><Bare><ROC_Reports theme={th} /></Bare></DCArtboard>
          <DCArtboard id="handover" label="交班 · Shift Handover" width={W} height={H}><Bare><ROC_Handover theme={th} /></Bare></DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakToggle label="深色模式" value={tw.dark} onChange={v => setTweak('dark', v)} />
          <TweakRadio label="密度" value={tw.density} onChange={v => setTweak('density', v)} options={[{ value: 'compact', label: 'Compact' }, { value: 'comfy', label: 'Comfy' }]} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
