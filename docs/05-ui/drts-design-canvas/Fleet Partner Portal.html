<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Fleet Partner Portal · 智慧運輸科技</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: "Inter", "Noto Sans TC", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#052E22"/>
  <rect x="14" y="22" width="72" height="56" rx="6" fill="#FFFFFF" stroke="#047857" stroke-width="2"/>
  <rect x="20" y="30" width="14" height="40" rx="2" fill="#ECFDF5"/>
  <rect x="40" y="32" width="38" height="3" rx="1.5" fill="#047857"/>
  <rect x="40" y="40" width="22" height="2.5" rx="1" fill="#6EE7B7"/>
  <rect x="40" y="48" width="38" height="20" rx="2" fill="#ECFDF5"/>
</svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="macos-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mgmt-tokens.jsx"></script>
<script type="text/babel" src="mgmt-primitives.jsx"></script>
<script type="text/babel" src="mgmt-shell.jsx"></script>
<script type="text/babel" src="mgmt-auth.jsx"></script>
<script type="text/babel" src="mgmt-data.jsx"></script>
<script type="text/babel" src="fleet-data.jsx"></script>
<script type="text/babel" src="fleet-screens.jsx"></script>
<script type="text/babel" src="fleet-cases.jsx"></script>
<script type="text/babel" src="fleet-host.jsx"></script>
<script type="text/babel" src="fleet-referral.jsx"></script>
<script type="text/babel" src="fleet-supply.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "density": "compact"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const th = buildMgmtTheme({ console: 'fleet', dark: tw.dark, density: tw.density });
  const W = 1440, H = 900;
  const Frame = ({ children, chrome, url }) => chrome
    ? <MacWindow title="Fleet Partner Portal · 智慧運輸科技" url={'https://fleet.smarttransport.tw' + (url || '')} variant={tw.dark ? 'dark' : 'light'} width={W} height={H}>{children}</MacWindow>
    : <div style={{ width: W, height: H, background: th.bg, borderRadius: 10, overflow: 'hidden', border: '1px solid ' + th.border }}>{children}</div>;
  const Hero = ({ url, children }) => <Frame chrome url={url}>{children}</Frame>;
  const Bare = ({ children }) => <Frame>{children}</Frame>;

  return (
    <>
      <DesignCanvas projectName="Fleet Partner Portal" subtitle="車行 / 車隊合作後台 · 大都會車隊範例 · 10 routes + 渠道分潤 · spec Part E + CRC 群組 B" accent="#047857">
        <DCSection id="workspace" title="01 · Workspace">
          <DCArtboard id="dashboard" label="營運總覽 / Dashboard" width={W} height={H}><Hero url="/dashboard"><FLP_Dashboard theme={th} /></Hero></DCArtboard>
        </DCSection>

        <DCSection id="supply" title="02 · 供給管理 · service-product aware">
          <DCArtboard id="drivers" label="司機 / Drivers · 服務資格" width={W} height={H}><Hero url="/drivers"><FLP_Drivers theme={th} /></Hero></DCArtboard>
          <DCArtboard id="vehicles" label="車輛 / Vehicles · 車型資格" width={W} height={H}><Bare><FLP_Vehicles theme={th} /></Bare></DCArtboard>
          <DCArtboard id="trips" label="趟次 / Trips · 含分潤" width={W} height={H}><Bare><FLP_Trips theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="supply-write" title="02b · 供給自主建檔 write-flow · Packet 1" subtitle="submission (draft) → 送審 → 平台核可寫入 canonical · fleet-scoped">
          <DCArtboard id="supply-dash" label="§5.1 · 送件總覽 /supply · 6 分組 (VQ-6)" width={W} height={H}><Hero url="/supply"><FLP_SupplyDashboard theme={th} /></Hero></DCArtboard>
          <DCArtboard id="driver-draft" label="§5.2 · 新增司機 draft · wizard (VQ-1)" width={W} height={H}><Bare><FLP_DriverDraft theme={th} /></Bare></DCArtboard>
          <DCArtboard id="vehicle-draft" label="§5.3 · 新增車輛 draft" width={W} height={H}><Bare><FLP_VehicleDraft theme={th} /></Bare></DCArtboard>
          <DCArtboard id="supply-docs" label="§5.4 · 文件 /documents · pre-signed (VQ-4)" width={W} height={H}><Hero url="/documents"><FLP_SupplyDocuments theme={th} /></Hero></DCArtboard>
          <DCArtboard id="submissions" label="§5.5 · 送件紀錄 /supply/submissions" width={W} height={H}><Bare><FLP_Submissions theme={th} /></Bare></DCArtboard>
          <DCArtboard id="submission-detail" label="§5.6 · 送件詳情 · diff + revision (VQ-2/5)" width={W} height={H}><Bare><FLP_SubmissionDetail theme={th} /></Bare></DCArtboard>
          <DCArtboard id="submission-approved" label="§5.6 · 詳情 · approved 不可編輯" width={W} height={H}><Bare><FLP_SubmissionDetail theme={th} variant="approved" /></Bare></DCArtboard>
          <DCArtboard id="supply-errors" label="§7 · 錯誤 / edge states" width={W} height={H}><Bare><FLP_SupplyErrors theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="revenue" title="03 · 分潤 Revenue Share">
          <DCArtboard id="revenue" label="分潤總覽 · 組成明細" width={W} height={H}><Hero url="/revenue"><FLP_Revenue theme={th} /></Hero></DCArtboard>
          <DCArtboard id="statements" label="對帳單 / Statements" width={W} height={H}><Bare><FLP_Statements theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="quality" title="04 · 品質與責任 Quality & Responsibility">
          <DCArtboard id="documents" label="文件 / Documents · owner 區分" width={W} height={H}><Hero url="/documents"><FLP_Documents theme={th} /></Hero></DCArtboard>
          <DCArtboard id="training" label="訓練 / Training · 完成率" width={W} height={H}><Bare><FLP_Training theme={th} /></Bare></DCArtboard>
          <DCArtboard id="cases" label="事故 / 申訴 · 責任歸屬" width={W} height={H}><Bare><FLP_Cases theme={th} /></Bare></DCArtboard>
          <DCArtboard id="case-detail-open" label="R12 · 案件詳情 · 回覆 / 附件 / 歷程 · SLA breached" width={W} height={H}><Bare><FLP_CaseDetail theme={th} variant="open" /></Bare></DCArtboard>
          <DCArtboard id="case-detail-submitting" label="R12 · 案件詳情 · 回覆送出中" width={W} height={H}><Bare><FLP_CaseDetail theme={th} variant="open" replyState="submitting" /></Bare></DCArtboard>
          <DCArtboard id="case-detail-reply-failed" label="R12 · 案件詳情 · 回覆送出失敗 · 可重試" width={W} height={H}><Bare><FLP_CaseDetail theme={th} variant="open" replyState="failed" /></Bare></DCArtboard>
          <DCArtboard id="case-detail-reply-sent" label="R12 · 案件詳情 · 回覆已送出" width={W} height={H}><Bare><FLP_CaseDetail theme={th} variant="open" replyState="sent" /></Bare></DCArtboard>
          <DCArtboard id="case-detail-closed" label="R12 · 案件詳情 · closed · 回覆停用 / 附件唯讀" width={W} height={H}><Bare><FLP_CaseDetail theme={th} variant="closed" /></Bare></DCArtboard>
          <DCArtboard id="case-detail-platform" label="R12 · 案件詳情 · platform 責任 · 唯讀可見（不隱藏）" width={W} height={H}><Bare><FLP_CaseDetail theme={th} variant="platform" /></Bare></DCArtboard>
          <DCArtboard id="case-access-states" label="R12 · 附件 / 歷程 · 讀取狀態（無權限 / 不存在 / 讀取失敗 / 空歷程）" width={W} height={H}><Bare><FLP_CaseAccessStates theme={th} /></Bare></DCArtboard>
          <DCArtboard id="case-errors" label="R12 · 案件指令錯誤 / edge states" width={W} height={H}><Bare><FLP_CaseErrors theme={th} /></Bare></DCArtboard>
          <DCArtboard id="quality" label="品質指標 / Quality Metrics" width={W} height={H}><Bare><FLP_Quality theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="host" title="06 · 車主 Host 自車受限唯讀入口 · N03 / C012" subtitle="individual_owner realm partner · 嚴格唯讀，無新增/編輯/派工入口 · 與上方 flp_admin 是不同 actor">
          <DCArtboard id="host-vehicles" label="N03 · 自有車輛列表" width={W} height={H}><Hero url="/host/vehicles"><FLP_HostVehicles theme={th} /></Hero></DCArtboard>
          <DCArtboard id="host-vehicles-loading" label="N03 · 自有車輛列表 · 載入中" width={W} height={H}><Bare><FLP_HostVehicles theme={th} state="loading" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicles-empty" label="N03 · 自有車輛列表 · 名下無車" width={W} height={H}><Bare><FLP_HostVehicles theme={th} state="empty" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicles-no-results" label="N03 · 自有車輛列表 · 篩選無結果" width={W} height={H}><Bare><FLP_HostVehicles theme={th} state="no_results" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-earnings" label="N03 · 自車詳情 · 收益 · pending_policy" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="earnings" earningsVariant="pending_policy" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-earnings-zero" label="N03 · 自車詳情 · 收益 · 零營收（合法零值）" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="earnings" earningsVariant="zero" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-earnings-no-record" label="N03 · 自車詳情 · 收益 · 該月尚無紀錄" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="earnings" earningsVariant="no_record" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-maintenance" label="N03 · 自車詳情 · 維保" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="maintenance" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-trips" label="N03 · 自車詳情 · 行程（去識別化）" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="trips" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-cases" label="N03 · 自車詳情 · 案件（去識別化 / 唯讀）" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="cases" /></Bare></DCArtboard>
          <DCArtboard id="host-vehicle-switching" label="N03 · 自車詳情 · 切換車輛中（防舊車資料殘留）" width={W} height={H}><Bare><FLP_HostVehicleDetail theme={th} tab="earnings" switching /></Bare></DCArtboard>
          <DCArtboard id="host-access-states" label="N03 · 存取 / 讀取狀態（401/403/404 防探測/讀取失敗/405）" width={W} height={H}><Bare><FLP_HostAccessStates theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="referral" title="05 · 渠道分潤 Channel Partner Portal · CRC 群組 B" subtitle="物業 App 渠道夥伴看自家數字 · 金流 DRTS → 夥伴（應收分潤）· 同一 portal realm">
          <DCArtboard id="ref-dashboard" label="B1 · 渠道總覽 Dashboard" width={W} height={H}><Hero url="/referral/dashboard"><FLP_RefDashboard theme={th} /></Hero></DCArtboard>
          <DCArtboard id="ref-usage" label="B2 · 用量明細 Usage · 去識別下探" width={W} height={H}><Bare><FLP_RefUsage theme={th} /></Bare></DCArtboard>
          <DCArtboard id="ref-statements" label="B3 · 分潤對帳單 · 列表" width={W} height={H}><Bare><FLP_RefStatements theme={th} /></Bare></DCArtboard>
          <DCArtboard id="ref-statement-detail" label="B3 · 分潤對帳單 · 明細 + artifact" width={W} height={H}><Bare><FLP_RefStatementDetail theme={th} /></Bare></DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakToggle label="深色模式" value={tw.dark} onChange={v => setTweak('dark', v)} />
          <TweakRadio label="密度" value={tw.density} onChange={v => setTweak('density', v)} options={[{ value: 'compact', label: 'Compact' }, { value: 'comfy', label: 'Comfy' }]} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
