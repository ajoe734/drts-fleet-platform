<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true,
  "density": "compact"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const th = buildMgmtTheme({ console: 'bank', dark: tw.dark, density: tw.density });
  const W = 1440, H = 900;
  const Frame = ({ children, chrome, url }) => chrome
    ? <MacWindow title="Bank Console · CTBC" url={'https://console.ride.ctbc.com.tw' + (url || '')} variant={tw.dark ? 'dark' : 'light'} width={W} height={H}>{children}</MacWindow>
    : <div style={{ width: W, height: H, background: th.bg, borderRadius: 10, overflow: 'hidden', border: '1px solid ' + th.border }}>{children}</div>;
  const Hero = ({ url, children }) => <Frame chrome url={url}>{children}</Frame>;
  const Bare = ({ children }) => <Frame>{children}</Frame>;

  return (
    <>
      <DesignCanvas projectName="Bank Console" subtitle="發卡行方案監管台 · 中國信託 CTBC · bank-console-web · 8 screens · 唯讀 · 參照遮罩 · zh-TW / en">
        <DCSection id="overview" title="01 · 首頁總覽" subtitle="role-cut：管理員全部 · 營運→訂單+例外 · 財務→結算卡">
          <DCArtboard id="home-admin" label="首頁 · 方案管理員 (全部)" width={W} height={H}><Hero url="/"><BK_Home theme={th} role="admin" /></Hero></DCArtboard>
          <DCArtboard id="home-ops" label="首頁 · 營運檢視 (訂單+例外)" width={W} height={H}><Bare><BK_Home theme={th} role="ops" /></Bare></DCArtboard>
          <DCArtboard id="home-finance" label="首頁 · 財務 (結算卡)" width={W} height={H}><Bare><BK_Home theme={th} role="finance" /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="bookings" title="02 · 訂單" subtitle="唯讀 · 不可從銀行端動派遣 (DRTS 權威) · 卡友/權益參照遮罩">
          <DCArtboard id="bookings" label="訂單列表 · /bookings" width={W} height={H}><Hero url="/bookings"><BK_Bookings theme={th} /></Hero></DCArtboard>
          <DCArtboard id="booking-detail" label="訂單詳情 · /bookings/[id]" width={W} height={H}><Bare><BK_BookingDetail theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="contracts" title="03 · 合約與 SLA" subtitle="對銀行唯讀 · DRTS 經 Ops /contracts 持有權威">
          <DCArtboard id="contracts" label="合約列表 · /contracts" width={W} height={H}><Hero url="/contracts"><BK_Contracts theme={th} /></Hero></DCArtboard>
          <DCArtboard id="contract-detail" label="合約詳情 · 警示 + 例外清單" width={W} height={H}><Bare><BK_ContractDetail theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="statements" title="04 · 對帳單" subtitle="逐趟對帳 · 金流＝發卡行付 DRTS · 有別於企業發票">
          <DCArtboard id="statements" label="對帳單列表 · /statements" width={W} height={H}><Hero url="/statements"><BK_Statements theme={th} /></Hero></DCArtboard>
          <DCArtboard id="statement-detail" label="逐趟明細 · /statements/[period]" width={W} height={H}><Bare><BK_StatementDetail theme={th} /></Bare></DCArtboard>
        </DCSection>

        <DCSection id="programs" title="05 · 方案與配額" subtitle="配額為發卡行頭號指標 · 清楚無歧義">
          <DCArtboard id="programs" label="方案與配額 · /programs" width={W} height={H}><Hero url="/programs"><BK_Programs theme={th} /></Hero></DCArtboard>
        </DCSection>

        <DCSection id="access" title="06 · 人員與稽核" subtitle="scoped to issuer tenant · 全程稽核 · cross-actor">
          <DCArtboard id="users" label="人員與角色 · /users" width={W} height={H}><Hero url="/users"><BK_Users theme={th} /></Hero></DCArtboard>
          <DCArtboard id="audit" label="稽核 · /audit · cross-actor 遮罩" width={W} height={H}><Hero url="/audit"><BK_Audit theme={th} /></Hero></DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakToggle label="深色模式" value={tw.dark} onChange={v => setTweak('dark', v)} />
          <TweakRadio label="密度" value={tw.density} onChange={v => setTweak('density', v)} options={[{ value: 'compact', label: 'Compact' }, { value: 'comfy', label: 'Comfy' }]} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
(async () => {
  // Prepend so page-supplied @page / break rules (deck-stage's margin:0,
  // author CSS) keep source-order precedence over the baseline.
  const baseCss = document.createElement('style');
  baseCss.textContent = "@media print {\n  @page { margin: 0.5cm; }\n  html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }\n  section, article, figure, table { break-inside: avoid; }\n  *, *::before, *::after {\n    animation-delay: -99s !important; animation-duration: .001s !important;\n    animation-iteration-count: 1 !important; animation-fill-mode: both !important;\n    animation-play-state: running !important; transition-duration: 0s !important;\n  }\n}";
  document.head.prepend(baseCss);
  if (document.readyState === 'loading') {
    await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
  }
  let ds = document.querySelector('deck-stage');
  // whenDefined never resolves when nothing registers the element, so only
  // await it when a <deck-stage> tag exists (and race a timeout regardless).
  if (ds && !customElements.get('deck-stage')) {
    try {
      await Promise.race([
        customElements.whenDefined('deck-stage'),
        new Promise((r) => setTimeout(r, 3000)),
      ]);
    } catch (e) {}
    ds = document.querySelector('deck-stage');
  }
  // dc-runtime assigns window.DCLogic at init and mounts into #dc-root on
  // DOMContentLoaded; settle on that subtree so React has rendered before
  // print(). Non-DC pages fall through to weighing body.
  const isDc = !ds && 'DCLogic' in window;
  const settleRoot = ds || (isDc ? document.getElementById('dc-root') : null) || document.body;
  if (settleRoot) {
    // Weigh only content children — skip script/style/template so inline
    // Babel/CSS doesn't register as stable "content" before the framework
    // has mounted anything.
    const MEDIA = 'img,svg,canvas,video,picture,iframe,embed,object';
    const weigh = () => {
      let text = 0, media = 0;
      for (const c of settleRoot.children) {
        const t = c.tagName;
        if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
        text += (c.textContent || '').trim().length;
        media += c.querySelectorAll(MEDIA).length + (c.matches(MEDIA) ? 1 : 0);
      }
      return text + media * 100;
    };
    // "Non-zero and stable" alone is not sufficient to mean rendered: generic
    // body can carry a static shell while async main content is pending, and
    // #dc-root can carry the root DC's static text while child refs are still
    // .sc-placeholder boxes. Gate generic on readyState 'complete', and never
    // accept stability while a dc-runtime placeholder is present.
    const isGeneric = settleRoot === document.body;
    const deadline = Date.now() + 15000;
    let last = -1, stable = 0;
    while (Date.now() < deadline) {
      const n = weigh();
      const ready =
        (!isGeneric || document.readyState === 'complete') &&
        !settleRoot.querySelector('.sc-placeholder');
      if (n > 0 && n === last && ready) { if (++stable >= 2) break; } else { stable = 0; }
      last = n;
      await new Promise((r) => setTimeout(r, 250));
    }
  }
  try { await document.fonts.ready; } catch (e) {}
  // Jump every animation to its end state so print() never captures a slide
  // mid-entrance. Ordering matters: the 0s-transition style must be live
  // BEFORE data-deck-active is set so attribute-keyed transitions don't
  // start a (now-0s) run from the pre-active base.
  const st = document.createElement('style');
  st.textContent = '*,*::before,*::after{animation-delay:-99s !important;animation-duration:.001s !important;animation-iteration-count:1 !important;animation-fill-mode:both !important;animation-play-state:running !important;transition-duration:0s !important}';
  document.head.appendChild(st);
  for (const d of document.querySelectorAll('deck-stage')) {
    for (const c of d.children) {
      const t = c.tagName;
      if (t === 'SCRIPT' || t === 'STYLE' || t === 'TEMPLATE') continue;
      c.setAttribute('data-deck-active', '');
    }
  }
  try {
    const sweep = () => {
      for (const a of document.getAnimations()) {
        try { a.finish(); } catch (e) {
          try { a.currentTime = (a.effect && a.effect.getComputedTiming().duration) || 0; a.pause(); } catch (e2) {}
        }
      }
    };
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
    sweep();
    await new Promise((r) => requestAnimationFrame(r));
  } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 200);
})();
</script>
